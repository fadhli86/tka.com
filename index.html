function runTour(){
  const lat=S.mode==='latihan';
  const steps=[
    ['#qnoLbl','Nomor Soal','Menunjukkan nomor soal yang sedang kamu kerjakan dan bentuk soalnya.'],
    ['#fontGrp','Ukuran Font','Pilih ukuran huruf yang paling nyaman dibaca: kecil, sedang, atau besar.'],
    ['#timer',lat?'Waktu Berjalan':'Sisa Waktu',lat?'Menunjukkan berapa lama kamu sudah berlatih.':'Waktu dihitung mundur dari 75 menit. Jika habis, jawaban dikumpulkan otomatis.'],
    ['#openNav, #nav','Daftar Soal','Lihat semua nomor soal dan pindah ke nomor mana pun. Warnanya menunjukkan soal yang sudah dijawab atau ragu-ragu.'],
    ['#qcard .ctx, #qcard .qtext','Konteks Soal','Baca konteksnya dulu: cerita, gambar, tabel, atau diagram. Informasi penting ada di sini.'],
    ['#qcard .opts, #qcard .bs','Pilihan Jawaban','Pilih jawabanmu. Perhatikan petunjuknya: satu jawaban, lebih dari satu, atau Benar/Salah.'],
    ['#bPrev','Soal Sebelumnya','Kembali ke soal sebelumnya.'],
    [lat?'#streak':'#bRagu',lat?'Jawaban Beruntun':'Ragu-ragu',lat?'Jawab benar berturut-turut untuk poin bonus.':'Centang jika kamu belum yakin. Nomor soal akan berwarna kuning, dan jawabannya tetap dinilai.'],
    ['#bNext','Soal Berikutnya','Lanjut ke soal berikutnya. Di soal terakhir, tombol ini berubah menjadi Selesai.'],
  ];
  const vis=sel=>[...document.querySelectorAll(sel)].find(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.top<innerHeight&&r.bottom>-2000});
  const list=steps.map(s=>[vis(s[0]),s[1],s[2]]).filter(s=>s[0]);
  const block=document.createElement('div');block.className='tour-block';
  const hl=document.createElement('div');hl.className='tour-hl';
  const tip=document.createElement('div');tip.className='tour-tip';tip.setAttribute('role','dialog');tip.setAttribute('aria-live','polite');
  document.body.append(block,hl,tip);
  let i=0;
  const end=()=>{block.remove();hl.remove();tip.remove();store.toured=true;persist();window.removeEventListener('resize',place);begin();
    toast(S.mode==='ujian'?'Waktu mulai berjalan. Selamat mengerjakan!':'Selamat berlatih!')};
  function place(){
    const [el,t,d]=list[i],r=el.getBoundingClientRect(),pad=6;
    Object.assign(hl.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    tip.innerHTML=`<p class="tour-n">Panduan ${i+1} dari ${list.length}</p><h3>${t}</h3><p>${d}</p><div class="mact"><button class="btn ghost small" id="tSkip">Lewati</button><button class="btn small warm" id="tNext">${i===list.length-1?'Mulai mengerjakan':'Lanjut'}</button></div>`;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    let top=r.bottom+14;if(top+th>innerHeight-8)top=r.top-th-14;if(top<8)top=Math.max(8,Math.min(innerHeight-th-8,r.top+14));
    tip.style.top=top+'px';tip.style.left=Math.max(12,Math.min(innerWidth-tw-12,r.left+r.width/2-tw/2))+'px';
    $('#tSkip').onclick=end;$('#tNext').onclick=()=>{SND.click();i++;if(i>=list.length)end();else show1()};
    $('#tNext').focus();
  }
  function show1(){const el=list[i][0];const r=el.getBoundingClientRect();
    if(getComputedStyle(el).position!=='fixed'&&!el.closest('.xbar,.xfoot')&&(r.top<80||r.bottom>innerHeight-90))el.scrollIntoView({block:'center'});
    setTimeout(place,180)}
  window.addEventListener('resize',place);
  if(!list.length)end();else show1();
}
function cheer(){
  const n=S.ans.filter((_,j)=>filled(S,j)).length;S.cp=S.cp||[];
  const m={10:'Sudah 10 soal terjawab. Terus semangat!',20:'20 soal beres! Tinggal sedikit lagi.',30:'Semua soal sudah terjawab! Cek soal ragu-ragu, lalu tekan Selesai.'};

const FS=[[.92,'Kecil'],[1,'Sedang'],[1.18,'Besar']];
const fontGrp=(id,cls)=>`<div class="fontgrp ${cls||''}"${id?` id="${id}"`:''} role="group" aria-label="Ukuran font">${FS.map(([v,l],k)=>`<button data-fs="${v}" aria-label="Ukuran font ${l}" aria-pressed="false" style="font-size:${13+k*3}px">A</button>`).join('')}</div>`;

/* ---------- tampilan soal (dipakai ujian & pembahasan) ---------- */
function qBody(s,i,locked){
  const q=Q(s,i),t=typ(q),a=s.ans[i];
  const text=`<div class="qtext">${fmt(q.q)}</div>`;
  let h='';
  if(t==='mc')h+='<p class="hint">Jawaban benar <b>lebih dari satu</b>. Centang semua jawaban yang benar.</p>';
  if(t==='bs'){
    h+=`<p class="hint">Pilih <b>Benar</b> atau <b>Salah</b> untuk setiap pernyataan.</p><div class="bs"><div class="bs-h"><span>Pernyataan</span><span>Benar</span><span>Salah</span></div>`;
    q.s.forEach((st,j)=>{const v=a?a[j]:null;
      h+=`<div class="bs-r"><div class="bs-t">${fmt(st[0])}</div>`;
      [1,0].forEach(val=>{let c='bs-b';if(locked){c+=' locked';if(st[1]===val)c+=' right';else if(v===val)c+=' wrong'}else if(v===val)c+=' sel';
        h+=`<button class="${c}" data-j="${j}" data-v="${val}" aria-pressed="${v===val}" aria-label="Pernyataan ${j+1}: ${val?'Benar':'Salah'}"${locked?' tabindex="-1"':''}><span class="bs-dot"></span>${val?'Benar':'Salah'}</button>`});
      h+='</div>'});
    h+='</div>';
  }else{
    h+=`<div class="opts" role="${t==='mc'?'group':'radiogroup'}" aria-label="Pilihan jawaban">`;
    s.ord[i].forEach((oi,k)=>{
      const on=t==='mc'?(a||[]).includes(k):a===k, key=t==='mc'?q.k.includes(oi):oi===0;
      let c='opt'+(t==='mc'?' multi':''),mk='';
      if(locked){c+=' locked';if(key){c+=' right';mk=(t==='mc'&&!on)?'<span class="miss">belum dipilih</span>':I.ok}else if(on){c+=' wrong';mk=I.no}}
      else if(on)c+=' sel';
      h+=`<button class="${c}" data-k="${k}" role="${t==='mc'?'checkbox':'radio'}" aria-checked="${on}"${locked?' tabindex="-1"':''}><span class="let">${t==='mc'&&on&&!locked?'✓':LET[k]}</span><span class="otx">${fmt(q.o[oi])}</span>${mk}</button>`;
    });
    h+='</div>';
  }
  if(!q.f&&!q.x)return text+h;
  let lab='Konteks soal';
  if(q.x){const idx=PAKET[s.pid-1].soal.map((z,j)=>z.x===q.x?j+1:0).filter(Boolean);lab=idx.length>1?`Bacaan untuk soal nomor ${idx[0]}–${idx[idx.length-1]}`:`Bacaan untuk soal nomor ${idx[0]}`}
  return `<div class="split${q.x?' read':''}"><section class="ctx" aria-label="${lab}"><p class="pem-l">${lab}</p>${q.x?TEKS[q.x]:''}${q.f||''}</section><div class="qa">${text}${h}</div></div>`;
}
function keyText(s,i){
  const q=Q(s,i),t=typ(q);
  if(t==='pg')return `Jawaban yang benar: <b>${LET[s.ord[i].indexOf(0)]}. ${fmt(q.o[0])}</b>`;
  if(t==='mc')return `Jawaban yang benar: <b>${s.ord[i].map((oi,k)=>q.k.includes(oi)?LET[k]:null).filter(Boolean).join(', ')}</b>`;
  const a=s.ans[i]||[];return `Pernyataan yang tepat: <b>${q.s.filter((st,j)=>a[j]===st[1]).length} dari ${q.s.length}</b>. Kunci ditandai hijau.`;
}

function calc(){
  const qs=P().soal,dom={},lvl={},tp={};let right=0,empty=0;
  qs.forEach((q,i)=>{const t=typ(q);[[dom,q.d],[lvl,q.l],[tp,t]].forEach(([o,k])=>{o[k]=o[k]||[0,0];o[k][1]++});
    if(!filled(S,i))empty++;else if(isRight(i)){right++;dom[q.d][0]++;lvl[q.l][0]++;tp[t][0]++}});
  const score=Math.round(right/N*100),stars=score>=85?3:score>=70?2:score>=55?1:0;
  const kat=score>=85?['Istimewa','#128A58']:score>=70?['Baik','#2F6FEB']:score>=55?['Memadai','#B7791F']:['Kurang','#D33541'];
  const used=Math.round(((S.finishedAt||Date.now())-S.startAt)/1000);
  const xp=S.mode==='latihan'?S.xp+stars*10:right*10+stars*20;
  return {right,wrong:N-right-empty,empty,score,stars,kat,dom,lvl,tp,used:S.mode==='ujian'?Math.min(used,DUR):used,xp};
}
function finish(reason){
  clearInterval(tick);closeModal();
  if(S.mode==='latihan')P().soal.forEach((q,i)=>{if(typ(q)!=='pg'&&filled(S,i))S.chk[i]=true});
  S.done=true;S.finishedAt=Date.now();
  S.code=makeCode(S);store.hist=(store.hist||[]).concat(S.code).slice(-300);
  const r=calc();lastResult={S:JSON.parse(JSON.stringify(S)),r,reason};
  const b=store.best[S.pid];
  if(!b||r.score>b.score)store.best[S.pid]={score:r.score,stars:Math.max(r.stars,b?b.stars:0)};
  else if(r.stars>b.stars)b.stars=r.stars;
  store.xp+=r.xp;store.session=null;persist();
  renderResult();
}

/* ---------- KODE HASIL: siswa → guru (tanpa server) ---------- */
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const ck=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1679616;return h.toString(36).padStart(4,'0')};
const clean=(s,n)=>String(s||'').replace(/[|\n\r\t]/g,' ').trim().slice(0,n);
function makeCode(s){
  const p=PAKET[s.pid-1],marks=p.soal.map((q,i)=>!filled(s,i)?'-':rightOf(s,i)?'1':'0').join('');
  const used=Math.max(0,Math.round(((s.finishedAt||Date.now())-s.startAt)/1000));
  const raw=['T2',s.pid,s.mode==='ujian'?'U':'L',s.mode==='ujian'?Math.min(used,DUR):used,Math.round((s.finishedAt||Date.now())/60000).toString(36),marks,clean(s.name,30),clean(s.kelas,10)].join('|');
  const b=b64e(raw);return `TKA.${b}.${ck(b)}`;
}
function readCodes(text){
  const out=[],bad=[];const re=/TKA\.([A-Za-z0-9_-]{16,})\.([0-9a-z]{4})/g;let m;
  while((m=re.exec(text))){
    try{
      if(ck(m[1])!==m[2])throw 0;
      const f=b64d(m[1]).split('|');if(f[0]!=='T2')throw 0;
      const pid=+f[1],p=PAKET[pid-1];if(!p||f[5].length!==p.soal.length||!/^[01-]+$/.test(f[5]))throw 0;
      out.push({code:m[0],pid,mode:f[2],used:+f[3]||0,at:parseInt(f[4],36)*60000,marks:f[5],name:f[6]||'Tanpa nama',kelas:f[7]||''});
    }catch(e){bad.push(m[0])}
  }
  if(!out.length&&!bad.length&&text.trim())bad.push(text.trim().slice(0,30));
  return {out,bad};
}
const entScore=e=>{const r=[...e.marks].filter(c=>c==='1').length;return {right:r,wrong:[...e.marks].filter(c=>c==='0').length,empty:[...e.marks].filter(c=>c==='-').length,score:Math.round(r/e.marks.length*100)}};
const katOf=sc=>sc>=85?'Istimewa':sc>=70?'Baik':sc>=55?'Memadai':'Kurang';
function addToRekap(list){
  store.rekap=store.rekap||[];const have=new Set(store.rekap.map(e=>e.code));let n=0,dup=0;
  list.forEach(e=>{if(have.has(e.code))dup++;else{store.rekap.push(e);have.add(e.code);n++}});
  persist();return {n,dup};
}
function openKunci(pid){

function soalCetak(q,no){
  const t=typ(q);
  const text=`<div class="qtext">${fmt(q.q)}</div>`;let h='';
  if(t==='mc')h+='<p class="hint">Pilihlah <b>semua</b> jawaban yang tepat (bisa lebih dari satu).</p>';
  if(t==='bs'){
    h+=`<div class="bs"><div class="bs-h"><span>Pernyataan</span><span>Benar</span><span>Salah</span></div>`;
    q.s.forEach(st=>{h+=`<div class="bs-r"><div class="bs-t">${fmt(st[0])}</div><div class="bs-b"><span class="bs-dot"></span>Benar</div><div class="bs-b"><span class="bs-dot"></span>Salah</div></div>`});
    h+='</div>';

    h+=`<div class="opts">`+q.o.map((o,k)=>`<div class="opt"><span class="let">${LET[k]}</span><span class="otx">${fmt(o)}</span></div>`).join('')+`</div>`;
  }
  return `<div class="pq"><div class="qhead"><span class="qno">Soal <b>${no}</b></span><span class="typechip">${TYP[t]}</span><span class="chip lv">${LVL[q.l]}</span></div>${(!q.f&&!q.x)?text+h:`<div class="split${q.x?' read':''}"><section class="ctx">${q.x?TEKS[q.x]:''}${q.f||''}</section><div class="qa">${text}${h}</div></div>`}</div>`;
}

async function copyText(txt,el){
  try{await navigator.clipboard.writeText(txt);toast('Tersalin. Tinggal tempel (paste) di tujuan.');return true}
  catch(e){if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
    toast('Salin otomatis tidak didukung di sini. Teks sudah diblok, tekan Ctrl+C atau tahan lalu pilih Salin.',3800);return false}
}
async function saveFile(name,text){
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:'\ufeff'+text});toast('File disimpan.');return}}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){toast('File belum bisa disimpan. Coba lagi sebentar.');return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('File sedang diunduh.')}
  catch(e){toast('Unduhan tidak didukung di sini. Gunakan tombol Salin tabel lalu tempel ke Excel.',3800)}
}

/* ---------- konfeti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.hidden=false;const W=c.width=innerWidth,H=c.height=innerHeight;
  const col=['#FFC23D','#E8622A','#2F6FEB','#128A58','#C2366A','#5B43D6'];
  const ps=Array.from({length:160},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:pick(col)}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(t-t0<3800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0);
}

  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  if($('#scr-exam').hidden||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4};
  if(k in map){const b=document.querySelector(`#qcard .opt[data-k="${map[k]}"]`);if(b){e.preventDefault();b.click()}}
  else if(e.key==='ArrowRight'){e.preventDefault();go(S.cur+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(S.cur-1)}
});
window.addEventListener('beforeunload',()=>{if(S&&!S.done)saveS()});

renderHome();
</script>
