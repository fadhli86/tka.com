<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi TKA SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#EDF3FF; --gridc:rgba(47,111,235,.09); --card:#FFFFFF; --card2:#F5F8FF; --ink:#18223F; --muted:#54628A; --line:#D3DDF3;
  --pri:#2F6FEB; --pri2:#1C4FB8; --on-pri:#FFFFFF; --soft:#E2EBFF;
  --acc:#F2692E; --sun:#FFC23D; --sun-ink:#4A3200;
  --ok:#128A58; --ok-soft:#DBF5E8; --bad:#D33541; --bad-soft:#FDE3E4; --warn:#9A6400; --warn-soft:#FFF0C7;
  --shadow:0 2px 0 rgba(24,34,63,.06), 0 12px 26px -14px rgba(24,34,63,.28);
  --fd:'Fredoka','Nunito',system-ui,sans-serif;
  --fb:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --qs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1729; --gridc:rgba(120,160,255,.07); --card:#16223B; --card2:#1B2946; --ink:#E9EFFF; --muted:#A0ADCD; --line:#2B3B60;
    --pri:#709FFF; --pri2:#3F6BD0; --on-pri:#0A1330; --soft:#1F3158;
    --acc:#FF9160; --sun:#FFCF5C; --sun-ink:#3A2800;
    --ok:#43D69B; --ok-soft:#123A2B; --bad:#FF6F78; --bad-soft:#401C23; --warn:#FFCF5C; --warn-soft:#3A2F12;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 14px 30px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1729; --gridc:rgba(120,160,255,.07); --card:#16223B; --card2:#1B2946; --ink:#E9EFFF; --muted:#A0ADCD; --line:#2B3B60;
  --pri:#709FFF; --pri2:#3F6BD0; --on-pri:#0A1330; --soft:#1F3158;
  --acc:#FF9160; --sun:#FFCF5C; --sun-ink:#3A2800;
  --ok:#43D69B; --ok-soft:#123A2B; --bad:#FF6F78; --bad-soft:#401C23; --warn:#FFCF5C; --warn-soft:#3A2F12;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 14px 30px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--fb); font-size:16px; line-height:1.55; color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--fd); line-height:1.15; margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--acc); outline-offset:2px; border-radius:10px}
.wrap{max-width:1120px; margin:0 auto; padding-inline:16px}
.screen{padding-block:16px 40px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--fd); font-weight:600; font-size:1.02rem; letter-spacing:.01em;
  border:0; border-radius:14px; padding:12px 20px; min-height:48px;
  background:var(--pri); color:var(--on-pri); box-shadow:0 4px 0 var(--pri2);
  transition:transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--pri2)}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); border:2px solid var(--line)}
.btn.warm{background:var(--acc); color:#fff; box-shadow:0 4px 0 #B84A18}
.btn.okb{background:var(--ok); color:#fff; box-shadow:0 4px 0 #0B5E3C}
.btn.small{min-height:40px; padding:8px 14px; font-size:.95rem; border-radius:12px}
.btn[disabled]{opacity:.45; pointer-events:none}
.iconbtn{
  display:inline-grid; place-items:center; width:42px; height:42px; border-radius:12px;
  background:var(--card); border:2px solid var(--line); color:var(--ink);
}
.iconbtn svg{width:22px; height:22px}
.ico{width:20px; height:20px; flex:none}

/* ---------- home ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:6px 14px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--fd); font-weight:700; font-size:1.25rem}
.brand .mark{
  width:40px; height:40px; border-radius:12px; background:var(--pri); color:var(--on-pri);
  display:grid; place-items:center; font-size:1.35rem; box-shadow:0 3px 0 var(--pri2); transform:rotate(-6deg)
}
.purse{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
  background:var(--card); border:2px solid var(--line); font-weight:800; font-size:.9rem;
  font-variant-numeric:tabular-nums;
}
.pill .ico{width:18px;height:18px}
.pill.sun .ico{color:var(--sun)}
.pill.fire .ico{color:var(--acc)}

.hero{
  display:grid; grid-template-columns:1.35fr .9fr; gap:24px; align-items:center;
  background:var(--card); border:2px solid var(--line); border-radius:28px; padding:28px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; right:-60px; bottom:-80px; width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle,var(--soft) 0 60%,transparent 61%); z-index:0;
}
.hero > *{position:relative; z-index:1}
.eyebrow{font-weight:800; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--pri)}
.hero h1{font-size:clamp(1.7rem,4vw,2.6rem); margin-top:8px}
.hero h1 .nm{color:var(--acc)}
.hero .lead{margin-top:10px; color:var(--muted); max-width:56ch}
.field{margin-top:18px; display:grid; gap:6px; max-width:420px}
.field label{font-weight:800; font-size:.9rem}
.field input{
  font:inherit; font-weight:700; padding:12px 14px; border-radius:14px; border:2px solid var(--line);
  background:var(--card2); color:var(--ink); min-height:48px;
}
.field input:focus{outline:none; border-color:var(--pri)}
.seg{margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:560px}
.seg button{
  text-align:left; border:2px solid var(--line); background:var(--card2); border-radius:16px; padding:12px 14px;
  display:grid; gap:2px; transition:border-color .15s, background .15s;
}
.seg button b{font-family:var(--fd); font-weight:600; font-size:1.05rem; display:flex; align-items:center; gap:8px}
.seg button small{color:var(--muted); font-size:.82rem; line-height:1.35}
.seg button[aria-pressed="true"]{border-color:var(--pri); background:var(--soft)}
.seg button[aria-pressed="true"] b::after{
  content:""; width:10px; height:10px; border-radius:50%; background:var(--pri); margin-left:auto;
}
.hero-art{display:grid; justify-items:center; gap:10px}
.bubble{
  background:var(--card2); border:2px solid var(--line); border-radius:18px; padding:10px 14px; font-weight:700;
  max-width:260px; text-align:center; position:relative; font-size:.95rem;
}
.bubble::after{
  content:""; position:absolute; left:50%; bottom:-9px; width:16px; height:16px; background:var(--card2);
  border-right:2px solid var(--line); border-bottom:2px solid var(--line); transform:translateX(-50%) rotate(45deg);
}
.owl{width:min(200px,60vw); height:auto}
.owl .lid{transform-origin:center; animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.owl.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

.resume{
  margin-top:18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  background:var(--warn-soft); border:2px dashed var(--warn); border-radius:20px; padding:14px 18px;
}
.resume p{flex:1 1 260px; font-weight:700}
.resume small{display:block; font-weight:600; color:var(--muted)}

.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 0 14px; flex-wrap:wrap}
.sec-h h2{font-size:1.6rem}
.sec-h p{color:var(--muted); font-weight:600}
.worlds{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
.world{
  background:var(--card); border:2px solid var(--line); border-radius:24px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:var(--shadow); transition:transform .15s;
}
.world:hover{transform:translateY(-3px)}
.w-art{background:var(--wc); height:120px; display:grid; place-items:center; position:relative; overflow:hidden}
.w-art svg{width:100%; height:100%}
.w-num{
  position:absolute; left:12px; top:10px; font-family:var(--fd); font-weight:700; color:#fff;
  font-size:.85rem; background:rgba(0,0,0,.18); padding:3px 10px; border-radius:999px; letter-spacing:.04em
}
.w-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
.w-body h3{font-size:1.3rem}
.w-meta{color:var(--muted); font-weight:700; font-size:.88rem}
.stars{display:flex; gap:3px}
.stars svg{width:22px; height:22px}
.stars .on{color:var(--sun)}
.stars .off{color:var(--line)}
.w-best{font-size:.85rem; font-weight:700; color:var(--muted); min-height:1.3em}
.w-body .btn{margin-top:auto; width:100%; background:var(--wc); box-shadow:0 4px 0 rgba(0,0,0,.28); color:#fff}

.infos{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:18px}
.info{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:18px}
.info h3{font-size:1.15rem; margin-bottom:10px}
.info ul{margin:0; padding-left:20px; display:grid; gap:4px}
.info li::marker{color:var(--pri)}
.drow{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); font-weight:700}
.drow:last-child{border-bottom:0}
.drow span:last-child{font-variant-numeric:tabular-nums; color:var(--muted)}
.dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; vertical-align:middle}
.foot{margin-top:28px; text-align:center; color:var(--muted); font-size:.85rem}

/* ---------- ready (kartu peserta) ---------- */
.ready{max-width:720px; margin:0 auto}
.ticket{
  background:var(--card); border:2px solid var(--line); border-radius:26px; overflow:hidden; box-shadow:var(--shadow);
}
.ticket-top{background:var(--wc,var(--pri)); color:#fff; padding:18px 22px; display:flex; gap:14px; align-items:center}
.ticket-top h2{font-size:1.5rem}
.ticket-top p{opacity:.9; font-weight:700}
.ticket-body{padding:20px 22px; display:grid; gap:16px}
.kv{display:grid; grid-template-columns:repeat(2,1fr); gap:10px 18px}
.kv div{display:grid; gap:2px; padding:10px 12px; background:var(--card2); border-radius:14px; border:1px solid var(--line)}
.kv span{font-size:.75rem; letter-spacing:.07em; text-transform:uppercase; font-weight:800; color:var(--muted)}
.kv b{font-family:var(--fd); font-weight:600; font-size:1.1rem; font-variant-numeric:tabular-nums}
.rules{margin:0; padding-left:22px; display:grid; gap:6px}
.rules li::marker{font-family:var(--fd); font-weight:700; color:var(--pri)}
.ready-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end}
.perf{border-top:2px dashed var(--line); margin:0 -22px; }

/* ---------- exam ---------- */
#scr-exam{padding-top:0; padding-bottom:110px}
.xbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--card);
  border-bottom:2px solid var(--line); box-shadow:0 6px 16px -14px rgba(0,0,0,.4);
}
.xbar-in{display:flex; align-items:center; gap:10px; min-height:62px; flex-wrap:nowrap}
.xtitle{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
.xtitle .badge{
  width:38px; height:38px; border-radius:11px; background:var(--wc); color:#fff; display:grid; place-items:center;
  font-family:var(--fd); font-weight:700; flex:none
}
.xtitle div{min-width:0}
.xtitle b{font-family:var(--fd); font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.xtitle small{color:var(--muted); font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.timer{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--fd); font-weight:600; font-size:1.15rem;
  padding:6px 12px; border-radius:12px; background:var(--soft); color:var(--ink); font-variant-numeric:tabular-nums; flex:none
}
.timer.warn{background:var(--warn-soft); color:var(--warn)}
.timer.danger{background:var(--bad-soft); color:var(--bad); animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.xtools{display:flex; gap:6px; flex:none}
.prog{height:6px; background:var(--soft)}
.prog i{display:block; height:100%; background:var(--ok); width:0; transition:width .3s; border-radius:0 6px 6px 0}

.xgrid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; margin-top:16px}
.qcard{background:var(--card); border:2px solid var(--line); border-radius:24px; padding:22px; box-shadow:var(--shadow); min-width:0}
.qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.qno{
  font-family:var(--fd); font-weight:600; font-size:1.05rem; background:var(--pri); color:var(--on-pri);
  padding:6px 14px; border-radius:12px;
}
.qno span{opacity:.8; font-weight:500}
.chip{font-size:.8rem; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--soft); color:var(--ink)}
.chip.lv{background:var(--card2); border:1px solid var(--line); color:var(--muted)}
.ragu-tag{margin-left:auto; font-weight:800; font-size:.8rem; color:var(--warn); background:var(--warn-soft); padding:4px 10px; border-radius:999px}
.qtext{font-size:calc(1.08rem * var(--qs)); line-height:1.7; max-width:70ch}
.qtext b{font-weight:800}
.fig{margin:16px 0 4px; display:grid; gap:8px; justify-items:start}
.fig figcaption{font-weight:800; font-size:calc(.9rem * var(--qs)); color:var(--muted)}
.fig-wrap{overflow-x:auto; max-width:100%; padding:10px; background:var(--card2); border:1px solid var(--line); border-radius:16px}
.fig-svg{display:block; width:100%; height:auto}
.opts{display:grid; gap:10px; margin-top:18px}
.opt{
  display:flex; gap:14px; align-items:center; text-align:left; width:100%;
  padding:12px 14px; border-radius:16px; border:2px solid var(--line); background:var(--card2);
  font-size:calc(1.02rem * var(--qs)); font-weight:600; min-height:56px; transition:border-color .12s, background .12s, transform .08s;
}
.opt:hover{border-color:var(--pri)}
.opt:active{transform:scale(.99)}
.opt .let{
  flex:none; width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
  font-family:var(--fd); font-weight:700; background:var(--card); border:2px solid var(--line);
}
.opt .otx{flex:1; min-width:0}
.opt.sel{border-color:var(--pri); background:var(--soft)}
.opt.sel .let{background:var(--pri); color:var(--on-pri); border-color:var(--pri)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .let{background:var(--ok); color:#fff; border-color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad); color:#fff; border-color:var(--bad)}
.opt.locked{cursor:default}
.opt .mk{flex:none; width:24px; height:24px}
.hint{
  margin-top:14px; display:flex; gap:8px; align-items:center; font-weight:700; font-size:.92rem;
  background:var(--warn-soft); border:2px dashed var(--sun); border-radius:12px; padding:8px 12px; width:fit-content; max-width:100%
}
.opt.multi .let{border-radius:8px}
.miss{flex:none; font-size:.75rem; font-weight:800; color:var(--ok); background:var(--card); border:1px solid var(--ok); padding:2px 8px; border-radius:999px}
.chkrow{margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.chkrow small{color:var(--muted); font-weight:700}
.bs{margin-top:14px; border:2px solid var(--line); border-radius:16px; overflow:hidden}
.bs-h,.bs-r{display:grid; grid-template-columns:minmax(0,1fr) 104px 104px; gap:8px; align-items:center; padding:10px 12px}
.bs-h{background:var(--soft); font-weight:800; font-size:.85rem}
.bs-h span:not(:first-child){text-align:center}
.bs-r{border-top:1px solid var(--line); background:var(--card2)}
.bs-t{font-size:calc(1rem * var(--qs)); font-weight:600}
.bs-b{
  display:flex; align-items:center; justify-content:center; gap:7px; min-height:44px; border-radius:12px;
  border:2px solid var(--line); background:var(--card); font-weight:800; font-size:.92rem; padding:0 8px
}
.bs-dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--muted); flex:none; background:var(--card)}
.bs-b.sel{border-color:var(--pri); background:var(--soft)}
.bs-b.sel .bs-dot{border-color:var(--pri); background:radial-gradient(circle,var(--pri) 0 42%,var(--card) 48%)}
.bs-b.right{border-color:var(--ok); background:var(--ok-soft)}
.bs-b.right .bs-dot{border-color:var(--ok); background:var(--ok)}
.bs-b.wrong{border-color:var(--bad); background:var(--bad-soft)}
.bs-b.wrong .bs-dot{border-color:var(--bad); background:var(--bad)}
.bs-b.locked{cursor:default}
.typechip{font-size:.8rem; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--card2); border:1px dashed var(--muted); color:var(--ink)}
@media (max-width:560px){
  .bs-h{display:none}
  .bs-r{grid-template-columns:1fr 1fr}
  .bs-t{grid-column:1/-1}
}
/* alur masuk seperti aplikasi TKA */
.stepper{list-style:none; margin:0 0 16px; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stepper li{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:var(--card); border:2px solid var(--line); font-size:.85rem; color:var(--muted); min-width:0}
.stepper li b{font-weight:800; line-height:1.2}
.stepper li span{flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-family:var(--fd); font-weight:700; background:var(--card2); border:2px solid var(--line)}
.stepper li.now{border-color:var(--pri); color:var(--ink)}
.stepper li.now span{background:var(--pri); color:var(--on-pri); border-color:var(--pri)}
.stepper li.done{color:var(--ok)}
.stepper li.done span{background:var(--ok); color:#fff; border-color:var(--ok)}
.login-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:18px; align-items:start}
.lform{display:grid; gap:12px}
.lform .field{margin-top:0; max-width:none}
.lform input[readonly]{color:var(--muted)}
.ferr{color:var(--bad); font-weight:800; background:var(--bad-soft); padding:8px 12px; border-radius:12px}
.kartu{border:2px dashed var(--line); border-radius:18px; padding:16px; background:var(--card2); display:grid; gap:10px}
.kartu-h{font-weight:800; letter-spacing:.1em; font-size:.78rem; color:var(--muted)}
.kartu dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px}
.kartu dt{font-weight:700; color:var(--muted)}
.kartu dd{margin:0; font-family:var(--fd); font-weight:600; font-variant-numeric:tabular-nums}
.kartu-n{font-size:.82rem; color:var(--muted); font-weight:600}
.board{border-radius:18px; padding:18px; background:#1F4D3A; color:#EAF6EE; border:8px solid #9C6B3E; display:grid; gap:4px; text-align:center; box-shadow:var(--shadow)}
.board-h{font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; opacity:.85; font-weight:800}
.board-t{font-family:var(--fd); font-size:1rem; opacity:.9}
.board-v{font-family:var(--fd); font-weight:700; font-size:2.2rem; letter-spacing:.25em; padding-left:.25em}
.board-n{font-size:.82rem; color:#CFE6D8; font-weight:600}
.ctab{width:100%; border-collapse:collapse}
.ctab th,.ctab td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
.ctab th{width:40%; color:var(--muted); font-weight:700; font-size:.9rem}
.ctab td{font-weight:700}
.tag{background:var(--ok-soft); color:var(--ok); padding:2px 10px; border-radius:999px; font-size:.85rem}
.tourchk{display:flex; gap:10px; align-items:center; font-weight:700; background:var(--soft); border-radius:14px; padding:10px 12px; cursor:pointer}
.tourchk input{width:20px; height:20px; accent-color:var(--pri); flex:none}
/* layar ujian: konteks soal di kiri, pertanyaan di kanan */
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start}
.ctx{background:var(--card2); border:2px solid var(--line); border-radius:18px; padding:14px; position:sticky; top:92px}
.ctx .fig{margin:6px 0 0}
.ctx .fig-wrap{background:var(--card)}
.qa{min-width:0}
.fontgrp{display:inline-flex; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); flex:none}
.fontgrp button{border:0; background:transparent; width:38px; height:38px; font-weight:800; font-family:var(--fb); padding:0}
.fontgrp button+button{border-left:2px solid var(--line)}
.fontgrp button[aria-pressed="true"]{background:var(--pri); color:var(--on-pri)}
.navbtn{display:inline-flex; align-items:center; gap:6px; height:42px; padding:0 12px; border-radius:12px; background:var(--card); border:2px solid var(--line); font-weight:800; font-size:.85rem}
.navbtn svg{width:20px; height:20px}
.timer .tl{font-family:var(--fb); font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; opacity:.85}
/* panduan layar ujian */
.tour-block{position:fixed; inset:0; z-index:94}
.tour-hl{position:fixed; z-index:95; border-radius:14px; box-shadow:0 0 0 4px var(--sun), 0 0 0 200vmax rgba(8,14,30,.62); pointer-events:none; transition:all .25s ease}
.tour-tip{position:fixed; z-index:96; width:min(330px,calc(100vw - 24px)); background:var(--card); border:2px solid var(--sun); border-radius:18px; padding:16px; box-shadow:var(--shadow); display:grid; gap:8px}
.tour-tip h3{font-size:1.2rem}
.tour-tip .mact{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.tour-n{font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
@media (max-width:1060px){ .split{grid-template-columns:1fr} .ctx{position:static} }
@media (max-width:720px){ .login-grid{grid-template-columns:1fr} .board{order:-1} }
@media (max-width:560px){
  .timer .tl{display:none} .navbtn span{display:none}
  .stepper li{flex-direction:column; text-align:center; padding:8px 6px}
  .stepper li b{font-size:.72rem}
}
.subj{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:14px; max-width:620px}
.subj button{text-align:left; display:grid; gap:2px; padding:12px 16px; border-radius:16px; border:2px solid var(--line); background:var(--card)}
.subj button b{font-family:var(--fd); font-weight:600; font-size:1.1rem; display:flex; align-items:center; gap:8px}
.subj button small{color:var(--muted); font-weight:700; font-size:.82rem}
.subj button[aria-selected="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.subj button[aria-selected="true"] small{color:var(--bg); opacity:.8}
.matgrid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); max-width:none}
.worlds.n2{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:620px}
.teks{font-size:calc(1rem * var(--qs)); line-height:1.75; display:grid; gap:10px; margin-top:6px}
.teks h4{font-family:var(--fd); font-weight:600; font-size:1.15em; text-align:center; line-height:1.3; margin:0}
.teks h4 small{font-family:var(--fb); font-weight:700; font-size:.75em; color:var(--muted)}
.teks p{text-indent:1.5em}
.teks p b:first-child:not(:only-child){text-indent:0}
.teks ol{margin:0; padding-left:1.4em; display:grid; gap:4px}
.teks .fig-wrap{text-indent:0}
.teks.puisi p{text-indent:0; text-align:center; font-style:italic}
.teks.poster{border:3px dashed var(--acc); border-radius:16px; padding:14px; background:var(--card)}
.teks.poster p{text-indent:0}
.poster-h{font-family:var(--fd); font-weight:700; color:var(--acc); text-align:center; letter-spacing:.1em}
.poster-t{text-align:center; font-weight:800}
.teks dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px}
.teks dt{font-weight:800} .teks dd{margin:0}
.split.read{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.split.read .ctx{max-height:calc(100vh - 190px); overflow:auto}
@media (max-width:1060px){ .split.read{grid-template-columns:1fr} .split.read .ctx{max-height:none} }
@media (max-width:560px){ .worlds.n2{grid-template-columns:1fr} }
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.teks.surat p,.teks.drama p{text-indent:0}
.teks.drama p{padding-left:4.2em; text-indent:-4.2em}
.teks.drama p:nth-of-type(1){padding-left:0; text-indent:0}
.codebox{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace; font-size:.9rem; word-break:break-all; background:var(--card2); border:2px dashed var(--ok); border-radius:14px; padding:12px 14px; margin:10px 0; user-select:all}
.gnote{color:var(--muted); font-weight:600; font-size:.9rem}
.gact{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.gmsg{margin-top:10px; font-weight:800; color:var(--ok); min-height:1.2em}
#scr-guru{display:grid; gap:16px}
#scr-guru[hidden]{display:none}
#scr-guru textarea{width:100%; font:600 .95rem ui-monospace,Consolas,monospace; border:2px solid var(--line); border-radius:14px; padding:10px 12px; margin:10px 0; background:var(--card2); color:var(--ink); resize:vertical}
#scr-guru textarea:focus{outline:none; border-color:var(--pri)}
.gfilter{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.gfilter label{display:grid; gap:4px; font-weight:800; font-size:.85rem}
.gfilter select{font:inherit; font-weight:700; padding:10px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); min-width:0}
.gstat{grid-template-columns:repeat(4,1fr) 1.6fr}
.stat.kats{display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:center; align-items:center; font-size:.85rem; font-weight:700; color:var(--muted)}
.stat.kats b{display:inline; font-size:1rem; color:var(--ink)}
.gtop{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.gtop h3{margin:0}
.gtable{overflow-x:auto}
.rtab{width:100%; font-size:.9rem}
.rtab td.tl{text-align:left; font-weight:800}
.sortb{border:0; background:none; font:inherit; font-weight:800; color:inherit; padding:0; cursor:pointer}
.kpill{font-size:.78rem; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap}
.k-Istimewa{background:var(--ok-soft); color:var(--ok)}
.k-Baik{background:var(--soft); color:var(--pri)}
.k-Memadai{background:var(--warn-soft); color:var(--warn)}
.k-Kurang{background:var(--bad-soft); color:var(--bad)}
.xdel{border:0; background:none; color:var(--muted); font-weight:800; width:32px; height:32px; border-radius:8px}
.xdel:hover{background:var(--bad-soft); color:var(--bad)}
.ana{display:grid; gap:8px; margin-top:10px}
.ana-r{display:grid; grid-template-columns:32px minmax(0,1fr) 48px; gap:10px; align-items:center; padding:6px 8px; border-radius:12px}
.ana-r.low{background:var(--bad-soft)}
.ana-r > b{font-family:var(--fd); text-align:center}
.ana-m{display:grid; gap:4px; min-width:0}
.ana-t{font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ana-s{color:var(--muted); font-weight:600}
.ana-p{font-weight:800; text-align:right; font-variant-numeric:tabular-nums}
@media (max-width:720px){ .gfilter{grid-template-columns:1fr 1fr} .gstat{grid-template-columns:repeat(2,1fr)} .stat.kats{grid-column:1/-1} }
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.1; margin:0 2px; font-size:.92em}
.frac > span:first-child{border-bottom:2px solid currentColor; padding:0 3px}
.frac > span:last-child{padding:0 3px}
.mix{margin-right:1px}

.fb{margin-top:16px; border-radius:18px; padding:16px; display:grid; gap:10px; border:2px solid}
.fb.ok{background:var(--ok-soft); border-color:var(--ok)}
.fb.no{background:var(--bad-soft); border-color:var(--bad)}
.fb-h{display:flex; align-items:center; gap:10px; font-family:var(--fd); font-weight:600; font-size:1.15rem}
.fb-h .xp{margin-left:auto; font-family:var(--fb); font-weight:800; font-size:.9rem; background:var(--sun); color:var(--sun-ink); padding:3px 10px; border-radius:999px}
.fb-h img, .fb-h svg.owl-mini{width:44px; height:44px}
.pem{font-size:calc(.98rem * var(--qs)); line-height:1.7}
.pem-l{font-weight:800; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.side{
  position:sticky; top:84px; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:18px;
  display:grid; gap:14px; box-shadow:var(--shadow);
}
.side h3{font-size:1.1rem}
.who{display:grid; gap:2px; padding:10px 12px; border-radius:14px; background:var(--card2); border:1px solid var(--line)}
.who small{color:var(--muted); font-weight:700; font-size:.78rem}
.who b{font-family:var(--fd); font-weight:600}
.nav{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
.nav button{
  aspect-ratio:1; max-width:100%; border-radius:11px; border:2px solid var(--line); background:var(--card2);
  font-weight:800; font-size:.92rem; font-variant-numeric:tabular-nums; position:relative; padding:0
}
.nav button.ans{background:var(--pri); border-color:var(--pri); color:var(--on-pri)}
.nav button.rg{background:var(--sun); border-color:var(--sun); color:var(--sun-ink)}
.nav button.ok{background:var(--ok); border-color:var(--ok); color:#fff}
.nav button.no{background:var(--bad); border-color:var(--bad); color:#fff}
.nav button.cur{outline:3px solid var(--acc); outline-offset:1px}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:.8rem; font-weight:700; color:var(--muted)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:5px; vertical-align:-1px; border:2px solid var(--line)}
.side-actions{display:grid; gap:10px}
.scrim{position:fixed; inset:0; background:rgba(8,14,30,.45); z-index:39}
.sheet-h{display:none}

.xfoot{
  position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.xfoot-in{display:flex; gap:10px; align-items:center; justify-content:space-between; min-height:74px}
.xfoot .btn{min-width:0}
.ragu{
  display:inline-flex; align-items:center; gap:8px; font-weight:800; padding:10px 14px; border-radius:14px;
  background:var(--warn-soft); border:2px solid var(--sun); color:var(--ink); min-height:48px
}
.ragu .box{width:22px; height:22px; border-radius:6px; border:2px solid var(--warn); display:grid; place-items:center; background:var(--card)}
.ragu[aria-pressed="true"] .box{background:var(--sun); border-color:var(--sun)}
.ragu[aria-pressed="true"] .box::after{content:""; width:10px; height:6px; border-left:3px solid var(--sun-ink); border-bottom:3px solid var(--sun-ink); transform:rotate(-45deg) translate(1px,-1px)}
.streak{display:inline-flex; align-items:center; gap:6px; font-weight:800; padding:8px 12px; border-radius:14px; background:var(--card2); border:2px solid var(--line); font-variant-numeric:tabular-nums}
.streak .ico{color:var(--acc)}

.toast{
  position:fixed; left:50%; top:calc(78px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:60;
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:14px; font-weight:800; box-shadow:var(--shadow);
  max-width:calc(100% - 32px); text-align:center
}
.floatxp{position:fixed; z-index:61; font-family:var(--fd); font-weight:700; color:var(--sun-ink); background:var(--sun); padding:4px 12px; border-radius:999px; pointer-events:none; animation:floatup 1s ease-out forwards}
@keyframes floatup{from{opacity:1; transform:translateY(0)}to{opacity:0; transform:translateY(-50px)}}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:16px; background:rgba(8,14,30,.55)}
.modal[hidden]{display:none}
.mbox{
  width:min(460px,100%); background:var(--card); border:2px solid var(--line); border-radius:24px; padding:22px;
  display:grid; gap:14px; box-shadow:var(--shadow); animation:pop .2s ease-out; max-height:calc(100vh - 32px); overflow:auto
}
@keyframes pop{from{transform:scale(.94); opacity:0}}
.mbox h3{font-size:1.35rem}
.mbox .mact{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.mstats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.mstats div{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:10px; text-align:center}
.mstats b{display:block; font-family:var(--fd); font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums}
.mstats span{font-size:.78rem; font-weight:800; color:var(--muted)}

/* ---------- result ---------- */
.res{max-width:900px; margin:0 auto; display:grid; gap:18px}
.res-hero{
  background:var(--card); border:2px solid var(--line); border-radius:28px; padding:24px; box-shadow:var(--shadow);
  display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:center
}
.ring{
  --p:0; width:170px; height:170px; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(var(--rc,var(--ok)) calc(var(--p) * 1%), var(--soft) 0);
}
.ring > div{width:134px; height:134px; border-radius:50%; background:var(--card); display:grid; place-items:center; text-align:center}
.ring b{font-family:var(--fd); font-size:3rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.ring small{font-weight:800; color:var(--muted); font-size:.8rem}
.res-hero h2{font-size:clamp(1.6rem,3.5vw,2.2rem)}
.res-hero .stars svg{width:40px; height:40px}
.kat{display:inline-flex; align-items:center; gap:8px; margin-top:8px; font-weight:800; padding:6px 14px; border-radius:999px; background:var(--soft)}
.res-hero p.msg{margin-top:10px; color:var(--muted); font-weight:600; max-width:52ch}
.statrow{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
.stat{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:12px; text-align:center}
.stat b{display:block; font-family:var(--fd); font-size:1.6rem; font-weight:600; font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem; font-weight:800; color:var(--muted)}
.stat.g b{color:var(--ok)} .stat.r b{color:var(--bad)}
.panel{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:20px}
.panel h3{font-size:1.2rem; margin-bottom:12px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.meter{display:grid; gap:6px; margin-bottom:12px}
.meter:last-child{margin-bottom:0}
.meter-top{display:flex; justify-content:space-between; font-weight:800; font-size:.92rem}
.meter-top span:last-child{color:var(--muted); font-variant-numeric:tabular-nums}
.bar{height:12px; border-radius:999px; background:var(--soft); overflow:hidden}
.bar i{display:block; height:100%; border-radius:999px; background:var(--pri)}
.badges{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.bdg{display:grid; justify-items:center; gap:6px; text-align:center; padding:12px 8px; border-radius:16px; background:var(--card2); border:2px solid var(--line)}
.bdg svg{width:44px; height:44px}
.bdg b{font-size:.85rem; line-height:1.25}
.bdg small{font-size:.72rem; color:var(--muted); font-weight:700; line-height:1.3}
.bdg.off{opacity:.45; filter:grayscale(1)}
.res-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.note{font-size:.85rem; color:var(--muted); text-align:center}

/* ---------- review ---------- */
.rv-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between; margin-bottom:14px}
.filters{display:flex; gap:8px; flex-wrap:wrap}
.filters button{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; font-weight:800}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.rv-list{display:grid; gap:14px; max-width:860px; margin:0 auto}
.rv{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:18px}
.rv .opts{margin-top:12px}
.rv .opt{cursor:default; min-height:48px}
.st{font-weight:800; font-size:.8rem; padding:4px 10px; border-radius:999px}
.st.ok{background:var(--ok-soft); color:var(--ok)} .st.no{background:var(--bad-soft); color:var(--bad)} .st.em{background:var(--card2); color:var(--muted); border:1px solid var(--line)}
.rv .pembox{margin-top:12px; background:var(--card2); border:1px dashed var(--line); border-radius:16px; padding:12px 14px}

/* tables & figures inside questions */
.dtab{border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:calc(.98rem * var(--qs)); min-width:max-content}
.dtab th,.dtab td{border:2px solid var(--line); padding:8px 14px; text-align:center}
.dtab thead th{background:var(--soft)}
.dtab tbody th{text-align:left; background:var(--card)}
.picto td{text-align:left}
.picto td svg{display:inline-block; margin-right:3px; vertical-align:middle}
.p-book{fill:var(--pri)} .p-spine{fill:var(--pri2)} .p-ln{stroke:var(--on-pri); stroke-width:2; stroke-linecap:round}
.s-grid{stroke:var(--line); stroke-width:1}
.s-axis{stroke:var(--ink); stroke-width:2}
.s-bar{fill:var(--pri)}
.s-line{stroke:var(--ink); stroke-width:2.5; fill:none; stroke-linejoin:round}
.s-fill{fill:var(--soft); stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round}
.s-fill2{fill:var(--warn-soft); stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round}
.s-dash{stroke:var(--muted); stroke-width:2; stroke-dasharray:6 5; fill:none}
.s-txt{fill:var(--ink); font:700 15px var(--fb)}
.s-small{fill:var(--muted); font:700 12px var(--fb)}
.s-pt{fill:var(--acc); stroke:var(--card); stroke-width:2}
.s-stick{stroke:var(--acc); stroke-width:5; stroke-linecap:round}
.s-head{fill:var(--bad)}
.s-dotp{fill:var(--pri)}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:90; width:100%; height:100%}

<script>
/* =========================================================
   1. BANK SOAL — 4 paket × 30 soal (Matematika, Kelas 6)
   d = domain  (B Bilangan, A Aljabar, G Geometri & Pengukuran, D Data & Peluang)
   l = level   (1 Pemahaman, 2 Aplikasi, 3 Penalaran)
   o[0] selalu kunci jawaban; urutan pilihan diacak saat ujian.
   {a/b} = pecahan, 2{1/2} = pecahan campuran
   ========================================================= */
const svg=(vb,inner,label,w)=>`<svg class="fig-svg" viewBox="${vb}" role="img" aria-label="${label}" style="max-width:${w||380}px">${inner}</svg>`;
const T=(x,y,t,a,c)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" class="${c||'s-txt'}">${t}</text>`;
const fig=(inner,cap)=>`<figure class="fig">${cap?`<figcaption>${cap}</figcaption>`:''}<div class="fig-wrap">${inner}</div></figure>`;
const polar=(cx,cy,r,deg)=>{const t=deg*Math.PI/180;return [(cx+r*Math.cos(t)).toFixed(1),(cy+r*Math.sin(t)).toFixed(1)]};

function barChart(labels,vals,o){
  const W=460,H=280,L=50,R=14,Tp=34,B=42,pw=W-L-R,ph=H-Tp-B;let g='';
  for(let v=0;v<=o.max;v+=o.step){const y=Tp+ph-v/o.max*ph;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="s-grid"/>`;if(v%o.lab===0)g+=T(L-8,y+4,v,'end','s-small')}
  const n=vals.length,slot=pw/n,bw=slot*.56;
  vals.forEach((v,i)=>{const x=L+i*slot+(slot-bw)/2,h=v/o.max*ph;g+=`<rect x="${x}" y="${Tp+ph-h}" width="${bw}" height="${h}" rx="4" class="s-bar"/>`+T(x+bw/2,H-B+20,labels[i],'middle','s-small')});
  g+=`<line x1="${L}" x2="${L}" y1="${Tp-8}" y2="${Tp+ph}" class="s-axis"/><line x1="${L}" x2="${W-R}" y1="${Tp+ph}" y2="${Tp+ph}" class="s-axis"/>`;
  g+=T(8,18,o.unit,'start','s-small');
  if(o.xname)g+=T(W-R,H-4,o.xname,'end','s-small');
  return fig(svg(`0 0 ${W} ${H}`,g,o.title,480),o.title);
}
function pieChart(items,title){
  const cx=115,cy=115,r=100;let a=-90,g='';
  items.forEach(it=>{const a2=a+it.p*3.6,p1=polar(cx,cy,r,a),p2=polar(cx,cy,r,a2),m=polar(cx,cy,r*.62,(a+a2)/2);
    g+=`<path d="M${cx} ${cy} L${p1} A${r} ${r} 0 ${it.p>50?1:0} 1 ${p2} Z" fill="${it.c}" style="stroke:var(--card);stroke-width:3"/>`;
    g+=`<text x="${m[0]}" y="${+m[1]+5}" text-anchor="middle" style="fill:#fff;font:800 15px var(--fb)">${it.p}%</text>`;a=a2});
  items.forEach((it,i)=>{const y=58+i*34;g+=`<rect x="245" y="${y-14}" width="18" height="18" rx="5" fill="${it.c}"/>`+T(272,y,it.t,'start')});
  return fig(svg('0 0 400 232',g,title,440),title);
}
function spinner(){
  const cols={M:'#E5484D',B:'#2F6FEB',K:'#F5B400',H:'#1FA971'},seq=['M','B','M','K','M','B','M','H'];
  const cx=120,cy=120,r=100;let g='';
  seq.forEach((c,i)=>{const a=-90+i*45,a2=a+45,p1=polar(cx,cy,r,a),p2=polar(cx,cy,r,a2),m=polar(cx,cy,r*.66,a+22.5);
    g+=`<path d="M${cx} ${cy} L${p1} A${r} ${r} 0 0 1 ${p2} Z" fill="${cols[c]}" style="stroke:var(--card);stroke-width:3"/>`;
    g+=`<text x="${m[0]}" y="${+m[1]+6}" text-anchor="middle" style="fill:${c==='K'?'#3A2800':'#fff'};font:800 17px var(--fb)">${c}</text>`});
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx+48}" y2="${cy-50}" style="stroke:var(--ink);stroke-width:6;stroke-linecap:round"/><circle cx="${cx}" cy="${cy}" r="11" style="fill:var(--ink)"/>`;
  const leg=[['M','Merah'],['B','Biru'],['K','Kuning'],['H','Hijau']];
  leg.forEach((l,i)=>{const y=62+i*34;g+=`<rect x="258" y="${y-14}" width="18" height="18" rx="5" fill="${cols[l[0]]}"/>`+T(284,y,`${l[0]} = ${l[1]}`,'start')});
  return fig(svg('0 0 400 240',g,'Papan putar 8 bagian',440));
}
function picto(rows,title){
  const book=h=>`<svg viewBox="0 0 ${h?12:24} 28" width="${h?12:24}" height="28" aria-hidden="true"><rect x="2" y="2" width="20" height="24" rx="3" class="p-book"/><rect x="2" y="2" width="5" height="24" rx="2" class="p-spine"/><line x1="10" y1="9" x2="17" y2="9" class="p-ln"/><line x1="10" y1="14" x2="17" y2="14" class="p-ln"/></svg>`;
  let t='<table class="dtab picto"><thead><tr><th>Hari</th><th>Banyak buku terjual</th></tr></thead><tbody>';
  rows.forEach(([d,n])=>{t+=`<tr><th>${d}</th><td>${book(0).repeat(Math.floor(n))}${n%1?book(1):''}</td></tr>`});
  t+=`</tbody></table><p style="margin-top:8px;font-weight:800">Keterangan: ${book(0)} = 10 buku</p>`;
  return fig(t,title);
}
function coord(nx,ny,pts,tri,title){
  const s=34,ox=36,oy=16,X=x=>ox+x*s,Y=y=>oy+(ny-y)*s;let g='';
  for(let i=0;i<=nx;i++){g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(0)}" y2="${Y(ny)}" class="s-grid"/>`+T(X(i),Y(0)+20,i,'middle','s-small')}
  for(let j=0;j<=ny;j++){g+=`<line x1="${X(0)}" x2="${X(nx)}" y1="${Y(j)}" y2="${Y(j)}" class="s-grid"/>`;if(j)g+=T(X(0)-10,Y(j)+4,j,'end','s-small')}
  g+=`<line x1="${X(0)}" x2="${X(nx)+10}" y1="${Y(0)}" y2="${Y(0)}" class="s-axis"/><line x1="${X(0)}" x2="${X(0)}" y1="${Y(0)}" y2="${Y(ny)-8}" class="s-axis"/>`;
  g+=T(X(nx)+12,Y(0)+4,'x','start','s-small')+T(X(0),Y(ny)-12,'y','middle','s-small');
  if(tri)g+=`<polygon points="${pts.map(p=>X(p[1])+','+Y(p[2])).join(' ')}" class="s-fill" style="fill-opacity:.8"/>`;
  pts.forEach(p=>{g+=`<circle cx="${X(p[1])}" cy="${Y(p[2])}" r="7" class="s-pt"/>`+T(X(p[1])+(p[3]||-12),Y(p[2])-10,p[0])});
  return fig(svg(`0 0 ${X(nx)+26} ${Y(0)+30}`,g,title,360),title);
}
function sticks(){
  let g='',x=16;const s=38,y=24;
  const st=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="s-stick"/><circle cx="${x2}" cy="${y2}" r="4.5" class="s-head"/>`;
  for(let n=1;n<=3;n++){
    for(let i=0;i<n;i++){g+=st(x+i*s+4,y,x+(i+1)*s-4,y)+st(x+i*s+4,y+s,x+(i+1)*s-4,y+s)}
    for(let i=0;i<=n;i++){g+=st(x+i*s,y+4,x+i*s,y+s-4)}
    g+=T(x+n*s/2,y+s+30,`Pola ${n}`,'middle','s-small');x+=n*s+40;
  }
  return fig(svg(`0 0 ${x-20} 110`,g,'Pola persegi dari batang korek api',420));
}
function triDots(){
  let g='',x=14;const d=18;
  for(let n=1;n<=4;n++){
    const w=n*d;for(let r=1;r<=n;r++){for(let k=0;k<r;k++){const cx=x+(w-r*d)/2+k*d+d/2,cy=14+(r-1)*d+d/2;g+=`<circle cx="${cx}" cy="${cy}" r="6.5" class="s-dotp"/>`}}
    g+=T(x+w/2,14+4*d+26,`Pola ${n}`,'middle','s-small');x+=w+34;
  }
  return fig(svg(`0 0 ${x-20} 120`,g,'Pola susunan titik',420));
}

{d:'G',l:2,t:'bs',q:'Kereta api berangkat dari sebuah stasiun pukul 07.45. Lama perjalanan 2 jam 50 menit.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Kereta tiba di stasiun tujuan pukul 10.35.',1],['Lama perjalanan kereta sama dengan 170 menit.',1],['Jika kereta berangkat terlambat 30 menit, kereta tiba pukul 11.15.',0],['Kereta tiba sebelum pukul 11.00.',1]],p:'07.45 + 2 jam 50 menit = <b>10.35</b>, jadi kereta tiba sebelum pukul 11.00. Lama perjalanan 2 jam 50 menit = 120 + 50 = <b>170 menit</b>. Jika terlambat 30 menit, kereta tiba pukul 10.35 + 30 menit = 11.05, bukan 11.15 (<b>Salah</b>).'},
{d:'G',l:2,q:'Besar sudut terkecil yang dibentuk oleh jarum pendek dan jarum panjang jam pada pukul 04.00 adalah ....',o:['120°','90°','100°','150°'],p:'Satu putaran (360°) dibagi 12 angka, jadi jarak antarangka = 30°. Pada pukul 04.00 kedua jarum berjarak 4 angka: 4 × 30° = <b>120°</b>.'},
{d:'G',l:2,q:'Perhatikan bidang koordinat berikut. Agar titik A, B, C, dan D membentuk persegi panjang ABCD, koordinat titik D adalah ....',f:coord(7,5,[['A',2,1],['B',6,1,12],['C',6,4,12]],false,'Bidang koordinat'),o:['(2, 4)','(4, 2)','(6, 6)','(1, 4)'],p:'AB mendatar dari x = 2 sampai x = 6, BC tegak dari y = 1 sampai y = 4. Titik D harus sejajar tegak dengan A (x = 2) dan sejajar mendatar dengan C (y = 4). Jadi D = <b>(2, 4)</b>.'},
{d:'G',l:3,q:'Sebuah kertas berbentuk persegi mempunyai keliling 36 cm. Kertas itu dipotong menjadi dua persegi panjang yang sama besar. Keliling satu potongan persegi panjang adalah ....',o:['27 cm','18 cm','22,5 cm','36 cm'],p:'Sisi persegi = 36 : 4 = 9 cm. Setiap potongan berukuran 9 cm × 4,5 cm. Kelilingnya = 2 × (9 + 4,5) = <b>27 cm</b>.'},
{d:'D',l:2,t:'bs',q:'Diagram batang berikut menunjukkan hasil panen cabai kebun Pak Darto selama lima bulan.<br>Tentukan benar atau salah setiap pernyataan berikut!',f:barChart(['Jan','Feb','Mar','Apr','Mei'],[40,55,35,60,50],{max:70,step:5,lab:10,unit:'Hasil panen (kg)',title:'Hasil Panen Cabai Pak Darto'}),s:[['Hasil panen tertinggi terjadi pada bulan April.',1],['Rata-rata hasil panen setiap bulan adalah 48 kg.',1],['Hasil panen bulan Februari lebih sedikit daripada bulan Mei.',0],['Selisih hasil panen bulan Maret dan April adalah 25 kg.',1]],p:'Dari diagram: Januari 40, Februari 55, Maret 35, April 60, Mei 50 kg. Tertinggi April (<b>Benar</b>). Rata-rata = 240 : 5 = 48 kg (<b>Benar</b>). Februari 55 kg lebih banyak daripada Mei 50 kg (<b>Salah</b>). Selisih Maret dan April = 60 − 35 = 25 kg (<b>Benar</b>).'},
{d:'D',l:2,q:'Nilai ulangan matematika 10 siswa sebagai berikut.<br><b>6, 7, 7, 9, 8, 7, 10, 6, 8, 9</b><br>Median data tersebut adalah ....',o:['7,5','7','8','7,7'],p:'Urutkan data: 6, 6, 7, 7, <u>7, 8</u>, 8, 9, 9, 10. Banyak data 10 (genap), sehingga median = rata-rata data ke-5 dan ke-6 = (7 + 8) : 2 = <b>7,5</b>.'},
{d:'D',l:3,t:'mc',q:'Dalam sebuah kantong terdapat 5 kelereng merah, 3 kelereng biru, dan 2 kelereng hijau. Sebuah kelereng diambil secara acak. Pernyataan yang benar adalah ....',o:['Kemungkinan terambil kelereng merah sama dengan kemungkinan terambil kelereng bukan merah.','Kelereng hijau paling kecil kemungkinannya untuk terambil.','Tidak mungkin terambil kelereng biru.','Kemungkinan terambil kelereng biru lebih besar daripada kelereng merah.'],k:[0,1],p:'Kelereng merah 5 dan bukan merah (biru + hijau) juga 5, jadi kemungkinannya <b>sama</b>. Kelereng hijau paling sedikit (2 butir), jadi <b>paling kecil</b> kemungkinannya. Kelereng biru tetap mungkin terambil, tetapi kemungkinannya lebih kecil daripada merah karena hanya ada 3 butir.'},
]},
{id:2,nama:'Samudra Pecahan',warna:'#0F8A83',art:'wave',soal:[
{d:'B',l:1,q:'Bilangan <b>305.070</b> dibaca ....',o:['tiga ratus lima ribu tujuh puluh','tiga ratus lima puluh ribu tujuh puluh','tiga puluh lima ribu tujuh ratus','tiga ratus lima ribu tujuh ratus'],p:'305.070 terdiri dari 305 ribu dan 70, sehingga dibaca <b>tiga ratus lima ribu tujuh puluh</b>.'},
{d:'B',l:1,q:'Jumlah penonton sebuah pertandingan sepak bola adalah 46.738 orang. Jika dibulatkan ke ribuan terdekat, jumlah penonton menjadi ....',o:['47.000 orang','46.000 orang','46.700 orang','50.000 orang'],p:'Lihat angka ratusan, yaitu 7. Karena 7 ≥ 5, angka ribuan dibulatkan ke atas: 46.738 ≈ <b>47.000</b>.'},
{d:'B',l:2,q:'Pak Joko memiliki 2.450 bibit cabai yang ditanam dalam 35 baris sama banyak. Banyak bibit cabai pada setiap baris adalah ....',o:['70 bibit','75 bibit','65 bibit','80 bibit'],p:'2.450 : 35 = <b>70 bibit</b>.'},
{d:'B',l:1,q:'Hasil dari 125 − 45 : 9 × 4 + 18 adalah ....',o:['123','83','143','103'],p:'Pembagian dan perkalian dikerjakan lebih dahulu dari kiri: 45 : 9 = 5, lalu 5 × 4 = 20. Kemudian 125 − 20 + 18 = <b>123</b>.'},
{d:'B',l:2,t:'mc',q:'Operasi hitung berikut yang hasilnya sama dengan 3 adalah ....',o:['2{1/4} × 1{1/3}','4{1/2} : 1{1/2}','1{3/4} + 1{1/2}','5 − 2{1/4}'],k:[0,1],p:'• 2{1/4} × 1{1/3} = {9/4} × {4/3} = 3 (benar)<br>• 4{1/2} : 1{1/2} = {9/2} : {3/2} = {9/2} × {2/3} = 3 (benar)<br>• 1{3/4} + 1{1/2} = 3{1/4} (bukan 3)<br>• 5 − 2{1/4} = 2{3/4} (bukan 3)'},
{d:'B',l:2,q:'Ibu memiliki pita sepanjang 4{1/2} m. Pita dipotong-potong dengan panjang masing-masing {3/8} m untuk hiasan. Banyak potongan pita yang diperoleh adalah ....',o:['12 potong','10 potong','14 potong','16 potong'],p:'4{1/2} : {3/8} = {9/2} × {8/3} = {72/6} = <b>12 potong</b>.'},
{d:'B',l:1,q:'Hasil dari 12,5 − 3,75 + 1,6 adalah ....',o:['10,35','10,25','9,35','11,35'],p:'12,50 − 3,75 = 8,75. Lalu 8,75 + 1,60 = <b>10,35</b>.'},
{d:'B',l:2,t:'bs',q:'Di kelas 6 terdapat 40 siswa. Sebanyak 35% siswa gemar sepak bola, 25% gemar bulu tangkis, dan sisanya gemar renang.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Siswa yang gemar sepak bola ada 14 orang.',1],['Siswa yang gemar bulu tangkis ada 10 orang.',1],['Siswa yang gemar renang ada 40% dari seluruh siswa.',1],['Banyak siswa yang gemar sepak bola dua kali banyak siswa yang gemar bulu tangkis.',0]],p:'Sepak bola = 35% × 40 = <b>14</b>. Bulu tangkis = 25% × 40 = <b>10</b>. Renang = 100% − 35% − 25% = <b>40%</b> (16 siswa). Karena 14 bukan dua kali 10, pernyataan terakhir <b>Salah</b>.'},
{d:'B',l:2,q:'Seorang pedagang membeli 20 kg jeruk seharga Rp300.000. Jeruk dijual kembali dengan harga Rp18.000 per kg dan habis terjual. Keuntungan pedagang tersebut adalah ....',o:['Rp60.000','Rp30.000','Rp3.000','Rp66.000'],p:'Hasil penjualan = 20 × Rp18.000 = Rp360.000. Untung = Rp360.000 − Rp300.000 = <b>Rp60.000</b>.'},
{d:'B',l:2,q:'Di sebuah terminal, bus A berangkat setiap 15 menit, bus B setiap 20 menit, dan bus C setiap 30 menit. Ketiga bus berangkat bersamaan pukul 06.00. Ketiga bus akan berangkat bersamaan lagi pukul ....',o:['07.00','06.30','07.30','06.45'],p:'KPK dari 15, 20, dan 30 adalah 60. Jadi ketiganya berangkat bersamaan lagi 60 menit kemudian, yaitu pukul <b>07.00</b>.'},
{d:'B',l:1,t:'mc',q:'Bilangan berikut yang merupakan faktor prima dari 180 adalah ....',o:['2','3','5','9','4'],k:[0,1,2],p:'180 = 2² × 3² × 5, sehingga faktor primanya <b>2, 3, dan 5</b>. Bilangan 9 dan 4 memang faktor dari 180, tetapi keduanya bukan bilangan prima.'},
{d:'B',l:3,q:'Lina membaca buku setebal 240 halaman. Hari pertama ia membaca {1/4} bagian buku. Hari kedua ia membaca {1/3} dari sisa halaman. Banyak halaman yang belum dibaca Lina adalah ....',o:['120 halaman','100 halaman','140 halaman','80 halaman'],p:'Hari pertama: {1/4} × 240 = 60 halaman, sisa 180. Hari kedua: {1/3} × 180 = 60 halaman. Sisa = 180 − 60 = <b>120 halaman</b>.'},
{d:'B',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan tentang bilangan bulat berikut!',s:[['−12 lebih kecil daripada −8.',1],['−5 + 8 = −3',0],['7 − (−3) = 10',1],['Urutan −3, −9, 0, 2 sudah tersusun dari yang terkecil.',0]],p:'• Pada garis bilangan −12 berada di sebelah kiri −8, jadi lebih kecil (<b>Benar</b>).<br>• −5 + 8 = 3, bukan −3 (<b>Salah</b>).<br>• 7 − (−3) = 7 + 3 = 10 (<b>Benar</b>).<br>• Urutan yang benar dari terkecil adalah −9, −3, 0, 2 (<b>Salah</b>).'},
{d:'A',l:2,q:'Perhatikan pola bilangan berikut.<br><b>3, 6, 12, 24, ...</b><br>Bilangan ke-7 pada pola tersebut adalah ....',o:['192','96','384','48'],p:'Setiap bilangan dikalikan 2: 3, 6, 12, 24, 48, 96, <b>192</b>.'},
{d:'A',l:2,q:'Umur ayah 3 kali umur Dina. Jumlah umur mereka 48 tahun. Umur Dina adalah ....',o:['12 tahun','16 tahun','36 tahun','14 tahun'],p:'Umur Dina = 1 bagian, umur ayah = 3 bagian. Jumlah 4 bagian = 48 tahun, sehingga 1 bagian = 48 : 4 = <b>12 tahun</b>.'},
{d:'A',l:2,t:'mc',q:'Harga 6 buku tulis adalah Rp27.000. Pernyataan yang benar adalah ....',o:['Harga 1 buku tulis Rp4.500.','Harga 10 buku tulis Rp45.000.','Harga 2 lusin buku tulis Rp108.000.','Dengan uang Rp50.000 dapat dibeli 12 buku tulis.'],k:[0,1,2],p:'Harga 1 buku = Rp27.000 : 6 = <b>Rp4.500</b>. Harga 10 buku = <b>Rp45.000</b>. Dua lusin = 24 buku = 24 × Rp4.500 = <b>Rp108.000</b>. Harga 12 buku = Rp54.000, lebih dari Rp50.000, jadi uangnya tidak cukup.'},
{d:'A',l:3,q:'Pembangunan sebuah gedung dapat diselesaikan oleh 12 pekerja dalam waktu 30 hari. Agar gedung selesai dalam 20 hari, banyak pekerja yang diperlukan adalah ....',o:['18 orang','8 orang','24 orang','20 orang'],p:'Ini perbandingan berbalik nilai: makin sedikit hari, makin banyak pekerja. 12 × 30 = 360, lalu 360 : 20 = <b>18 orang</b>.'},
{d:'G',l:1,q:'Pada segitiga ABC, besar ∠A = 48° dan ∠B = 67°. Besar ∠C adalah ....',o:['65°','75°','55°','115°'],p:'Jumlah sudut dalam segitiga = 180°. ∠C = 180° − 48° − 67° = <b>65°</b>.'},
{d:'G',l:2,t:'mc',q:'Bangun datar berikut yang memiliki tepat 2 simetri lipat adalah ....',o:['persegi panjang','belah ketupat','persegi','layang-layang'],k:[0,1],p:'Persegi panjang dan belah ketupat masing-masing memiliki <b>2 simetri lipat</b>. Persegi memiliki 4 simetri lipat, sedangkan layang-layang hanya memiliki 1 simetri lipat.'},
{d:'G',l:2,q:'Perhatikan gambar trapesium berikut! Luas trapesium tersebut adalah ....',f:FIG.trap,o:['180 cm²','360 cm²','220 cm²','140 cm²'],p:'Luas trapesium = {1/2} × (jumlah sisi sejajar) × tinggi = {1/2} × (14 + 22) × 10 = {1/2} × 36 × 10 = <b>180 cm²</b>.'},
{d:'G',l:2,q:'Sebuah layang-layang mainan memiliki panjang diagonal 24 cm dan 18 cm. Luas kertas yang dibutuhkan untuk menutup layang-layang tersebut adalah ....',o:['216 cm²','432 cm²','84 cm²','108 cm²'],p:'Luas layang-layang = {1/2} × d₁ × d₂ = {1/2} × 24 × 18 = <b>216 cm²</b>.'},
{d:'G',l:2,t:'bs',q:'Sebuah taman berbentuk lingkaran dengan jari-jari 14 m (π = {22/7}).<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Diameter taman 28 m.',1],['Luas taman 616 m².',1],['Keliling taman 88 m.',1],['Jika jari-jarinya dijadikan 2 kali, luas taman juga menjadi 2 kali.',0]],p:'Diameter = 2 × 14 = <b>28 m</b>. Luas = {22/7} × 14 × 14 = <b>616 m²</b>. Keliling = {22/7} × 28 = <b>88 m</b>. Jika jari-jari menjadi 28 m, luasnya {22/7} × 28 × 28 = 2.464 m², yaitu <b>4 kali</b> luas semula, jadi pernyataan terakhir <b>Salah</b>.'},
{d:'G',l:3,q:'Perhatikan gambar setengah lingkaran berikut! Keliling bangun tersebut adalah .... (π = {22/7})',f:FIG.semi,o:['72 cm','44 cm','88 cm','58 cm'],p:'Panjang busur = {1/2} × {22/7} × 28 = 44 cm. Keliling bangun = busur + garis tengah = 44 + 28 = <b>72 cm</b>.'},
{d:'G',l:3,t:'bs',q:'Sebuah bak mandi berbentuk kubus dengan panjang rusuk bagian dalam 80 cm.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Volume bak mandi jika terisi penuh adalah 512 liter.',1],['Luas alas bak mandi 6.400 cm².',1],['Jika bak terisi setengahnya, tinggi air 40 cm.',1],['Bak dapat diisi penuh dengan 50 ember yang masing-masing berisi 10 liter.',0]],p:'Volume = 80 × 80 × 80 = 512.000 cm³ = <b>512 liter</b>. Luas alas = 80 × 80 = <b>6.400 cm²</b>. Setengah penuh berarti tinggi air {1/2} × 80 = <b>40 cm</b>. Lima puluh ember × 10 liter = 500 liter, kurang dari 512 liter, jadi bak belum penuh (<b>Salah</b>).'},
{d:'G',l:2,q:'Ibu membeli 2,5 kg tepung dan 750 gram gula. Sebanyak 1.200 gram bahan digunakan untuk membuat kue. Berat bahan yang tersisa adalah ....',o:['2.050 gram','4.450 gram','1.950 gram','2.150 gram'],p:'2,5 kg = 2.500 gram. Sisa = 2.500 + 750 − 1.200 = <b>2.050 gram</b>.'},
{d:'G',l:3,q:'Balok berukuran 5 cm × 4 cm × 3 cm disusun dari kubus-kubus kecil berukuran 1 cm × 1 cm × 1 cm. Seluruh permukaan luar balok dicat. Banyak kubus kecil yang tidak terkena cat sama sekali adalah ....',o:['6','12','24','0'],p:'Kubus yang tidak terkena cat berada di bagian dalam. Ukuran bagian dalam = (5 − 2) × (4 − 2) × (3 − 2) = 3 × 2 × 1 = <b>6 kubus</b>.'},
{d:'G',l:2,q:'Pak Andi mengendarai sepeda motor dengan kecepatan rata-rata 60 km/jam selama 2 jam 30 menit. Jarak yang ditempuh Pak Andi adalah ....',o:['150 km','120 km','180 km','135 km'],p:'2 jam 30 menit = 2,5 jam. Jarak = kecepatan × waktu = 60 × 2,5 = <b>150 km</b>.'},
{d:'D',l:2,t:'bs',q:'Piktogram berikut menunjukkan banyak buku yang terjual di sebuah toko buku selama lima hari.<br>Tentukan benar atau salah setiap pernyataan berikut!',f:picto([['Senin',4],['Selasa',2.5],['Rabu',3],['Kamis',5],['Jumat',3.5]],'Penjualan Buku Toko Cerdas'),s:[['Penjualan terbanyak terjadi pada hari Kamis.',1],['Buku yang terjual pada hari Selasa sebanyak 25 buku.',1],['Jumlah buku yang terjual selama lima hari adalah 170 buku.',0],['Buku yang terjual pada hari Rabu lebih banyak daripada hari Jumat.',0]],p:'Senin 40, Selasa 25, Rabu 30, Kamis 50, Jumat 35 buku. Terbanyak hari Kamis (<b>Benar</b>). Selasa 2{1/2} gambar = 25 buku (<b>Benar</b>). Jumlahnya 40 + 25 + 30 + 50 + 35 = 180 buku (<b>Salah</b>). Rabu 30 buku lebih sedikit daripada Jumat 35 buku (<b>Salah</b>).'},
{d:'D',l:2,t:'mc',q:'Diagram lingkaran berikut menunjukkan pilihan kegiatan ekstrakurikuler 240 siswa. Pernyataan yang benar adalah ....',f:pieChart([{t:'Pramuka',p:35,c:'#2F6FEB'},{t:'Futsal',p:30,c:'#E8622A'},{t:'Musik',p:20,c:'#128A58'},{t:'Tari',p:15,c:'#C2366A'}],'Pilihan Ekstrakurikuler'),o:['Siswa yang memilih pramuka ada 84 orang.','Siswa yang memilih musik ada 48 orang.','Futsal adalah kegiatan yang paling banyak dipilih.','Siswa yang memilih tari ada 30 orang.'],k:[0,1],p:'Pramuka = 35% × 240 = <b>84</b> siswa. Musik = 20% × 240 = <b>48</b> siswa. Yang paling banyak dipilih adalah pramuka (35%), bukan futsal (30%). Tari = 15% × 240 = 36 siswa, bukan 30.'},
{d:'D',l:3,q:'Rata-rata nilai 5 siswa adalah 80. Setelah nilai Rani dimasukkan, rata-ratanya menjadi 82. Nilai Rani adalah ....',o:['92','82','84','90'],p:'Jumlah nilai 5 siswa = 5 × 80 = 400. Jumlah nilai 6 siswa = 6 × 82 = 492. Nilai Rani = 492 − 400 = <b>92</b>.'},
]},
{id:3,nama:'Gunung Geometri',warna:'#5B43D6',art:'mount',soal:[
{d:'B',l:1,q:'Nilai angka 5 pada bilangan <b>953.604</b> adalah ....',o:['50.000','5.000','500.000','5'],p:'953.604: 9 ratus ribuan, <b>5 puluh ribuan</b>, 3 ribuan, 6 ratusan, 0 puluhan, 4 satuan. Nilai angka 5 = 5 × 10.000 = <b>50.000</b>.'},
{d:'B',l:2,q:'Sebuah pabrik memproduksi 7.208 botol minuman. Sebanyak 2.679 botol sudah dikirim ke toko. Banyak botol yang belum dikirim adalah ....',o:['4.529 botol','4.629 botol','5.529 botol','4.531 botol'],p:'7.208 − 2.679 = <b>4.529 botol</b>.'},
{d:'B',l:2,q:'Seorang peternak memiliki 36 karung pakan ayam. Setiap karung berisi 25 kg. Pakan tersebut habis dalam 15 hari. Rata-rata pakan yang dihabiskan setiap hari adalah ....',o:['60 kg','55 kg','65 kg','540 kg'],p:'Total pakan = 36 × 25 = 900 kg. Setiap hari = 900 : 15 = <b>60 kg</b>.'},
{d:'B',l:2,t:'mc',q:'Pecahan yang nilainya terletak di antara {1/3} dan {1/2} adalah ....',o:['{2/5}','{3/7}','{3/5}','{2/7}'],k:[0,1],p:'{1/3} ≈ 0,33 dan {1/2} = 0,5. {2/5} = 0,4 dan {3/7} ≈ 0,43 berada di antara keduanya. {3/5} = 0,6 lebih besar dari {1/2}, sedangkan {2/7} ≈ 0,29 lebih kecil dari {1/3}.'},
{d:'B',l:2,q:'Kak Sinta mempunyai uang Rp450.000. Sebanyak {2/3} bagian uangnya ditabung. Kemudian {3/5} dari uang tabungan itu dipakai untuk membeli sepatu. Harga sepatu tersebut adalah ....',o:['Rp180.000','Rp270.000','Rp120.000','Rp200.000'],p:'Tabungan = {2/3} × Rp450.000 = Rp300.000. Harga sepatu = {3/5} × Rp300.000 = <b>Rp180.000</b>.'},
{d:'B',l:2,q:'Ibu membeli 2,5 kg daging sapi dengan harga Rp128.000 per kg. Uang yang harus dibayar ibu adalah ....',o:['Rp320.000','Rp310.000','Rp256.000','Rp330.000'],p:'2,5 × Rp128.000 = (2 × 128.000) + (0,5 × 128.000) = 256.000 + 64.000 = <b>Rp320.000</b>.'},
{d:'B',l:1,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut!',s:[['0,375 = {3/8}',1],['0,25 = 25%',1],['{3/5} = 0,35',0],['1,2 = 12%',0]],p:'• 0,375 = {375/1000} = {3/8} (<b>Benar</b>).<br>• 0,25 = {25/100} = 25% (<b>Benar</b>).<br>• {3/5} = {6/10} = 0,6, bukan 0,35 (<b>Salah</b>).<br>• 1,2 = {120/100} = 120%, bukan 12% (<b>Salah</b>).'},
{d:'B',l:3,q:'Harga sebuah tas mula-mula Rp150.000. Harga tas itu naik 20%, kemudian toko memberikan diskon 10% dari harga baru. Harga tas sekarang adalah ....',o:['Rp162.000','Rp165.000','Rp150.000','Rp180.000'],p:'Naik 20%: Rp150.000 + Rp30.000 = Rp180.000. Diskon 10% dari harga baru: Rp180.000 − Rp18.000 = <b>Rp162.000</b>. Hasilnya tidak sama dengan naik 10% (Rp165.000) karena diskon dihitung dari harga baru.'},
{d:'B',l:3,q:'Ani berlatih menari setiap 3 hari, menyanyi setiap 4 hari, dan melukis setiap 6 hari. Hari ini, Senin, ia melakukan ketiga kegiatan itu bersamaan. Ani akan melakukan ketiga kegiatan bersamaan lagi pada hari ....',o:['Sabtu','Jumat','Minggu','Kamis'],p:'KPK dari 3, 4, dan 6 adalah 12. Dua belas hari = 1 minggu + 5 hari. Senin + 5 hari = <b>Sabtu</b>.'},
{d:'B',l:2,q:'Pak Rudi memiliki 42 apel dan 56 jeruk. Buah-buahan itu dimasukkan ke dalam kantong plastik dengan banyak apel dan banyak jeruk di setiap kantong sama. Banyak kantong plastik paling banyak yang dapat dibuat adalah ....',o:['14 kantong','7 kantong','28 kantong','12 kantong'],p:'Banyak kantong = FPB dari 42 dan 56 = <b>14 kantong</b>. Setiap kantong berisi 3 apel dan 4 jeruk.'},
{d:'B',l:1,q:'Urutan bilangan 3, −7, 0, 5, −2 dari yang terbesar adalah ....',o:['5, 3, 0, −2, −7','−7, −2, 0, 3, 5','5, 3, 0, −7, −2','0, −2, 3, 5, −7'],p:'Pada garis bilangan, bilangan paling kanan paling besar. Untuk bilangan negatif, −2 lebih besar daripada −7. Urutannya <b>5, 3, 0, −2, −7</b>.'},
{d:'B',l:3,q:'Sebuah bilangan tiga angka memiliki ciri-ciri:<br>• angka ratusannya 2 kali angka satuan,<br>• angka puluhannya 1 lebih dari angka satuan,<br>• jumlah ketiga angkanya 13.<br>Bilangan tersebut adalah ....',o:['643','634','346','463'],p:'Coba angka satuan = 3: ratusan = 2 × 3 = 6, puluhan = 3 + 1 = 4. Jumlah 6 + 4 + 3 = 13, cocok! Bilangannya <b>643</b>. (Cara lain: satuan = s, maka 2s + (s + 1) + s = 13, sehingga s = 3.)'},
{d:'A',l:1,t:'mc',q:'Perhatikan pola bilangan kuadrat berikut.<br><b>1, 4, 9, 16, 25, ...</b><br>Bilangan yang termasuk dalam pola tersebut adalah ....',o:['64','144','50','90'],k:[0,1],p:'Bilangan kuadrat adalah hasil kali sebuah bilangan dengan dirinya sendiri. 64 = 8 × 8 dan 144 = 12 × 12 termasuk pola. Bilangan 50 dan 90 tidak dapat ditulis sebagai hasil kali dua bilangan yang sama.'},
{d:'A',l:2,q:'Perhatikan susunan titik berikut! Banyak titik pada pola ke-8 adalah ....',f:triDots(),o:['36','28','45','32'],p:'Banyak titik: 1, 3, 6, 10, ... (bertambah 2, 3, 4, dan seterusnya). Pola ke-5 = 15, ke-6 = 21, ke-7 = 28, ke-8 = 28 + 8 = <b>36</b>.'},
{d:'A',l:2,q:'Harga 3 buku sama dengan harga 5 pensil. Harga 1 pensil Rp2.400. Harga 2 buku adalah ....',o:['Rp8.000','Rp4.000','Rp7.200','Rp6.000'],p:'Harga 5 pensil = 5 × Rp2.400 = Rp12.000 = harga 3 buku. Harga 1 buku = Rp12.000 : 3 = Rp4.000. Harga 2 buku = <b>Rp8.000</b>.'},
{d:'A',l:3,t:'bs',q:'Perbandingan uang Rita dan Sari adalah 4 : 7. Selisih uang mereka Rp45.000.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Uang Rita Rp60.000.',1],['Uang Sari Rp105.000.',1],['Jumlah uang mereka Rp150.000.',0],['Jika Sari memberikan Rp22.500 kepada Rita, uang mereka menjadi sama banyak.',1]],p:'Selisih 3 bagian = Rp45.000, jadi 1 bagian = Rp15.000. Rita = 4 × Rp15.000 = <b>Rp60.000</b> dan Sari = 7 × Rp15.000 = <b>Rp105.000</b>. Jumlahnya Rp165.000, bukan Rp150.000 (<b>Salah</b>). Jika Sari memberi Rp22.500, uang Rita dan Sari sama-sama Rp82.500 (<b>Benar</b>).'},
{d:'A',l:3,q:'Denah sebuah rumah dibuat dengan skala 1 : 200. Pada denah, ukuran kamar tidur 2 cm × 1,5 cm. Luas kamar tidur sebenarnya adalah ....',o:['12 m²','3 m²','6 m²','120 m²'],p:'Ukuran sebenarnya: 2 × 200 = 400 cm = 4 m dan 1,5 × 200 = 300 cm = 3 m. Luas = 4 × 3 = <b>12 m²</b>.'},
{d:'G',l:1,t:'mc',q:'Pernyataan yang benar tentang bangun ruang prisma segitiga adalah ....',o:['mempunyai 9 rusuk','mempunyai 5 sisi','mempunyai 6 titik sudut','semua sisinya berbentuk segitiga'],k:[0,1,2],p:'Prisma segitiga mempunyai <b>9 rusuk</b>, <b>5 sisi</b> (2 segitiga dan 3 persegi panjang), dan <b>6 titik sudut</b>. Sisi tegaknya berbentuk persegi panjang, jadi tidak semua sisinya segitiga.'},
{d:'G',l:1,q:'Jaring-jaring sebuah bangun ruang terdiri atas 1 persegi dan 4 segitiga yang sama. Bangun ruang tersebut adalah ....',o:['limas segi empat','prisma segitiga','kubus','kerucut'],p:'Alasnya berbentuk persegi dan sisi tegaknya 4 segitiga yang bertemu di satu titik puncak. Bangun itu adalah <b>limas segi empat</b>.'},
{d:'G',l:2,q:'Sebuah kotak kado berbentuk kubus dengan panjang rusuk 9 cm. Seluruh permukaan kotak akan dibungkus kertas kado. Luas kertas kado paling sedikit yang diperlukan adalah ....',o:['486 cm²','729 cm²','324 cm²','540 cm²'],p:'Luas permukaan kubus = 6 × s × s = 6 × 9 × 9 = <b>486 cm²</b>. (729 adalah volumenya dalam cm³.)'},
{d:'G',l:2,q:'Sebuah kaleng susu berbentuk tabung dengan jari-jari alas 7 cm dan tinggi 10 cm. Volume kaleng tersebut adalah .... (π = {22/7})',o:['1.540 cm³','440 cm³','3.080 cm³','1.450 cm³'],p:'Volume tabung = π × r × r × t = {22/7} × 7 × 7 × 10 = 22 × 7 × 10 = <b>1.540 cm³</b>.'},
{d:'G',l:3,t:'bs',q:'Perhatikan gambar bangun berikut!<br>Tentukan benar atau salah setiap pernyataan berikut!',f:FIG.lshape,s:[['Luas bangun tersebut 100 cm².',1],['Bagian yang terpotong berukuran 5 cm × 4 cm.',1],['Keliling bangun tersebut 44 cm.',1],['Keliling bangun tersebut lebih kecil daripada keliling persegi panjang berukuran 12 cm × 10 cm.',0]],p:'Bagian terpotong berukuran (12 − 7) × 4 = 5 cm × 4 cm = 20 cm². Luas = 12 × 10 − 20 = <b>100 cm²</b>. Keliling = 7 + 4 + 5 + 6 + 12 + 10 = <b>44 cm</b>. Keliling persegi panjang 12 cm × 10 cm = 2 × (12 + 10) = 44 cm, jadi kelilingnya sama, bukan lebih kecil (<b>Salah</b>).'},
{d:'G',l:2,q:'Lintasan lari berbentuk lingkaran dengan diameter 42 m. Doni berlari mengelilingi lintasan sebanyak 5 putaran. Jarak yang ditempuh Doni adalah .... (π = {22/7})',o:['660 m','132 m','1.320 m','210 m'],p:'Keliling lintasan = {22/7} × 42 = 132 m. Jarak 5 putaran = 5 × 132 = <b>660 m</b>.'},
{d:'G',l:1,q:'Kegiatan kerja bakti di sekolah dimulai pukul 08.40 dan selesai pukul 11.15. Lama kegiatan tersebut adalah ....',o:['2 jam 35 menit','3 jam 25 menit','2 jam 45 menit','3 jam 35 menit'],p:'Dari 08.40 sampai 10.40 = 2 jam. Dari 10.40 sampai 11.15 = 35 menit. Total <b>2 jam 35 menit</b>.'},
{d:'G',l:2,t:'mc',q:'Ukuran panjang berikut yang sama dengan 1,5 km adalah ....',o:['1.500 m','150.000 cm','150 m','15.000 cm'],k:[0,1],p:'1 km = 1.000 m, jadi 1,5 km = <b>1.500 m</b>. 1 m = 100 cm, jadi 1.500 m = <b>150.000 cm</b>. Ukuran 150 m dan 15.000 cm (= 150 m) hanya sepersepuluh dari 1,5 km.'},
{d:'G',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan tentang bidang koordinat berikut!',s:[['Titik P(3, 2) yang digeser 4 satuan ke kanan dan 3 satuan ke atas menjadi (7, 5).',1],['Titik (0, 4) terletak pada sumbu-y.',1],['Titik (5, 0) terletak pada sumbu-y.',0],['Jarak titik (2, 3) ke titik (6, 3) adalah 4 satuan.',1]],p:'• Geser ke kanan menambah x (3 + 4 = 7) dan geser ke atas menambah y (2 + 3 = 5), jadi (7, 5) (<b>Benar</b>).<br>• Titik yang nilai x-nya 0 terletak pada sumbu-y (<b>Benar</b>).<br>• Titik (5, 0) nilai y-nya 0, sehingga terletak pada sumbu-x (<b>Salah</b>).<br>• Kedua titik sama-sama memiliki y = 3, jaraknya 6 − 2 = 4 satuan (<b>Benar</b>).'},
{d:'G',l:3,q:'Dua sudut saling berpelurus (jumlahnya 180°). Besar sudut yang satu 2 kali besar sudut yang lain. Besar sudut yang lebih besar adalah ....',o:['120°','60°','90°','135°'],p:'Sudut kecil = 1 bagian dan sudut besar = 2 bagian, jumlahnya 3 bagian = 180°. Jadi 1 bagian = 60° dan sudut besar = 2 × 60° = <b>120°</b>.'},
{d:'D',l:2,t:'mc',q:'Tabel berikut menunjukkan ukuran sepatu siswa kelas 6. Pernyataan yang sesuai dengan tabel adalah ....',f:fig('<table class="dtab"><thead><tr><th>Ukuran sepatu</th><th>33</th><th>34</th><th>35</th><th>36</th><th>37</th></tr></thead><tbody><tr><th>Banyak siswa</th><td>4</td><td>7</td><td>9</td><td>6</td><td>4</td></tr></tbody></table>','Ukuran Sepatu Siswa Kelas 6'),o:['Banyak siswa kelas 6 seluruhnya 30 orang.','Modus ukuran sepatu adalah 35.','Siswa yang ukuran sepatunya kurang dari 35 ada 11 orang.','Siswa yang ukuran sepatunya 37 lebih banyak daripada ukuran 33.'],k:[0,1,2],p:'Jumlah siswa = 4 + 7 + 9 + 6 + 4 = <b>30</b>. Ukuran yang paling banyak dipakai (modus) adalah <b>35</b> (9 siswa). Ukuran kurang dari 35: 4 + 7 = <b>11</b> siswa. Ukuran 37 dan 33 sama-sama 4 siswa, jadi tidak lebih banyak.'},
{d:'D',l:2,t:'bs',q:'Diagram batang berikut menunjukkan banyak pengunjung perpustakaan sekolah selama lima hari.<br>Tentukan benar atau salah setiap pernyataan berikut!',f:barChart(['Senin','Selasa','Rabu','Kamis','Jumat'],[30,50,40,35,45],{max:60,step:5,lab:10,unit:'Banyak pengunjung',title:'Pengunjung Perpustakaan'}),s:[['Jumlah pengunjung selama lima hari adalah 200 orang.',1],['Pengunjung hari Selasa 25% dari seluruh pengunjung.',1],['Pengunjung paling sedikit datang pada hari Kamis.',0],['Rata-rata pengunjung setiap hari 45 orang.',0]],p:'Senin 30, Selasa 50, Rabu 40, Kamis 35, Jumat 45. Jumlahnya 200 orang (<b>Benar</b>). Selasa = {50/200} × 100% = 25% (<b>Benar</b>). Pengunjung paling sedikit hari Senin (30), bukan Kamis (<b>Salah</b>). Rata-rata = 200 : 5 = 40, bukan 45 (<b>Salah</b>).'},
{d:'D',l:3,q:'Sebuah papan putar dibagi menjadi 8 bagian sama besar seperti gambar. Jarum diputar satu kali. Pernyataan yang benar adalah ....',f:spinner(),o:['Kemungkinan jarum berhenti di warna biru 2 kali kemungkinan berhenti di warna kuning.','Jarum pasti berhenti di warna merah.','Kemungkinan jarum berhenti di warna hijau lebih besar daripada di warna biru.','Jarum tidak mungkin berhenti di warna kuning.'],p:'Merah 4 bagian, biru 2 bagian, kuning 1 bagian, dan hijau 1 bagian. Biru (2 bagian) = 2 × kuning (1 bagian), sehingga <b>kemungkinan biru 2 kali kemungkinan kuning</b>. Merah tidak pasti (hanya 4 dari 8), hijau lebih kecil kemungkinannya daripada biru, dan kuning tetap mungkin.'},
]},
{id:4,nama:'Kota Data',warna:'#C2366A',art:'city',soal:[
{d:'B',l:1,q:'Bentuk panjang dari bilangan <b>604.528</b> adalah ....',o:['600.000 + 4.000 + 500 + 20 + 8','600.000 + 40.000 + 500 + 20 + 8','60.000 + 4.000 + 500 + 20 + 8','600.000 + 4.000 + 50 + 20 + 8'],p:'604.528 = 6 ratus ribuan + 0 puluh ribuan + 4 ribuan + 5 ratusan + 2 puluhan + 8 satuan = <b>600.000 + 4.000 + 500 + 20 + 8</b>.'},
{d:'B',l:1,q:'Hasil dari 15 × 24 − 180 : 12 adalah ....',o:['345','15','355','335'],p:'Perkalian dan pembagian dikerjakan lebih dahulu: 15 × 24 = 360 dan 180 : 12 = 15. Hasilnya 360 − 15 = <b>345</b>.'},
{d:'B',l:3,q:'Sebanyak 250 siswa akan berwisata menggunakan bus. Setiap bus dapat mengangkut paling banyak 40 siswa. Banyak bus paling sedikit yang diperlukan agar semua siswa terangkut adalah ....',o:['7 bus','6 bus','8 bus','5 bus'],p:'250 : 40 = 6 sisa 10. Enam bus hanya mengangkut 240 siswa, sehingga 10 siswa sisanya memerlukan 1 bus lagi. Jadi perlu <b>7 bus</b>.'},
{d:'B',l:2,t:'mc',q:'Pecahan berikut yang nilainya lebih dari {4/5} adalah ....',o:['{5/6}','{9/10}','{7/9}','{3/4}'],k:[0,1],p:'{4/5} = 0,8. {5/6} ≈ 0,83 dan {9/10} = 0,9 lebih dari 0,8. Sedangkan {7/9} ≈ 0,78 dan {3/4} = 0,75 kurang dari 0,8.'},
{d:'B',l:1,q:'Hasil dari 3{1/3} − 1{3/4} + 2{1/2} adalah ....',o:['4{1/12}','4{5/12}','3{11/12}','4{1/6}'],p:'Samakan penyebut menjadi 12: {40/12} − {21/12} + {30/12} = {49/12} = <b>4{1/12}</b>.'},
{d:'B',l:2,q:'Pak Tani memiliki sawah seluas 1{1/2} hektare. Sebanyak {2/3} bagian ditanami padi dan sisanya ditanami jagung. Luas sawah yang ditanami jagung adalah ....',o:['{1/2} hektare','1 hektare','{1/3} hektare','{3/4} hektare'],p:'Bagian jagung = 1 − {2/3} = {1/3}. Luasnya = {1/3} × 1{1/2} = {1/3} × {3/2} = <b>{1/2} hektare</b>.'},
{d:'B',l:2,q:'Sebanyak 7,2 liter minyak goreng dituang ke dalam botol-botol kecil. Setiap botol berisi 0,6 liter. Banyak botol yang diperlukan adalah ....',o:['12 botol','120 botol','13 botol','10 botol'],p:'7,2 : 0,6 = 72 : 6 = <b>12 botol</b>.'},
{d:'B',l:2,t:'bs',q:'Penduduk sebuah desa berjumlah 800 orang. Sebanyak 45% di antaranya laki-laki.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Banyak penduduk laki-laki 360 orang.',1],['Banyak penduduk perempuan 440 orang.',1],['Penduduk perempuan 80 orang lebih banyak daripada penduduk laki-laki.',1],['Persentase penduduk perempuan 65%.',0]],p:'Laki-laki = 45% × 800 = <b>360</b> orang. Perempuan = 800 − 360 = <b>440</b> orang. Selisihnya 440 − 360 = <b>80</b> orang. Persentase perempuan = 100% − 45% = 55%, bukan 65% (<b>Salah</b>).'},
{d:'B',l:3,q:'Setelah mendapat diskon 20%, harga sebuah baju menjadi Rp96.000. Harga baju sebelum diskon adalah ....',o:['Rp120.000','Rp115.200','Rp116.000','Rp76.800'],p:'Setelah diskon 20%, harga yang dibayar = 80% dari harga awal. 80% = Rp96.000, sehingga 10% = Rp12.000 dan 100% = <b>Rp120.000</b>.'},
{d:'B',l:1,t:'mc',q:'Pernyataan yang benar tentang bilangan 24 dan 36 adalah ....',o:['FPB-nya 12.','KPK-nya 72.','Keduanya merupakan kelipatan 6.','Keduanya habis dibagi 8.'],k:[0,1,2],p:'24 = 2³ × 3 dan 36 = 2² × 3². FPB = 2² × 3 = <b>12</b> dan KPK = 2³ × 3² = <b>72</b>. 24 = 6 × 4 dan 36 = 6 × 6, jadi keduanya <b>kelipatan 6</b>. 36 tidak habis dibagi 8.'},
{d:'B',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan tentang bilangan bulat berikut!',s:[['−8 + 15 = 7',1],['7 − (−6) = 1',0],['−10 lebih besar daripada −3.',0],['−8 + 15 − (−6) = 13',1]],p:'• −8 + 15 = 7 (<b>Benar</b>).<br>• Mengurangi bilangan negatif sama dengan menambah: 7 − (−6) = 7 + 6 = 13, bukan 1 (<b>Salah</b>).<br>• −10 berada di sebelah kiri −3 pada garis bilangan, jadi lebih kecil (<b>Salah</b>).<br>• −8 + 15 − (−6) = 7 + 6 = 13 (<b>Benar</b>).'},
{d:'B',l:2,q:'Nilai dari 12² + 3³ − √196 adalah ....',o:['157','171','143','185'],p:'12² = 144, 3³ = 27, dan √196 = 14. Jadi 144 + 27 − 14 = <b>157</b>.'},
{d:'A',l:1,q:'Perhatikan pola bilangan berikut.<br><b>100, 94, 88, 82, ...</b><br>Bilangan ke-10 pada pola tersebut adalah ....',o:['46','40','52','54'],p:'Setiap bilangan berkurang 6. Bilangan ke-10 = 100 − 9 × 6 = 100 − 54 = <b>46</b>.'},
{d:'A',l:3,q:'Kata <b>SEMANGAT</b> ditulis berulang-ulang tanpa spasi: SEMANGATSEMANGATSEMANGAT.... Huruf ke-100 adalah ....',o:['A','M','N','T'],p:'Kata SEMANGAT terdiri dari 8 huruf. 100 : 8 = 12 sisa 4. Huruf ke-100 sama dengan huruf ke-4 dari kata SEMANGAT (S-E-M-A), yaitu <b>A</b>.'},
{d:'A',l:2,q:'Sebuah bilangan dikalikan 5, kemudian dikurangi 18, hasilnya 67. Bilangan tersebut adalah ....',o:['17','19','13','15'],p:'Kerjakan secara mundur: 67 + 18 = 85, lalu 85 : 5 = <b>17</b>.'},
{d:'A',l:3,t:'mc',q:'Untuk membuat 6 porsi puding diperlukan 450 ml susu. Pernyataan yang benar adalah ....',o:['Untuk 1 porsi puding diperlukan 75 ml susu.','Untuk 10 porsi puding diperlukan 750 ml susu.','Susu 900 ml cukup untuk membuat 12 porsi puding.','Susu 1 liter cukup untuk membuat 14 porsi puding.'],k:[0,1,2],p:'Susu untuk 1 porsi = 450 : 6 = <b>75 ml</b>. Untuk 10 porsi = <b>750 ml</b>. Untuk 12 porsi = 12 × 75 = <b>900 ml</b>, jadi cukup. Untuk 14 porsi = 14 × 75 = 1.050 ml, lebih dari 1 liter (1.000 ml), jadi tidak cukup.'},
{d:'A',l:3,q:'Jumlah umur ayah dan ibu adalah 84 tahun. Perbandingan umur ayah dan ibu 4 : 3. Selisih umur ayah dan ibu adalah ....',o:['12 tahun','48 tahun','36 tahun','7 tahun'],p:'Jumlah bagian = 4 + 3 = 7, sehingga 1 bagian = 84 : 7 = 12 tahun. Selisih = 4 − 3 = 1 bagian = <b>12 tahun</b> (ayah 48 tahun, ibu 36 tahun).'},
{d:'G',l:1,t:'mc',q:'Pernyataan yang benar tentang bangun ruang tabung adalah ....',o:['mempunyai 3 sisi','mempunyai 2 rusuk','selimutnya berbentuk persegi panjang jika dibuka','mempunyai 1 titik puncak'],k:[0,1,2],p:'Tabung mempunyai <b>3 sisi</b> (alas, tutup, dan selimut) dan <b>2 rusuk</b> lengkung. Jika dibuka, selimut tabung berbentuk <b>persegi panjang</b>. Tabung tidak mempunyai titik puncak; bangun yang mempunyai satu titik puncak misalnya kerucut.'},
{d:'G',l:2,q:'Perhatikan gambar segitiga siku-siku berikut! Luas segitiga tersebut adalah ....',f:FIG.rtri,o:['150 cm²','300 cm²','60 cm²','250 cm²'],p:'Alas dan tinggi adalah dua sisi yang saling tegak lurus, yaitu 20 cm dan 15 cm. Luas = {1/2} × 20 × 15 = <b>150 cm²</b>. Sisi 25 cm adalah sisi miring, bukan tinggi.'},
{d:'G',l:3,t:'bs',q:'Sebuah taman berbentuk persegi mempunyai luas 625 m².<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Panjang sisi taman 25 m.',1],['Keliling taman 100 m.',1],['Jika di sekeliling taman dipasang lampu setiap 5 m, lampu yang diperlukan 20 buah.',1],['Jika panjang sisinya dijadikan 2 kali, luas taman menjadi 1.250 m².',0]],p:'Sisi = √625 = <b>25 m</b>. Keliling = 4 × 25 = <b>100 m</b>. Lampu setiap 5 m pada keliling yang tertutup: 100 : 5 = <b>20 lampu</b>. Jika sisi menjadi 50 m, luasnya 50 × 50 = 2.500 m², bukan 1.250 m² (<b>Salah</b>).'},
{d:'G',l:2,q:'Sebuah piring berbentuk lingkaran dengan diameter 21 cm. Luas permukaan piring tersebut adalah .... (π = {22/7})',o:['346,5 cm²','66 cm²','1.386 cm²','173,25 cm²'],p:'Jari-jari = 21 : 2 = 10,5 cm. Luas = {22/7} × 10,5 × 10,5 = 33 × 10,5 = <b>346,5 cm²</b>.'},
{d:'G',l:3,q:'Kolam renang berbentuk balok berukuran panjang 8 m, lebar 5 m, dan kedalaman 1,5 m. Kolam diisi air menggunakan pompa yang mengalirkan 200 liter setiap menit. Waktu yang diperlukan untuk mengisi kolam sampai penuh adalah ....',o:['5 jam','3 jam','6 jam','50 menit'],p:'Volume = 8 × 5 × 1,5 = 60 m³ = 60.000 liter. Waktu = 60.000 : 200 = 300 menit = <b>5 jam</b>.'},
{d:'G',l:2,q:'Sebuah kardus berbentuk balok berukuran 40 cm × 30 cm × 20 cm. Kardus akan diisi kotak-kotak kecil berbentuk kubus dengan rusuk 10 cm. Banyak kotak kecil paling banyak yang dapat dimasukkan adalah ....',o:['24 kotak','12 kotak','36 kotak','20 kotak'],p:'Sepanjang panjang muat 40 : 10 = 4 kotak, sepanjang lebar 30 : 10 = 3 kotak, dan sepanjang tinggi 20 : 10 = 2 kotak. Banyak kotak = 4 × 3 × 2 = <b>24 kotak</b>.'},
