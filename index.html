b1:`<article class="teks"><h4>Siswa SD Tunas Bangsa Ubah Sampah Daun Menjadi Kompos</h4>
<p><b>Bogor</b> – Sebanyak 45 siswa kelas 5 dan 6 SD Tunas Bangsa mengikuti kegiatan membuat pupuk kompos pada Sabtu, 14 Februari 2026. Kegiatan ini diadakan di kebun belakang sekolah dan dipandu oleh Pak Rahmat, guru IPAS.</p>
<p>Bahan utama kompos adalah daun kering yang setiap hari dikumpulkan dari halaman sekolah. Daun dicacah kecil-kecil, dicampur dengan sisa sayuran dari kantin, lalu disiram cairan pengurai. Campuran itu kemudian ditutup rapat di dalam tong plastik.</p>
<p>"Dulu daun kering kami bakar. Asapnya membuat sesak napas. Sekarang daun itu malah berguna untuk menyuburkan tanaman," kata Pak Rahmat.</p>
<p>Kompos akan siap digunakan setelah kira-kira empat minggu. Rencananya, kompos dipakai untuk memupuk kebun sayur sekolah. Kepala sekolah berharap kegiatan ini membuat siswa terbiasa memilah sampah di rumah.</p></article>`,
b2:`<article class="teks"><h4>Sepatu Dimas</h4>
<p>Sepatu Dimas sudah robek di bagian ujungnya. Setiap berjalan, jempol kakinya hampir menyembul keluar. Namun, Dimas tidak pernah mengeluh kepada ibunya. Ia tahu, sejak ayahnya sakit, Ibu bekerja lebih keras sebagai penjahit.</p>
<p>Suatu siang, Dimas melihat pengumuman lomba menulis cerita di papan sekolah. Hadiah juara pertama adalah uang tabungan sebesar Rp300.000. "Kalau menang, aku bisa membeli sepatu sendiri," gumamnya.</p>
<p>Selama dua minggu, setiap malam Dimas menulis di meja kecil dekat mesin jahit Ibu. Ia menulis tentang ibunya yang menjahit hingga larut malam. Beberapa kali ia menghapus dan mengulang tulisannya.</p>
<p>Hari pengumuman pun tiba. Nama Dimas disebut sebagai juara kedua. Hadiahnya Rp150.000. Dimas sempat tertunduk, tetapi kemudian tersenyum. Sepulang sekolah, ia menyerahkan amplop hadiah kepada Ibu. "Ini untuk membantu Ibu. Sepatu Dimas masih bisa dijahit, kok," katanya.</p>
<p>Mata Ibu berkaca-kaca. Malam itu, Ibu menjahit sepatu Dimas dengan sangat rapi.</p></article>`,
b3:`<article class="teks"><h4>Cara Menanam Kangkung di Botol Bekas</h4>
<p><b>Alat dan bahan:</b> botol plastik bekas ukuran 1,5 liter, gunting, tanah gembur, pupuk kompos, dan benih kangkung.</p>
<p><b>Langkah-langkah:</b></p>
<ol><li>Potong botol menjadi dua bagian. Gunakan bagian bawah sebagai pot.</li>
<li>Buat tiga lubang kecil di dasar botol agar air tidak menggenang.</li>
<li>Isi botol dengan campuran tanah dan kompos hingga tiga perempat bagian.</li>
<li>Tanam 5–6 benih kangkung sedalam kira-kira 1 cm, lalu tutup tipis dengan tanah.</li>
<li>Siram setiap pagi dan sore. Letakkan botol di tempat yang terkena sinar matahari.</li>
<li>Kangkung dapat dipanen setelah berumur 3–4 minggu.</li></ol></article>`,

b6:`<article class="teks"><h4>Asal Mula Bukit Kembar</h4>
<p>Dahulu kala, di sebuah desa di kaki gunung, hiduplah dua saudara kembar bernama Laras dan Luri. Mereka terkenal rajin membantu warga. Namun, keduanya sering bertengkar karena hal kecil.</p>
<p>Suatu hari, desa dilanda kemarau panjang. Sumur-sumur mengering. Seorang kakek bijak berkata, "Di balik gunung ada mata air. Namun, jalan ke sana hanya bisa dilalui oleh dua orang yang saling bergandengan tangan."</p>
<p>Laras dan Luri berangkat bersama. Awalnya mereka berdebat tentang jalan yang harus dipilih. Akhirnya mereka sadar, pertengkaran hanya membuang waktu. Mereka pun bergandengan tangan melewati jurang dan hutan lebat hingga menemukan mata air.</p>
<p>Air mengalir deras menuju desa. Warga bersorak gembira. Namun, Laras dan Luri tidak pernah kembali. Keesokan harinya, di tempat mata air itu muncul dua bukit yang berdampingan. Warga menamainya Bukit Kembar dan percaya bahwa kedua saudara itu menjaga mata air untuk selamanya.</p></article>`,
b7:`<article class="teks"><h4>Mengapa Pelangi Muncul?</h4>
<p>Pelangi sering terlihat setelah hujan reda, terutama ketika matahari mulai bersinar kembali. Pelangi berbentuk lengkungan dengan susunan warna merah, jingga, kuning, hijau, biru, nila, dan ungu.</p>
<p>Pelangi terjadi karena cahaya matahari mengenai butiran air hujan yang masih melayang di udara. Butiran air itu membelokkan dan menguraikan cahaya putih matahari menjadi berbagai warna. Peristiwa ini disebut pembiasan cahaya.</p>
<p>Kita hanya dapat melihat pelangi jika posisi matahari berada di belakang kita dan butiran air ada di depan kita. Oleh karena itu, pelangi pada sore hari biasanya terlihat di langit sebelah timur.</p></article>`,

c1:`<article class="teks"><h4>Pipit dan Pohon Beringin</h4>
<p>Di tepi sungai berdiri sebuah pohon beringin tua. Daunnya lebat dan akarnya kuat. Banyak burung bersarang di sana, termasuk Pipit yang kecil dan lincah.</p>
<p>Suatu hari, datanglah Merak dengan bulunya yang indah. "Pohon ini sudah tua dan jelek. Lebih baik kalian pindah ke pohon cemara di bukit. Pohon itu jauh lebih cantik," ajak Merak. Beberapa burung pun mengikutinya.</p>
<p>Pipit memilih tetap tinggal. "Beringin ini sudah melindungi kita sejak dulu. Akarnya kuat, tak mudah tumbang," katanya.</p>
<p>Beberapa hari kemudian, angin kencang bertiup disertai hujan lebat. Pohon cemara di bukit patah dan sarang-sarang burung berjatuhan. Burung-burung itu kembali ke pohon beringin dengan basah kuyup. Pipit menyambut mereka dengan ramah. "Mari berlindung bersama," ujarnya.</p></article>`,
c2:`<article class="teks"><h4>Candi Borobudur</h4>
<p>Candi Borobudur terletak di Kabupaten Magelang, Jawa Tengah. Candi ini dibangun pada abad ke-8 hingga ke-9 Masehi pada masa Dinasti Syailendra. Borobudur merupakan candi Buddha terbesar di dunia.</p>
<p>Bangunan candi terdiri atas sepuluh tingkat. Dindingnya dihiasi 2.672 panel relief yang menceritakan kehidupan dan ajaran Buddha. Di bagian atas candi terdapat 72 stupa berlubang yang masing-masing berisi arca Buddha.</p>
<p>Pada tahun 1991, UNESCO menetapkan Candi Borobudur sebagai Warisan Dunia. Setiap tahun, jutaan wisatawan dari dalam dan luar negeri datang berkunjung. Pengunjung diminta tidak memanjat stupa dan tidak menyentuh relief agar candi tetap terjaga.</p></article>`,

c5:`<article class="teks"><h4>Membuat Es Buah Segar</h4>
<p><b>Bahan:</b> 1 buah melon kecil, 2 buah apel, 1 buah naga, 500 ml air matang dingin, 200 ml sirup, dan es batu secukupnya.<br><b>Alat:</b> pisau, talenan, mangkuk besar, dan sendok.</p>
<p><b>Cara membuat:</b></p>
<ol><li>Cuci semua buah hingga bersih.</li>
<li>Kupas melon dan buah naga, lalu potong dadu kecil.</li>
<li>Potong apel dadu kecil tanpa perlu dikupas.</li>
<li>Masukkan potongan buah ke dalam mangkuk besar.</li>
<li>Tuangkan air matang dan sirup, lalu aduk rata.</li>
<li>Tambahkan es batu. Es buah siap disajikan.</li></ol></article>`,
c6:`<article class="teks"><h4>Hari Pertama Nara</h4>
<p>Nara baru pindah dari Medan ke Surabaya. Hari Senin itu adalah hari pertamanya di sekolah baru. Tangannya dingin dan jantungnya berdebar kencang saat memasuki kelas 6B.</p>
<p>Bu Wati mempersilakan Nara duduk di samping Tika. Tika tersenyum dan menggeser tempat pensilnya. "Hai, aku Tika. Nanti istirahat kita ke kantin bersama, ya," bisiknya. Nara mengangguk pelan.</p>
<p>Saat istirahat, Tika mengenalkan Nara kepada teman-teman lain. Mereka mengajak Nara bermain lompat tali. Awalnya Nara sering tersangkut, tetapi teman-temannya tidak menertawakannya. Mereka justru mengajarinya.</p>
<p>Sepulang sekolah, Nara bercerita kepada ibunya dengan wajah berseri-seri. "Ternyata sekolah baru tidak menakutkan, Bu. Besok aku mau berangkat lebih pagi!"</p></article>`,
c7:`<article class="teks"><h4>Bersepeda ke Sekolah</h4>
<p>(1) Bersepeda ke sekolah memiliki banyak manfaat. (2) Menurut dokter, bersepeda selama 30 menit setiap hari dapat menguatkan jantung dan otot kaki. (3) Selain itu, sepeda tidak menghasilkan asap sehingga udara tetap bersih. (4) Menurut saya, bersepeda adalah kegiatan yang paling menyenangkan di dunia. (5) Namun, pesepeda harus memakai helm dan mematuhi rambu lalu lintas agar tetap aman.</p></article>`,

{x:'b2',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Dimas meraih juara pertama dalam lomba menulis.',0],['Dimas menulis cerita tentang ibunya.',1],['Hadiah lomba digunakan Dimas untuk membeli sepatu baru.',0],['Ibu menjahit sepatu Dimas yang robek.',1]],p:'Dimas menjadi <b>juara kedua</b>, bukan pertama (Salah). Ia menulis tentang ibunya yang menjahit hingga larut malam (Benar). Hadiah diserahkan kepada Ibu, bukan untuk membeli sepatu (Salah). Malam itu Ibu menjahit sepatu Dimas dengan rapi (Benar).'},
{x:'b2',d:'S',l:3,q:'Amanat yang dapat diambil dari cerita tersebut adalah ....',o:['Kita hendaknya peduli kepada keluarga dan bersyukur atas hasil usaha kita.','Kita harus selalu menjadi juara pertama dalam setiap lomba.','Kita sebaiknya membeli sepatu baru setiap tahun.','Kita tidak perlu ikut lomba jika hadiahnya kecil.'],p:'Dimas tetap tersenyum walau hanya juara kedua, lalu memberikan hadiahnya untuk membantu Ibu. Pesannya: <b>peduli kepada keluarga dan bersyukur atas hasil usaha</b>.'},
{x:'b2',d:'S',l:2,q:'Makna ungkapan "Mata Ibu berkaca-kaca" dalam cerita tersebut adalah ....',o:['Ibu terharu hingga hampir menangis.','Ibu memakai kacamata baru.','Mata Ibu sakit karena terlalu lama menjahit.','Ibu marah kepada Dimas.'],p:'Mata berkaca-kaca berarti mata basah oleh air mata. Ibu <b>terharu</b> karena Dimas menyerahkan hadiahnya untuk membantu Ibu.'},
{x:'b3',d:'I',l:1,q:'Tujuan membuat lubang kecil di dasar botol adalah ....',o:['agar air tidak menggenang','agar benih cepat tumbuh','agar botol mudah dipotong','agar sinar matahari masuk ke dalam botol'],p:'Langkah kedua menyebutkan, "Buat tiga lubang kecil di dasar botol <b>agar air tidak menggenang</b>."'},
{x:'b3',d:'I',l:2,t:'mc',q:'Alat dan bahan yang diperlukan untuk menanam kangkung sesuai teks adalah ....',o:['gunting','benih kangkung','pupuk kompos','pot dari tanah liat'],k:[0,1,2],p:'Teks menyebutkan alat dan bahan: botol plastik bekas, <b>gunting</b>, tanah gembur, <b>pupuk kompos</b>, dan <b>benih kangkung</b>. Pot dari tanah liat tidak diperlukan karena potnya dibuat dari botol bekas.'},
{x:'b3',d:'I',l:3,q:'Ani lupa menyiram kangkungnya selama seminggu dan meletakkan botol di dalam lemari. Akibat yang paling mungkin terjadi adalah ....',o:['Kangkung menjadi layu dan tidak tumbuh dengan baik.','Kangkung dapat dipanen lebih cepat.','Kangkung tumbuh lebih subur daripada biasanya.','Botol menjadi penuh air.'],p:'Teks menyebutkan kangkung harus disiram setiap pagi dan sore serta diletakkan di tempat yang terkena sinar matahari. Jika tidak disiram dan disimpan di lemari yang gelap, kangkung <b>akan layu</b>.'},
{x:'b3',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai teks!',s:[['Langkah pertama adalah membuat lubang di dasar botol.',0],['Botol diisi tanah dan kompos sampai penuh.',0],['Benih ditanam sedalam kira-kira 1 cm.',1],['Kangkung dapat dipanen setelah berumur 3–4 minggu.',1]],p:'Langkah pertama adalah memotong botol, bukan membuat lubang (Salah). Botol diisi hingga <b>tiga perempat bagian</b>, bukan penuh (Salah). Benih ditanam sedalam kira-kira 1 cm (Benar), dan kangkung dipanen setelah 3–4 minggu (Benar).'},
{x:'b4',d:'S',l:2,q:'Tema puisi "Hujan Pagi" adalah ....',o:['kegembiraan alam karena turunnya hujan','bencana banjir di desa','kegiatan anak-anak di sekolah','kesedihan petani karena kemarau'],p:'Puisi menggambarkan tanah yang berseri, bunga mekar, katak bernyanyi, dan anak-anak yang riang ketika hujan turun. Temanya <b>kegembiraan alam karena turunnya hujan</b>.'},
{x:'b4',d:'S',l:2,t:'mc',q:'Larik yang menggambarkan benda atau hewan seolah-olah dapat berbuat seperti manusia adalah ....',o:['Menyapa daun di pinggir kali','Bunga pun mekar menari-nari','Katak bernyanyi riang gembira','Anak-anak berlari ke beranda'],k:[0,1,2],p:'Hujan yang <b>menyapa</b>, bunga yang <b>menari-nari</b>, dan katak yang <b>bernyanyi riang</b> digambarkan seperti manusia (majas personifikasi). Anak-anak berlari adalah perbuatan manusia yang sebenarnya.'},
{x:'b4',d:'S',l:1,q:'Pola rima (bunyi akhir) pada bait pertama puisi tersebut adalah ....',o:['a-a-a-a','a-b-a-b','a-a-b-b','a-b-b-a'],p:'Bunyi akhir bait pertama: hari, kali, berseri, menari. Semuanya berakhir bunyi <b>i</b>, sehingga polanya <b>a-a-a-a</b>.'},
{x:'b4',d:'S',l:3,q:'Makna larik "Tanah kering kini berseri" adalah ....',o:['Tanah yang kering menjadi segar setelah terkena hujan.','Tanah yang kering bercahaya karena sinar matahari.','Tanah menjadi longsor karena hujan.','Tanah sedang tersenyum kepada anak-anak.'],p:'Berseri berarti tampak segar dan cerah. Tanah yang tadinya kering menjadi <b>segar kembali setelah terkena hujan</b>.'},
{x:'b5',d:'I',l:1,q:'Kegiatan yang dilaksanakan di perpustakaan adalah ....',o:['bedah buku bersama penulis cilik','lomba membaca puisi','pameran pojok baca kelas','pengumuman pemenang'],p:'Pada tabel, kegiatan hari Selasa bertempat di perpustakaan, yaitu <b>bedah buku bersama penulis cilik</b>.'},
{x:'b5',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai jadwal!',s:[['Lomba menulis cerita pendek berlangsung selama dua setengah jam.',1],['Kegiatan yang berlangsung paling lama adalah pameran pojok baca kelas.',1],['Pengumuman pemenang dilaksanakan di perpustakaan.',0],['Lomba membaca puisi hanya boleh diikuti siswa kelas 6.',0]],p:'Lomba menulis 08.00–10.30 = 2{1/2} jam (Benar). Pameran 07.30–12.00 = 4{1/2} jam, paling lama (Benar). Pengumuman pemenang di <b>aula</b> (Salah). Lomba membaca puisi untuk <b>kelas 4–6</b> (Salah).'},
{x:'b5',d:'I',l:3,q:'Rina ingin mengikuti lomba membaca puisi dan lomba menulis cerita pendek. Rina harus datang ke sekolah untuk mengikuti kedua lomba itu pada hari ....',o:['Senin dan Rabu','Senin dan Selasa','Rabu dan Jumat','Selasa dan Kamis'],p:'Lomba membaca puisi diadakan hari <b>Senin</b> dan lomba menulis cerita pendek hari <b>Rabu</b>.'},
{x:'b6',d:'S',l:2,t:'mc',q:'Kesulitan yang dihadapi Laras dan Luri dalam perjalanan mencari mata air adalah ....',o:['berdebat tentang jalan yang harus dipilih','melewati jurang','melewati hutan lebat','dikejar binatang buas'],k:[0,1,2],p:'Paragraf ketiga menyebutkan mereka awalnya <b>berdebat tentang jalan</b>, lalu melewati <b>jurang</b> dan <b>hutan lebat</b>. Tidak ada bagian cerita tentang binatang buas.'},
{x:'b6',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Laras dan Luri sering bertengkar karena hal kecil.',1],['Kakek bijak ikut menemani Laras dan Luri mencari mata air.',0],['Laras dan Luri berhasil menemukan mata air setelah bekerja sama.',1],['Setelah menemukan mata air, Laras dan Luri pulang ke desa.',0]],p:'Paragraf pertama menyebut mereka sering bertengkar (Benar). Kakek hanya memberi petunjuk, tidak ikut (Salah). Mereka menemukan mata air setelah bergandengan tangan (Benar). Laras dan Luri <b>tidak pernah kembali</b> (Salah).'},
{x:'b6',d:'S',l:3,q:'Amanat cerita "Asal Mula Bukit Kembar" adalah ....',o:['Kerja sama dan kerukunan dapat mengatasi kesulitan.','Kita sebaiknya tinggal di kaki gunung.','Saudara kembar selalu memiliki sifat yang sama.','Kita harus pergi jauh untuk mencari air.'],p:'Laras dan Luri baru berhasil menemukan mata air setelah berhenti bertengkar dan saling bergandengan tangan. Pesannya: <b>kerja sama dan kerukunan dapat mengatasi kesulitan</b>.'},
{x:'b6',d:'S',l:2,q:'Bagian cerita yang menjelaskan asal-usul nama Bukit Kembar terdapat pada paragraf ....',o:['keempat','pertama','kedua','ketiga'],p:'Paragraf <b>keempat</b> menceritakan munculnya dua bukit berdampingan yang kemudian dinamai Bukit Kembar oleh warga.'},
{x:'b7',d:'I',l:1,q:'Menurut teks, pelangi terjadi karena ....',o:['cahaya matahari mengenai butiran air hujan di udara','awan hitam menutupi matahari','matahari terbenam di sebelah barat','hujan turun sangat deras'],p:'Paragraf kedua menjelaskan pelangi terjadi karena <b>cahaya matahari mengenai butiran air hujan</b> yang masih melayang di udara.'},
{x:'b7',d:'I',l:2,t:'mc',q:'Pernyataan yang sesuai dengan isi teks adalah ....',o:['Pelangi terdiri atas tujuh warna.','Pelangi sering terlihat setelah hujan reda.','Pelangi dapat dilihat ketika kita menghadap ke arah matahari.','Pembiasan cahaya menguraikan cahaya putih menjadi berbagai warna.'],k:[0,1,3],p:'Teks menyebut tujuh warna (merah, jingga, kuning, hijau, biru, nila, ungu), pelangi sering terlihat setelah hujan reda, dan pembiasan menguraikan cahaya putih. Pelangi terlihat jika matahari berada <b>di belakang</b> kita, bukan di depan.'},
{x:'b7',d:'I',l:3,q:'Pelangi pada sore hari biasanya terlihat di langit sebelah timur. Hal itu terjadi karena ....',o:['Pada sore hari matahari berada di barat, di belakang orang yang melihat pelangi.','Hujan hanya turun di sebelah timur.','Warna ungu lebih terang pada sore hari.','Matahari terbit dari sebelah timur.'],p:'Pelangi terlihat jika matahari ada di belakang kita. Sore hari matahari berada di <b>barat</b>, sehingga orang yang membelakangi matahari akan menghadap ke timur dan melihat pelangi di sana.'},
{x:'b8',d:'I',l:1,q:'Tujuan poster tersebut adalah ....',o:['mengajak siswa SD mengikuti lomba mewarnai','menjelaskan cara mewarnai yang baik','menceritakan pengalaman mengikuti lomba mewarnai','melaporkan pemenang lomba mewarnai'],p:'Poster diawali dengan ajakan "AYO IKUT!" dan berisi informasi lomba beserta cara mendaftar. Tujuannya <b>mengajak siswa SD mengikuti lomba mewarnai</b>.'},
{x:'b8',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi poster!',s:[['Peserta tidak perlu membayar biaya pendaftaran.',1],['Panitia menyediakan pensil warna untuk peserta.',0],['Siswa kelas 6 boleh mengikuti lomba ini.',1],['Siswa masih dapat mendaftar pada tanggal 25 April 2026.',0]],p:'Biaya <b>gratis</b> (Benar). Peserta membawa alat mewarnai sendiri; panitia hanya menyediakan kertas (Salah). Peserta kelas 1–6 (Benar). Pendaftaran paling lambat <b>20 April</b> (Salah).'},
{x:'b8',d:'I',l:3,q:'Kalimat ajakan yang paling sesuai dengan tema lomba pada poster adalah ....',o:['Ayo, warnai Indonesia yang bersih dan hijau bersama kami!','Taman Kota Sejahtera sangat luas dan indah.','Lomba mewarnai diadakan setiap tahun.','Kertas gambar disediakan oleh panitia.'],p:'Kalimat ajakan biasanya memakai kata "ayo" atau "mari". Kalimat <b>"Ayo, warnai Indonesia yang bersih dan hijau bersama kami!"</b> berisi ajakan dan sesuai dengan tema "Indonesiaku Bersih dan Hijau".'},
]},
{id:6,no:2,mapel:'bi',nama:'Perpustakaan Awan',warna:'#7A4FC9',art:'cloud',soal:[
{x:'c1',d:'S',l:1,q:'Tokoh yang mengajak burung-burung pindah ke pohon cemara adalah ....',o:['Merak','Pipit','Beringin','Kakek bijak'],p:'Paragraf kedua menyebutkan <b>Merak</b> datang dan mengajak burung-burung pindah ke pohon cemara di bukit.'},
{x:'c1',d:'S',l:2,q:'Watak Pipit dalam cerita tersebut adalah ....',o:['setia dan ramah','sombong dan mudah terpengaruh','penakut dan pemalas','pemarah dan pendendam'],p:'Pipit tetap tinggal di pohon beringin yang telah melindunginya (<b>setia</b>) dan menyambut burung-burung yang kembali dengan baik (<b>ramah</b>), padahal mereka dulu meninggalkan pohon itu.'},
{x:'c1',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Semua burung ikut pindah ke pohon cemara.',0],['Pipit tetap tinggal di pohon beringin.',1],['Pohon cemara patah karena angin kencang.',1],['Pipit menolak burung-burung yang kembali.',0]],p:'Hanya <b>beberapa</b> burung yang pindah (Salah). Pipit memilih tetap tinggal (Benar). Pohon cemara patah saat angin kencang (Benar). Pipit justru menyambut mereka dengan ramah (Salah).'},
{x:'c1',d:'S',l:3,q:'Amanat yang terkandung dalam cerita tersebut adalah ....',o:['Jangan mudah tergiur oleh penampilan luar yang indah.','Kita harus pindah rumah jika rumah sudah tua.','Burung merak adalah burung yang paling indah.','Kita sebaiknya tinggal di tepi sungai.'],p:'Burung-burung yang tergiur pohon cemara yang cantik justru kehilangan sarang, sedangkan pohon beringin yang tampak tua ternyata kuat. Pesannya: <b>jangan mudah tergiur oleh penampilan luar</b>.'},
{x:'c1',d:'S',l:2,q:'Makna kata <i>tumbang</i> dalam kalimat "Akarnya kuat, tak mudah tumbang" adalah ....',o:['roboh','tumbuh','layu','berbuah'],p:'Tumbang berarti <b>roboh</b> atau jatuh. Pohon yang akarnya kuat tidak mudah roboh ketika diterpa angin.'},
{x:'c2',d:'I',l:1,q:'Banyak stupa berlubang di bagian atas Candi Borobudur adalah ....',o:['72 stupa','10 stupa','2.672 stupa','1.991 stupa'],p:'Paragraf kedua menyebutkan terdapat <b>72 stupa berlubang</b>. Angka 2.672 adalah banyak panel relief, dan 10 adalah banyak tingkat candi.'},
{x:'c2',d:'I',l:2,t:'mc',q:'Informasi yang sesuai dengan isi teks adalah ....',o:['Candi Borobudur terletak di Jawa Tengah.','Candi Borobudur dibangun pada masa Dinasti Syailendra.','Relief pada dinding candi berjumlah 72 panel.','UNESCO menetapkan Borobudur sebagai Warisan Dunia pada tahun 1991.'],k:[0,1,3],p:'Borobudur terletak di Magelang, <b>Jawa Tengah</b>, dibangun pada masa <b>Dinasti Syailendra</b>, dan ditetapkan sebagai Warisan Dunia pada <b>1991</b>. Relief berjumlah 2.672 panel; angka 72 adalah banyak stupa berlubang.'},
{x:'c2',d:'I',l:3,q:'Pengunjung diminta tidak memanjat stupa dan tidak menyentuh relief. Tujuan larangan tersebut adalah ....',o:['agar candi tetap terjaga dan tidak rusak','agar pengunjung cepat pulang','agar wisatawan asing tidak datang','agar relief mudah difoto'],p:'Kalimat terakhir teks menyebutkan larangan itu dibuat <b>agar candi tetap terjaga</b>.'},
{x:'c2',d:'I',l:2,q:'Ide pokok paragraf kedua adalah ....',o:['bentuk dan hiasan bangunan Candi Borobudur','letak Candi Borobudur','penetapan Borobudur sebagai Warisan Dunia','jumlah wisatawan yang berkunjung'],p:'Paragraf kedua membahas tingkat candi, panel relief, dan stupa. Semuanya tentang <b>bentuk dan hiasan bangunan</b> candi.'},
{x:'c3',d:'I',l:1,q:'Jenis buku yang paling banyak dipinjam pada bulan Januari 2026 adalah ....',o:['cerita anak','komik pendidikan','buku pelajaran','ensiklopedia'],p:'Pada tabel, <b>cerita anak</b> dipinjam 120 kali, paling banyak dibandingkan jenis buku lainnya.'},
{x:'c3',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai tabel!',s:[['Komik pendidikan lebih banyak dipinjam daripada buku pelajaran.',1],['Jumlah ensiklopedia dan majalah anak yang dipinjam adalah 75 buku.',1],['Buku pelajaran merupakan buku yang paling sedikit dipinjam.',0],['Jumlah seluruh buku yang dipinjam adalah 350 buku.',1]],p:'Komik 95 &gt; buku pelajaran 60 (Benar). Ensiklopedia 40 + majalah 35 = 75 (Benar). Paling sedikit adalah <b>majalah anak</b> (35), bukan buku pelajaran (Salah). Jumlah 120 + 95 + 60 + 40 + 35 = 350 (Benar).'},
{x:'c3',d:'I',l:3,q:'Simpulan yang tepat berdasarkan tabel tersebut adalah ....',o:['Siswa lebih gemar meminjam buku cerita daripada buku jenis lainnya.','Perpustakaan tidak memiliki ensiklopedia.','Majalah anak tidak disukai oleh semua siswa.','Buku pelajaran tidak boleh dipinjam.'],p:'Cerita anak paling banyak dipinjam (120), sehingga dapat disimpulkan <b>siswa lebih gemar meminjam buku cerita</b>. Pilihan lain tidak sesuai data: ensiklopedia dan majalah tetap dipinjam, dan buku pelajaran juga dipinjam 60 kali.'},
{x:'c4',d:'S',l:1,q:'Tema puisi "Guruku" adalah ....',o:['jasa seorang guru','keindahan pagi hari','persahabatan di sekolah','kegiatan belajar di rumah'],p:'Puisi menceritakan guru yang menyambut murid, mengajar dengan sabar, dan jasanya tidak akan dilupakan. Temanya <b>jasa seorang guru</b>.'},
{x:'c4',d:'S',l:2,q:'Makna larik "Bagai pelita di tengah gelap" adalah ....',o:['Guru memberi petunjuk dan ilmu kepada murid.','Guru membawa lampu ke sekolah.','Guru mengajar pada malam hari.','Sekolah kekurangan lampu.'],p:'Pelita adalah lampu. Guru diibaratkan <b>pemberi cahaya</b>, yaitu ilmu dan petunjuk bagi murid yang belum tahu (gelap).'},
{x:'c4',d:'S',l:2,t:'mc',q:'Hal-hal yang dilakukan guru menurut puisi tersebut adalah ....',o:['menyambut murid dengan senyum','mengajari membaca, menulis, dan berhitung','membagikan hadiah kepada murid','mengajar dengan sabar'],k:[0,1,3],p:'Puisi menyebut guru <b>menyambut dengan senyum riang</b>, <b>sabar mengajari</b>, serta mengajarkan <b>membaca, menulis, dan berhitung</b>. Tidak ada larik tentang membagikan hadiah.'},
{x:'c5',d:'I',l:1,q:'Langkah yang dilakukan setelah memasukkan potongan buah ke dalam mangkuk besar adalah ....',o:['menuangkan air matang dan sirup, lalu mengaduk rata','mencuci semua buah hingga bersih','mengupas melon dan buah naga','memotong apel dadu kecil'],p:'Langkah keempat adalah memasukkan buah ke mangkuk. Langkah berikutnya (kelima) adalah <b>menuangkan air matang dan sirup, lalu mengaduk rata</b>.'},
{x:'c5',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai teks!',s:[['Semua buah harus dikupas sebelum dipotong.',0],['Buah dicuci sebelum dipotong.',1],['Es batu dimasukkan paling akhir.',1],['Air yang digunakan adalah air matang.',1]],p:'Apel dipotong <b>tanpa dikupas</b> (Salah). Buah dicuci pada langkah pertama sebelum dipotong (Benar). Es batu ditambahkan pada langkah terakhir (Benar). Teks menyebut 500 ml air matang dingin (Benar).'},
{x:'c5',d:'I',l:3,q:'Bu Sari ingin membuat es buah dua kali lipat dari resep tersebut. Sirup yang diperlukan adalah ....',o:['400 ml','200 ml','500 ml','1.000 ml'],p:'Satu resep memerlukan 200 ml sirup. Dua kali lipat = 2 × 200 ml = <b>400 ml</b>.'},
{x:'c6',d:'S',l:2,q:'Perasaan Nara pada awal cerita adalah ....',o:['cemas dan gugup','senang dan bangga','marah dan kesal','sedih dan kecewa'],p:'"Tangannya dingin dan jantungnya berdebar kencang" menunjukkan Nara <b>cemas dan gugup</b> di hari pertama sekolah.'},
{x:'c6',d:'S',l:1,q:'Latar tempat dan waktu pada paragraf pertama adalah ....',o:['kelas 6B pada hari Senin','kantin sekolah pada hari Minggu','rumah Nara di Medan pada pagi hari','lapangan sekolah pada hari Sabtu'],p:'Paragraf pertama menyebutkan hari <b>Senin</b>, hari pertama Nara saat memasuki <b>kelas 6B</b>.'},
{x:'c6',d:'S',l:3,q:'Perasaan Nara berubah menjadi gembira di akhir cerita. Penyebabnya adalah ....',o:['Teman-teman barunya bersikap ramah dan mau membantunya.','Nara pandai bermain lompat tali.','Ibunya menjemput Nara di sekolah.','Bu Wati memberi Nara hadiah.'],p:'Tika mengajaknya ke kantin, mengenalkannya kepada teman lain, dan teman-teman mengajarinya bermain lompat tali tanpa menertawakannya. Jadi perasaan Nara berubah karena <b>teman-temannya ramah dan mau membantu</b>.'},

function lPattern(){
  let g='',x=16;const s=18,base=90;
  for(let n=1;n<=3;n++){
    for(let i=0;i<=n;i++)g+=`<rect x="${x}" y="${base-(i+1)*s}" width="${s}" height="${s}" class="s-fill"/>`;
    for(let j=1;j<=n;j++)g+=`<rect x="${x+j*s}" y="${base-s}" width="${s}" height="${s}" class="s-fill2"/>`;
    g+=T(x+(n+1)*s/2,base+22,`Pola ${n}`,'middle','s-small');x+=(n+1)*s+36;
  }
  return fig(svg(`0 0 ${x-20} 120`,g,'Pola persegi berbentuk huruf L',400));
}

{id:7,no:5,nama:'Hutan Hitung',warna:'#2B7A4B',art:'tree',soal:[
{d:'B',l:1,q:'Angka 8 pada bilangan <b>258.914</b> menempati nilai tempat ....',o:['ribuan','puluh ribuan','ratusan','ratus ribuan'],p:'258.914: 2 ratus ribuan, 5 puluh ribuan, <b>8 ribuan</b>, 9 ratusan, 1 puluhan, 4 satuan.'},
{d:'B',l:2,q:'Sebuah pabrik roti memproduksi 1.275 roti setiap hari. Banyak roti yang diproduksi selama 2 minggu adalah ....',o:['17.850 roti','17.580 roti','8.925 roti','15.300 roti'],p:'2 minggu = 14 hari. Banyak roti = 1.275 × 14 = <b>17.850 roti</b>.'},
{d:'B',l:2,t:'mc',q:'Pak Budi membeli 3 kardus air mineral. Setiap kardus berisi 48 botol. Air mineral itu dibagikan kepada peserta lomba, masing-masing mendapat 2 botol. Pernyataan yang benar adalah ....',o:['Jumlah seluruh botol air mineral 144 botol.','Air mineral cukup untuk 72 peserta.','Jika ada 80 peserta, air mineral kurang 16 botol.','Setiap kardus cukup untuk 25 peserta.'],k:[0,1,2],p:'Jumlah botol = 3 × 48 = <b>144</b>. Cukup untuk 144 : 2 = <b>72 peserta</b>. Untuk 80 peserta perlu 160 botol, jadi kurang 160 − 144 = <b>16 botol</b>. Satu kardus (48 botol) cukup untuk 24 peserta, bukan 25.'},
{d:'B',l:1,q:'Pecahan {7/20} jika diubah ke bentuk persen adalah ....',o:['35%','14%','72%','3,5%'],p:'{7/20} = {35/100} (pembilang dan penyebut dikali 5) = <b>35%</b>.'},

{d:'B',l:2,q:'Kakak memiliki pita sepanjang 12 m. Sebanyak {1/3} bagian dipakai untuk hiasan kelas dan {1/4} bagian untuk membungkus kado. Sisa pita kakak adalah ....',o:['5 m','7 m','4 m','6 m'],p:'Hiasan = {1/3} × 12 = 4 m, kado = {1/4} × 12 = 3 m. Sisa = 12 − 4 − 3 = <b>5 m</b>.'},
{d:'B',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut!',s:[['{3/8} &lt; {2/5}',1],['1{1/4} = 1,25',1],['{5/6} &gt; {7/8}',0],['2,5% = {1/40}',1]],p:'• {3/8} = 0,375 dan {2/5} = 0,4, jadi {3/8} &lt; {2/5} (<b>Benar</b>).<br>• 1{1/4} = 1 + 0,25 = 1,25 (<b>Benar</b>).<br>• {5/6} ≈ 0,83 dan {7/8} = 0,875, jadi {5/6} lebih kecil (<b>Salah</b>).<br>• 2,5% = 0,025 = {25/1000} = {1/40} (<b>Benar</b>).'},
{d:'B',l:2,q:'Harga sebuah sepeda Rp1.250.000. Ayah membayar uang muka 40%, sisanya dicicil 5 kali dengan besar yang sama. Besar setiap cicilan adalah ....',o:['Rp150.000','Rp100.000','Rp250.000','Rp125.000'],p:'Sisa yang dicicil = 60% × Rp1.250.000 = Rp750.000. Setiap cicilan = Rp750.000 : 5 = <b>Rp150.000</b>.'},
{d:'B',l:3,q:'Lampu A berkedip setiap 8 detik dan lampu B setiap 12 detik. Mula-mula keduanya berkedip bersamaan. Dalam 2 menit berikutnya, kedua lampu berkedip bersamaan lagi sebanyak ....',o:['5 kali','4 kali','6 kali','10 kali'],p:'KPK dari 8 dan 12 adalah 24, jadi keduanya berkedip bersamaan setiap 24 detik. 2 menit = 120 detik, sehingga 120 : 24 = <b>5 kali</b>.'},
{d:'B',l:2,q:'Dua potong kain batik panjangnya 84 cm dan 126 cm. Keduanya dipotong sama panjang sepanjang-panjangnya tanpa sisa. Panjang setiap potongan adalah ....',o:['42 cm','21 cm','14 cm','252 cm'],p:'Panjang potongan = FPB dari 84 dan 126. 84 = 2² × 3 × 7 dan 126 = 2 × 3² × 7, sehingga FPB = 2 × 3 × 7 = <b>42 cm</b>.'},
{d:'B',l:2,t:'bs',q:'Suhu kota A pada malam hari −3°C dan siang hari 28°C. Suhu kota B pada malam hari 2°C dan siang hari 25°C.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Selisih suhu siang dan malam di kota A adalah 31°C.',1],['Selisih suhu siang dan malam di kota B adalah 27°C.',0],['Pada malam hari, kota A lebih dingin daripada kota B.',1],['Suhu siang hari kota B lebih tinggi daripada kota A.',0]],p:'Kota A: 28 − (−3) = <b>31°C</b> (Benar). Kota B: 25 − 2 = 23°C, bukan 27°C (Salah). −3°C lebih rendah daripada 2°C, jadi kota A lebih dingin (Benar). Siang hari 25°C &lt; 28°C, jadi kota B lebih rendah (Salah).'},
{d:'B',l:3,t:'mc',q:'Bilangan berikut yang merupakan kelipatan 6 sekaligus faktor dari 72 adalah ....',o:['12','18','24','16','30'],k:[0,1,2],p:'12, 18, dan 24 habis dibagi 6 dan juga habis membagi 72 (72 : 12 = 6, 72 : 18 = 4, 72 : 24 = 3). 16 bukan kelipatan 6, sedangkan 30 bukan faktor dari 72.'},
{d:'A',l:2,q:'Perhatikan pola bilangan berikut.<br><b>5, 8, 14, 23, 35, ...</b><br>Bilangan berikutnya adalah ....',o:['50','47','48','53'],p:'Selisih berurutan: 3, 6, 9, 12, lalu 15. Bilangan berikutnya = 35 + 15 = <b>50</b>.'},

{d:'A',l:2,t:'bs',q:'Perbandingan banyak siswa laki-laki dan perempuan di kelas 6 adalah 5 : 4. Banyak siswa perempuan 16 orang.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Banyak siswa laki-laki 20 orang.',1],['Jumlah seluruh siswa 36 orang.',1],['Selisih banyak siswa laki-laki dan perempuan 5 orang.',0],['Jika 2 siswa laki-laki pindah sekolah, perbandingannya menjadi 9 : 8.',1]],p:'4 bagian = 16, jadi 1 bagian = 4. Laki-laki = 5 × 4 = <b>20</b> (Benar). Jumlah = 20 + 16 = <b>36</b> (Benar). Selisih = 4 orang, bukan 5 (Salah). Jika 2 laki-laki pindah: 18 : 16 = <b>9 : 8</b> (Benar).'},
{d:'A',l:2,q:'Jarak rumah Beni ke sekolah 2,4 km. Pada denah, jarak itu digambar sepanjang 12 cm. Skala denah tersebut adalah ....',o:['1 : 20.000','1 : 2.000','1 : 200.000','1 : 24.000'],p:'2,4 km = 240.000 cm. Skala = 12 : 240.000 = <b>1 : 20.000</b>.'},
{d:'A',l:3,q:'Perhatikan pola susunan persegi berikut! Banyak persegi pada pola ke-20 adalah ....',f:lPattern(),o:['41','40','42','60'],p:'Pola 1 = 3, pola 2 = 5, pola 3 = 7 persegi. Setiap pola bertambah 2, sehingga banyak persegi = 2 × n + 1. Pola ke-20 = 2 × 20 + 1 = <b>41</b>.'},

{d:'G',l:3,t:'mc',q:'Sebuah kolam ikan berbentuk persegi panjang berukuran 8 m × 5 m. Di sekeliling kolam dibuat jalan selebar 1 m. Pernyataan yang benar adalah ....',o:['Luas kolam 40 m².','Ukuran kolam beserta jalannya 10 m × 7 m.','Luas jalan 30 m².','Keliling luar jalan 30 m.'],k:[0,1,2],p:'Luas kolam = 8 × 5 = <b>40 m²</b>. Jalan 1 m di setiap sisi menambah 2 m pada panjang dan lebar: <b>10 m × 7 m</b>. Luas jalan = 70 − 40 = <b>30 m²</b>. Keliling luar = 2 × (10 + 7) = 34 m, bukan 30 m.'},

{d:'G',l:2,t:'bs',q:'Sebuah kotak berbentuk kubus dengan panjang rusuk 15 cm.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Volume kotak 3.375 cm³.',1],['Luas permukaan kotak 1.350 cm².',1],['Panjang seluruh rusuk kotak 180 cm.',1],['Jika rusuknya diperkecil menjadi 5 cm, volumenya menjadi sepertiga volume semula.',0]],p:'Volume = 15 × 15 × 15 = <b>3.375 cm³</b>. Luas permukaan = 6 × 15 × 15 = <b>1.350 cm²</b>. Panjang rusuk = 12 × 15 = <b>180 cm</b>. Rusuk 5 cm menghasilkan volume 125 cm³, yaitu {1/27} volume semula, bukan sepertiga (Salah).'},
{d:'G',l:2,q:'Sebuah tangki air berbentuk balok berukuran 1,2 m × 1 m × 1,5 m berisi air penuh. Sebanyak 450 liter air digunakan untuk menyiram tanaman. Sisa air dalam tangki adalah ....',o:['1.350 liter','1.800 liter','1.750 liter','1.300 liter'],p:'Volume tangki = 1,2 × 1 × 1,5 = 1,8 m³ = 1.800 liter. Sisa air = 1.800 − 450 = <b>1.350 liter</b>.'},

{d:'G',l:3,t:'mc',q:'Pada bidang koordinat terdapat titik A(1, 2), B(5, 2), C(5, 5), dan D(1, 5) seperti gambar. Pernyataan yang benar adalah ....',f:coord(6,6,[['A',1,2],['B',5,2,12],['C',5,5,12],['D',1,5]],true,'Bangun ABCD'),o:['ABCD berbentuk persegi panjang.','Panjang AB adalah 4 satuan.','Luas ABCD adalah 12 satuan luas.','Keliling ABCD adalah 16 satuan.'],k:[0,1,2],p:'AB = 5 − 1 = <b>4 satuan</b> dan BC = 5 − 2 = 3 satuan, dengan sudut siku-siku, sehingga ABCD <b>persegi panjang</b>. Luas = 4 × 3 = <b>12 satuan luas</b>. Keliling = 2 × (4 + 3) = 14 satuan, bukan 16.'},
{d:'D',l:2,q:'Diagram batang berikut menunjukkan banyak siswa yang membawa bekal makanan selama lima hari. Banyak siswa yang membawa bekal 6 orang lebih banyak daripada hari Senin terjadi pada hari ....',f:barChart(['Senin','Selasa','Rabu','Kamis','Jumat'],[18,24,21,15,27],{max:30,step:3,lab:6,unit:'Banyak siswa',title:'Siswa yang Membawa Bekal'}),o:['Selasa','Rabu','Jumat','Kamis'],p:'Senin = 18 siswa. 18 + 6 = 24 siswa, yaitu hari <b>Selasa</b>.'},

{d:'B',l:1,q:'Hasil dari 8.400 : 35 + 16 × 25 adalah ....',o:['640','6.400','624','656'],p:'Pembagian dan perkalian dahulu: 8.400 : 35 = 240 dan 16 × 25 = 400. Jumlahnya 240 + 400 = <b>640</b>.'},
{d:'B',l:2,q:'Sebuah perpustakaan mempunyai 2.520 buku yang disusun sama banyak di 9 rak. Setiap rak terdiri atas 4 susun yang isinya sama banyak. Banyak buku pada setiap susun adalah ....',o:['70 buku','280 buku','63 buku','90 buku'],p:'Buku setiap rak = 2.520 : 9 = 280. Buku setiap susun = 280 : 4 = <b>70 buku</b>.'},
{d:'B',l:1,t:'mc',q:'Bilangan prima yang terletak di antara 20 dan 40 adalah ....',o:['23','29','37','27','39'],k:[0,1,2],p:'23, 29, dan 37 hanya habis dibagi 1 dan bilangan itu sendiri, jadi termasuk <b>bilangan prima</b>. 27 = 3 × 9 dan 39 = 3 × 13 bukan bilangan prima.'},
{d:'B',l:2,q:'Hasil dari 4{1/2} : {3/4} × {2/3} adalah ....',o:['4','6','2{1/4}','9'],p:'Kerjakan dari kiri: 4{1/2} : {3/4} = {9/2} × {4/3} = 6. Lalu 6 × {2/3} = <b>4</b>.'},
{d:'B',l:1,q:'Ibu membeli 2{1/2} kg telur dan 1{3/4} kg daging. Berat seluruh belanjaan ibu adalah ....',o:['4{1/4} kg','3{1/4} kg','4{3/4} kg','3{3/4} kg'],p:'2{1/2} + 1{3/4} = 2{2/4} + 1{3/4} = 3{5/4} = <b>4{1/4} kg</b>.'},
{d:'B',l:2,t:'bs',q:'Sebuah toko memberikan diskon 30% untuk semua barang. Harga awal sebuah tas Rp200.000 dan harga awal sepasang sepatu Rp150.000.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Harga tas setelah diskon Rp140.000.',1],['Besar diskon sepatu Rp45.000.',1],['Jika membeli tas dan sepatu, uang yang dibayar Rp245.000.',1],['Dengan uang Rp100.000, sepatu dapat dibeli setelah diskon.',0]],p:'Tas: 200.000 − 60.000 = <b>Rp140.000</b>. Diskon sepatu = 30% × 150.000 = <b>Rp45.000</b>, harga sepatu Rp105.000. Tas + sepatu = 140.000 + 105.000 = <b>Rp245.000</b>. Rp100.000 kurang dari Rp105.000, jadi tidak cukup (Salah).'},
{d:'B',l:2,q:'Dalam sebuah kotak terdapat 60 kelereng. Sebanyak 25% berwarna merah, {1/3} bagian berwarna biru, dan sisanya berwarna hijau. Banyak kelereng hijau adalah ....',o:['25 butir','35 butir','20 butir','15 butir'],p:'Merah = 25% × 60 = 15. Biru = {1/3} × 60 = 20. Hijau = 60 − 15 − 20 = <b>25 butir</b>.'},
{d:'B',l:1,q:'Hasil dari 2,35 + 1,8 − 0,95 adalah ....',o:['3,2','3,1','2,3','4,1'],p:'2,35 + 1,80 = 4,15. Lalu 4,15 − 0,95 = <b>3,20</b> atau 3,2.'},
{d:'B',l:3,q:'Pak Amin ronda setiap 4 hari, Pak Beni setiap 5 hari, dan Pak Candra setiap 6 hari. Mereka ronda bersama pada tanggal 1 Juli. Mereka akan ronda bersama lagi pada tanggal ....',o:['30 Agustus','31 Agustus','29 Agustus','1 September'],p:'KPK dari 4, 5, dan 6 adalah 60. Enam puluh hari setelah 1 Juli: sisa hari di bulan Juli = 30 hari (sampai 31 Juli), sisanya 30 hari di bulan Agustus. Jadi mereka ronda bersama lagi pada <b>30 Agustus</b>.'},
{d:'B',l:2,t:'mc',q:'Bu Sinta memiliki 48 donat cokelat dan 36 donat keju. Donat-donat itu dimasukkan ke dalam kotak sebanyak-banyaknya dengan isi setiap kotak sama. Pernyataan yang benar adalah ....',o:['Banyak kotak yang diperlukan 12 kotak.','Setiap kotak berisi 4 donat cokelat.','Setiap kotak berisi 3 donat keju.','Setiap kotak berisi 6 donat.'],k:[0,1,2],p:'Banyak kotak = FPB dari 48 dan 36 = <b>12</b>. Setiap kotak berisi 48 : 12 = <b>4 donat cokelat</b> dan 36 : 12 = <b>3 donat keju</b>, jadi 7 donat per kotak, bukan 6.'},
{d:'B',l:3,q:'Ayah memiliki uang Rp500.000. Sebanyak {2/5} bagian uangnya digunakan untuk membeli pupuk dan 30% untuk membeli bibit. Sisa uang ayah adalah ....',o:['Rp150.000','Rp350.000','Rp200.000','Rp100.000'],p:'Pupuk = {2/5} × 500.000 = 200.000. Bibit = 30% × 500.000 = 150.000. Sisa = 500.000 − 200.000 − 150.000 = <b>Rp150.000</b>.'},
{d:'A',l:1,q:'Perhatikan pola bilangan berikut.<br><b>2, 6, 18, 54, ...</b><br>Bilangan ke-6 pada pola tersebut adalah ....',o:['486','162','1.458','108'],p:'Setiap bilangan dikali 3: 2, 6, 18, 54, 162, <b>486</b>.'},
{d:'A',l:2,q:'Harga 4 pensil dan 2 buku adalah Rp22.000. Harga 1 buku Rp5.000. Harga 1 pensil adalah ....',o:['Rp3.000','Rp4.000','Rp2.500','Rp5.500'],p:'Harga 2 buku = Rp10.000. Harga 4 pensil = 22.000 − 10.000 = 12.000. Harga 1 pensil = 12.000 : 4 = <b>Rp3.000</b>.'},
{d:'A',l:3,t:'mc',q:'Persediaan makanan ternak cukup untuk 20 ekor sapi selama 15 hari. Pernyataan yang benar adalah ....',o:['Jika sapi menjadi 30 ekor, makanan cukup untuk 10 hari.','Jika sapi menjadi 10 ekor, makanan cukup untuk 30 hari.','Jika sapi menjadi 25 ekor, makanan cukup untuk 12 hari.','Jika banyak sapi bertambah, makanan cukup untuk waktu yang lebih lama.'],k:[0,1,2],p:'Ini perbandingan berbalik nilai: 20 × 15 = 300. 300 : 30 = <b>10 hari</b>, 300 : 10 = <b>30 hari</b>, 300 : 25 = <b>12 hari</b>. Makin banyak sapi, makanan justru makin cepat habis.'},
{d:'A',l:2,q:'Sinta dapat mengetik 45 kata setiap menit. Waktu yang diperlukan Sinta untuk mengetik 1.080 kata adalah ....',o:['24 menit','20 menit','25 menit','30 menit'],p:'Waktu = 1.080 : 45 = <b>24 menit</b>.'},
{d:'A',l:3,t:'bs',q:'Di sebuah gedung pertunjukan, baris pertama terdapat 12 kursi, baris kedua 15 kursi, baris ketiga 18 kursi, dan seterusnya selalu bertambah 3 kursi.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Baris ke-5 terdapat 24 kursi.',1],['Baris ke-10 terdapat 42 kursi.',0],['Jumlah kursi pada lima baris pertama 90 kursi.',1],['Banyak kursi pada setiap baris selalu kelipatan 3.',1]],p:'Baris 1–5: 12, 15, 18, 21, <b>24</b> (Benar). Baris ke-10 = 12 + 9 × 3 = 39, bukan 42 (Salah). 12 + 15 + 18 + 21 + 24 = <b>90</b> (Benar). Semua bilangan pola (12, 15, 18, ...) habis dibagi 3 (Benar).'},
{d:'G',l:1,q:'Jaring-jaring sebuah bangun ruang terdiri atas 2 lingkaran dan 1 persegi panjang. Bangun ruang tersebut adalah ....',o:['tabung','kerucut','prisma segitiga','bola'],p:'Dua lingkaran menjadi alas dan tutup, sedangkan persegi panjang menjadi selimut. Bangun itu adalah <b>tabung</b>.'},
{d:'G',l:1,t:'bs',q:'Tentukan benar atau salah setiap pernyataan tentang sifat bangun datar berikut!',s:[['Persegi panjang memiliki 2 simetri lipat.',1],['Semua sudut pada jajargenjang berbentuk siku-siku.',0],['Trapesium memiliki sepasang sisi sejajar.',1],['Layang-layang memiliki 4 sisi yang sama panjang.',0]],p:'Persegi panjang punya 2 simetri lipat (Benar). Sudut jajargenjang umumnya tidak siku-siku (Salah). Trapesium punya sepasang sisi sejajar (Benar). Layang-layang punya dua pasang sisi yang sama panjang, bukan empat sisi sama panjang (Salah).'},
{d:'G',l:2,q:'Luas sebuah persegi panjang 96 cm² dan lebarnya 8 cm. Keliling persegi panjang tersebut adalah ....',o:['40 cm','20 cm','48 cm','104 cm'],p:'Panjang = 96 : 8 = 12 cm. Keliling = 2 × (12 + 8) = <b>40 cm</b>.'},
{d:'G',l:3,q:'Perhatikan gambar bangun gabungan persegi panjang dan setengah lingkaran berikut! Luas bangun tersebut adalah .... (π = {22/7})',f:FIG.rsemi,o:['357 cm²','434 cm²','280 cm²','308 cm²'],p:'Luas persegi panjang = 20 × 14 = 280 cm². Setengah lingkaran berdiameter 14 cm (jari-jari 7 cm): {1/2} × {22/7} × 7 × 7 = 77 cm². Luas gabungan = 280 + 77 = <b>357 cm²</b>.'},
{d:'G',l:2,t:'mc',q:'Sebuah tabung memiliki jari-jari alas 7 cm dan tinggi 20 cm (π = {22/7}). Pernyataan yang benar adalah ....',o:['Luas alas tabung 154 cm².','Volume tabung 3.080 cm³.','Keliling alas tabung 44 cm.','Diameter alas tabung 7 cm.'],k:[0,1,2],p:'Luas alas = {22/7} × 7 × 7 = <b>154 cm²</b>. Volume = 154 × 20 = <b>3.080 cm³</b>. Keliling alas = {22/7} × 14 = <b>44 cm</b>. Diameter = 2 × 7 = 14 cm, bukan 7 cm.'},
{d:'G',l:3,q:'Sebuah bak berbentuk balok berukuran panjang 80 cm, lebar 50 cm, dan tinggi 60 cm. Bak diisi air dari keran yang mengalirkan 10 liter air setiap menit. Waktu yang diperlukan untuk mengisi bak sampai penuh adalah ....',o:['24 menit','2,4 menit','240 menit','40 menit'],p:'Volume bak = 80 × 50 × 60 = 240.000 cm³ = 240 liter. Waktu = 240 : 10 = <b>24 menit</b>.'},
{d:'G',l:2,t:'bs',q:'Jarak kota P ke kota Q adalah 150 km. Sebuah bus berangkat dari kota P pukul 07.30 dan tiba di kota Q pukul 10.00.<br>Tentukan benar atau salah setiap pernyataan berikut!',s:[['Lama perjalanan bus 2 jam 30 menit.',1],['Kecepatan rata-rata bus 60 km/jam.',1],['Jika kecepatan rata-ratanya 75 km/jam, bus tiba pukul 09.30.',1],['Dalam 1 jam pertama, bus menempuh 75 km.',0]],p:'07.30 sampai 10.00 = <b>2 jam 30 menit</b> = 2,5 jam. Kecepatan = 150 : 2,5 = <b>60 km/jam</b>. Dengan 75 km/jam, waktunya 150 : 75 = 2 jam, tiba pukul <b>09.30</b>. Dengan kecepatan 60 km/jam, dalam 1 jam bus menempuh 60 km, bukan 75 km (Salah).'},
{d:'G',l:2,q:'Hasil dari 2 jam 15 menit + 45 menit + 180 detik jika dinyatakan dalam menit adalah ....',o:['183 menit','180 menit','198 menit','195 menit'],p:'2 jam 15 menit = 135 menit. 180 detik = 3 menit. Jumlah = 135 + 45 + 3 = <b>183 menit</b>.'},
{d:'G',l:2,q:'Pada segitiga sama kaki PQR, sudut puncak P besarnya 40°. Besar sudut Q adalah ....',o:['70°','140°','40°','50°'],p:'Dua sudut alas segitiga sama kaki sama besar. ∠Q = ∠R = (180° − 40°) : 2 = <b>70°</b>.'},
{d:'G',l:3,q:'Titik K(2, 3) digeser 3 satuan ke kanan, lalu 2 satuan ke bawah, kemudian 1 satuan ke kiri. Koordinat akhir titik K adalah ....',o:['(4, 1)','(5, 1)','(4, 5)','(6, 1)'],p:'Nilai x: 2 + 3 − 1 = 4. Nilai y: 3 − 2 = 1. Koordinat akhir <b>(4, 1)</b>.'},
{d:'D',l:2,t:'bs',q:'Diagram lingkaran berikut menunjukkan mata pencaharian 400 warga sebuah desa.<br>Tentukan benar atau salah setiap pernyataan berikut!',f:pieChart([{t:'Petani',p:40,c:'#128A58'},{t:'Pedagang',p:25,c:'#E8622A'},{t:'Nelayan',p:20,c:'#2F6FEB'},{t:'Guru',p:15,c:'#C2366A'}],'Mata Pencaharian Warga'),s:[['Banyak warga yang bekerja sebagai petani 160 orang.',1],['Banyak warga yang bekerja sebagai nelayan dan guru 140 orang.',1],['Pedagang lebih banyak 30 orang daripada nelayan.',0],['Guru merupakan pekerjaan dengan jumlah warga paling sedikit.',1]],p:'Petani = 40% × 400 = <b>160</b> (Benar). Nelayan + guru = 35% × 400 = <b>140</b> (Benar). Pedagang 100 dan nelayan 80, selisihnya 20, bukan 30 (Salah). Guru 15% paling kecil (Benar).'},
{d:'D',l:2,t:'mc',q:'Tabel berikut menunjukkan nilai ulangan matematika siswa kelas 6. Pernyataan yang sesuai dengan tabel adalah ....',f:fig('<table class="dtab"><thead><tr><th>Nilai</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr></thead><tbody><tr><th>Banyak siswa</th><td>3</td><td>5</td><td>8</td><td>3</td><td>1</td></tr></tbody></table>','Nilai Ulangan Matematika'),o:['Banyak siswa seluruhnya 20 orang.','Modus data tersebut adalah 8.','Siswa yang mendapat nilai di atas 7 ada 12 orang.','Rata-rata nilai siswa adalah 8.'],k:[0,1,2],p:'Jumlah siswa = 3 + 5 + 8 + 3 + 1 = <b>20</b>. Nilai paling banyak muncul adalah <b>8</b>. Di atas 7: 8 + 3 + 1 = <b>12</b> siswa. Rata-rata = (18 + 35 + 64 + 27 + 10) : 20 = 154 : 20 = 7,7, bukan 8.'},
{d:'D',l:3,q:'Di dalam kantong terdapat 4 bola merah, 6 bola biru, dan 2 bola putih. Sebuah bola diambil secara acak. Pernyataan yang paling tepat adalah ....',o:['Bola biru paling mungkin terambil.','Kemungkinan terambil bola merah sama dengan bola biru.','Bola putih tidak mungkin terambil.','Kemungkinan terambil bola merah lebih besar daripada bola biru.'],p:'Bola biru paling banyak (6 dari 12), sehingga <b>paling mungkin terambil</b>. Merah (4) lebih sedikit daripada biru, dan bola putih tetap mungkin terambil walaupun hanya 2.'},
]}
);

d1:`<article class="teks"><h4>Warga Desa Sukamaju Tanam 1.000 Pohon Mangrove</h4>
<p><b>Demak</b> – Ratusan warga Desa Sukamaju bersama pelajar SD dan SMP menanam 1.000 bibit pohon mangrove di pantai desa, Minggu (8/3/2026). Kegiatan ini diprakarsai oleh kelompok nelayan setempat.</p>
<p>Menurut Pak Darmo, ketua kelompok nelayan, pantai desa terus terkikis ombak. "Dalam lima tahun, garis pantai mundur hampir 20 meter. Beberapa tambak warga sudah hilang," ujarnya.</p>
<p>Mangrove dipilih karena akarnya dapat menahan ombak dan lumpur. Selain itu, hutan mangrove menjadi tempat berkembang biak ikan, kepiting, dan udang.</p>
<p>Para pelajar diberi tugas merawat bibit selama tiga bulan pertama. Setiap bibit diberi papan kecil bertuliskan nama penanamnya.</p></article>`,
d2:`<article class="teks"><h4>Layang-Layang Raka</h4>
<p>Raka memandangi layang-layangnya yang tersangkut di pohon jambu Pak Harun. Layang-layang itu buatannya sendiri dari bambu dan kertas minyak berwarna merah.</p>
<p>"Panjat saja, Rak. Pak Harun sedang pergi," bisik Andi.</p>
<p>Raka ragu. Ia teringat pesan ayahnya untuk selalu meminta izin sebelum mengambil sesuatu dari tempat orang lain. Akhirnya, Raka memutuskan menunggu di depan pagar.</p>
<p>Sore harinya, Pak Harun pulang. Raka segera menghampiri dan meminta izin. Pak Harun tersenyum, lalu mengambilkan layang-layang itu dengan galah panjang. "Terima kasih sudah meminta izin, Nak. Ini, bawa juga beberapa jambu untuk ibumu," katanya.</p></article>`,

d5:`<article class="teks"><h4>Cara Mencuci Tangan dengan Sabun</h4>
<ol><li>Basahi kedua tangan dengan air mengalir.</li>
<li>Tuangkan sabun secukupnya ke telapak tangan.</li>
<li>Gosok kedua telapak tangan dan punggung tangan.</li>
<li>Gosok sela-sela jari dan ujung-ujung jari.</li>
<li>Gosok ibu jari secara berputar.</li>
<li>Bilas kedua tangan dengan air mengalir.</li>
<li>Keringkan tangan dengan handuk bersih atau tisu.</li></ol>
<p>Lakukan seluruh langkah selama 40–60 detik.</p></article>`,
d6:`<article class="teks"><h4>Lebah dan Kupu-Kupu</h4>
<p>Kupu-kupu suka memamerkan sayapnya yang berwarna-warni. "Lihatlah sayapku! Semua bunga senang kukunjungi," katanya kepada Lebah. Lebah hanya tersenyum dan terus bekerja mengumpulkan sari bunga.</p>
<p>"Untuk apa bekerja keras setiap hari? Lebih baik bermain bersamaku," ejek Kupu-kupu.</p>
<p>Musim hujan pun tiba. Hujan turun berhari-hari sehingga bunga-bunga rusak. Kupu-kupu kelaparan dan kedinginan. Ia teringat pada Lebah, lalu terbang dengan lemah ke sarang lebah.</p>
<p>Lebah menyambutnya dan memberinya sedikit madu. "Terima kasih, Lebah. Maafkan aku yang dulu mengejekmu," kata Kupu-kupu dengan malu. Sejak saat itu, Kupu-kupu ikut membantu Lebah mengumpulkan sari bunga.</p></article>`,
d7:`<article class="teks surat"><p style="text-align:right">Jakarta, 2 Mei 2026</p>
<p>Kepada<br>Yth. Bapak/Ibu Orang Tua/Wali Murid Kelas 6<br>SD Pelita Bangsa</p>
<p>Dengan hormat,</p>
<p>Sehubungan dengan akan dilaksanakannya Tes Kemampuan Akademik (TKA), kami mengundang Bapak/Ibu untuk menghadiri pertemuan orang tua/wali murid yang akan dilaksanakan pada:</p>
<dl><dt>hari/tanggal</dt><dd>Sabtu, 9 Mei 2026</dd><dt>waktu</dt><dd>08.00–10.00 WIB</dd><dt>tempat</dt><dd>Aula SD Pelita Bangsa</dd><dt>acara</dt><dd>Penjelasan persiapan TKA dan pembagian jadwal belajar tambahan</dd></dl>
<p>Mengingat pentingnya acara tersebut, kami mengharapkan kehadiran Bapak/Ibu tepat pada waktunya. Atas perhatian Bapak/Ibu, kami mengucapkan terima kasih.</p>
<p style="text-align:right">Hormat kami,<br>Kepala SD Pelita Bangsa</p></article>`,
d8:`<article class="teks"><h4>Ayo Membaca 15 Menit Setiap Hari!</h4>
<p>(1) Tahukah kamu bahwa membaca 15 menit setiap hari dapat menambah ratusan kosakata baru dalam setahun? (2) Membaca juga melatih daya ingat dan membuat kita lebih mudah memahami pelajaran. (3) Kamu bisa membaca buku cerita, majalah anak, atau ensiklopedia. (4) Menurut saya, buku cerita adalah bacaan yang paling seru. (5) Ayo, jadikan membaca sebagai kebiasaan sebelum tidur!</p></article>`,
e1:`<article class="teks"><h4>Asal Mula Kampung Pelangi</h4>
<p>Konon, di lereng Gunung Sari hidup seorang pemuda bernama Bayu. Ia pandai membuat kain tenun. Setiap kain buatannya berwarna cerah dan disukai warga.</p>
<p>Suatu hari, datang seorang saudagar kaya. "Tenunkan kain untukku saja. Aku akan membayarmu sepuluh kali lipat, asalkan kau tidak menenun untuk warga lagi," katanya.</p>
<p>Bayu menolak. "Kain ini kubuat agar semua orang bisa memakai pakaian yang indah, bukan hanya orang kaya," jawabnya. Saudagar itu pergi dengan marah.</p>
<p>Bayu kemudian mengajari warga cara menenun. Tak lama, setiap rumah menjemur kain tenun berwarna-warni di halaman. Dari kejauhan, kampung itu tampak seperti pelangi. Sejak itulah kampung tersebut dinamai Kampung Pelangi.</p></article>`,
e2:`<article class="teks"><h4>Pentas Seni Akhir Tahun SD Mekar Sari Berlangsung Meriah</h4>
<p><b>Bandung</b> – SD Mekar Sari menggelar pentas seni akhir tahun pada Sabtu, 20 Juni 2026. Acara yang berlangsung di lapangan sekolah itu dihadiri sekitar 400 orang tua dan warga sekitar.</p>
<p>Sebanyak 12 penampilan disajikan oleh siswa kelas 1 sampai kelas 6, antara lain tari jaipong, paduan suara, drama, dan pembacaan puisi. Penampilan yang paling meriah adalah drama "Si Kabayan" yang dibawakan siswa kelas 6.</p>
<p>Selain pentas, panitia juga menggelar bazar makanan tradisional. Hasil penjualan bazar sebesar Rp8.500.000 akan digunakan untuk menambah koleksi buku perpustakaan sekolah.</p></article>`,
e3:`<article class="teks puisi"><h4>Sahabat</h4>
<p>Kau datang saat aku sendiri<br>Menghapus sedih di dalam hati<br>Tawa kita riang berbagi<br>Suka dan duka kita lalui</p>
<p>Bagai pelangi sehabis hujan<br>Kau warnai hari-hariku, kawan<br>Semoga persahabatan kita<br>Abadi sampai kapan saja</p></article>`,
e4:`<article class="teks"><h4>Pengunjung Taman Kota Sejuk</h4><p style="text-indent:0">Diagram batang berikut menunjukkan banyak pengunjung Taman Kota Sejuk pada akhir pekan selama lima bulan.</p>${barChart(['Jan','Feb','Mar','Apr','Mei'],[12,9,15,18,14],{max:20,step:2,lab:4,unit:'Pengunjung (ratus orang)',title:'Pengunjung Taman Kota Sejuk'})}</article>`,
e5:`<article class="teks"><h4>Mengapa Kita Perlu Tidur Cukup?</h4>
<p>Tidur bukan hanya waktu untuk beristirahat. Saat kita tidur, otak menyimpan hal-hal yang telah dipelajari sepanjang hari. Tubuh juga memperbaiki sel-sel yang rusak dan menghasilkan hormon pertumbuhan.</p>
<p>Anak usia 6–12 tahun membutuhkan tidur sekitar 9–12 jam setiap malam. Anak yang kurang tidur biasanya sulit berkonsentrasi, mudah marah, dan lebih mudah sakit.</p>
<p>Agar tidur nyenyak, matikan televisi dan gawai satu jam sebelum tidur. Biasakan juga tidur dan bangun pada jam yang sama setiap hari.</p></article>`,
e6:`<article class="teks drama"><h4>Di Kantin Sekolah</h4>
<p><i>Latar: kantin sekolah saat jam istirahat.</i></p>
<p><b>Tia</b> : (menghitung uang) Aduh, uangku tinggal dua ribu. Tidak cukup untuk membeli nasi goreng.</p>
<p><b>Rafi</b> : Kenapa, Tia? Wajahmu murung sekali.</p>
<p><b>Tia</b> : Uang sakuku hilang separuh. Sepertinya jatuh di lapangan.</p>
<p><b>Rafi</b> : (tersenyum) Kita beli satu porsi nasi goreng, lalu kita makan berdua. Aku yang menambah uangnya.</p>
<p><b>Tia</b> : Sungguh? Terima kasih, Rafi! Besok aku ganti, ya.</p>
<p><b>Rafi</b> : Tidak usah. Nanti setelah makan, kita cari uangmu di lapangan bersama-sama.</p></article>`,
e7:`<article class="teks"><h4>Petunjuk Arah ke Perpustakaan Daerah</h4>
<p>Dari gerbang SD Harapan, belok kiri menuju Jalan Merdeka. Berjalanlah lurus sekitar 200 meter hingga menemukan perempatan dengan lampu lalu lintas. Di perempatan itu, belok kanan ke Jalan Diponegoro. Perpustakaan Daerah berada di sebelah kiri jalan, tepat di samping kantor pos dan di seberang taman kota.</p></article>`,
e8:`<article class="teks"><h4>Menjaga Kebersihan Sekolah</h4>
<p>(1) Kebersihan sekolah merupakan tanggung jawab seluruh warga sekolah. (2) Setiap pagi, siswa yang mendapat jadwal piket menyapu kelas dan membuang sampah. (3) Sampah dibuang ke tempat sampah sesuai jenisnya, yaitu sampah organik dan anorganik. (4) Sekolah juga mengadakan kerja bakti setiap hari Jumat. (5) Dengan lingkungan yang bersih, kegiatan belajar menjadi lebih nyaman.</p></article>`,
});

{x:'d1',d:'I',l:1,q:'Masalah yang dialami warga Desa Sukamaju adalah ....',o:['pantai desa terus terkikis ombak','ikan di laut semakin banyak','bibit mangrove sulit didapat','pelajar tidak mau ikut menanam'],p:'Pak Darmo menjelaskan bahwa <b>pantai desa terus terkikis ombak</b>: garis pantai mundur hampir 20 meter dalam lima tahun dan beberapa tambak hilang.'},
{x:'d1',d:'I',l:2,t:'mc',q:'Manfaat pohon mangrove menurut teks adalah ....',o:['menahan ombak','menahan lumpur','menjadi tempat berkembang biak ikan, kepiting, dan udang','menghasilkan buah untuk dijual'],k:[0,1,2],p:'Paragraf ketiga menyebutkan akar mangrove <b>menahan ombak dan lumpur</b>, dan hutan mangrove menjadi <b>tempat berkembang biak ikan, kepiting, dan udang</b>. Teks tidak menyebut buah untuk dijual.'},
{x:'d1',d:'I',l:3,q:'Setiap bibit diberi papan kecil bertuliskan nama penanamnya. Tujuan yang paling mungkin adalah ....',o:['agar setiap pelajar bertanggung jawab merawat bibit yang ditanamnya','agar bibit tidak terbawa ombak','agar pantai terlihat lebih indah','agar nelayan dapat menjual bibit tersebut'],p:'Pelajar ditugasi merawat bibit selama tiga bulan. Papan nama membuat setiap pelajar tahu bibit mana yang menjadi <b>tanggung jawabnya</b>.'},
{x:'d1',d:'I',l:2,q:'Kalimat utama paragraf ketiga adalah ....',o:['Mangrove dipilih karena akarnya dapat menahan ombak dan lumpur.','Selain itu, hutan mangrove menjadi tempat berkembang biak ikan, kepiting, dan udang.','Kegiatan ini diprakarsai oleh kelompok nelayan setempat.','Para pelajar diberi tugas merawat bibit selama tiga bulan pertama.'],p:'Paragraf ketiga membahas alasan mangrove dipilih. Kalimat pertamanya, <b>"Mangrove dipilih karena akarnya dapat menahan ombak dan lumpur"</b>, adalah kalimat utama; kalimat kedua hanya menambahkan penjelasan.'},
{x:'d1',d:'I',l:2,q:'Makna kata <i>diprakarsai</i> pada paragraf pertama adalah ....',o:['dimulai atau diusulkan pertama kali','dihentikan','dibiayai sepenuhnya','dilarang'],p:'Prakarsa berarti usaha yang mula-mula, atau inisiatif. Kegiatan <b>diprakarsai</b> kelompok nelayan berarti kelompok nelayanlah yang <b>pertama kali mengusulkan dan memulainya</b>.'},
{x:'d2',d:'S',l:2,q:'Watak Raka dalam cerita tersebut adalah ....',o:['jujur dan sopan','penakut dan pemalas','nakal dan suka mengambil barang orang','pemarah dan tidak sabar'],p:'Raka tidak memanjat pohon tanpa izin walaupun disarankan temannya, lalu meminta izin kepada Pak Harun. Sikap ini menunjukkan watak <b>jujur dan sopan</b>.'},
{x:'d2',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Layang-layang Raka dibeli di toko.',0],['Andi menyarankan Raka memanjat pohon.',1],['Raka memanjat pohon ketika Pak Harun pergi.',0],['Pak Harun memberi Raka beberapa buah jambu.',1]],p:'Layang-layang itu <b>buatan Raka sendiri</b> (Salah). Andi berbisik, "Panjat saja" (Benar). Raka memilih menunggu, tidak memanjat (Salah). Pak Harun memberikan jambu untuk ibu Raka (Benar).'},
{x:'d2',d:'S',l:3,q:'Amanat yang terkandung dalam cerita tersebut adalah ....',o:['Mintalah izin sebelum mengambil sesuatu dari tempat orang lain.','Buatlah layang-layang dari bahan yang kuat.','Jangan bermain layang-layang di dekat pohon.','Turutilah semua saran teman.'],p:'Raka mengingat pesan ayahnya dan memilih <b>meminta izin</b> sehingga Pak Harun menghargainya. Itulah pesan utama cerita.'},
{x:'d2',d:'S',l:1,q:'Layang-layang Raka tersangkut di ....',o:['pohon jambu Pak Harun','pohon mangga milik Andi','atap rumah Raka','pagar rumah Pak Harun'],p:'Kalimat pertama cerita menyebutkan layang-layang tersangkut di <b>pohon jambu Pak Harun</b>.'},
{x:'d2',d:'S',l:2,q:'Makna kata <i>ragu</i> dalam kalimat "Raka ragu." adalah ....',o:['belum yakin untuk memutuskan sesuatu','sangat gembira','merasa marah','sudah pasti'],p:'Ragu berarti <b>bimbang atau belum yakin</b>. Raka bimbang antara menuruti saran Andi atau mengikuti pesan ayahnya.'},
{x:'d3',d:'I',l:1,t:'mc',q:'Buah yang kandungan vitamin C-nya lebih dari 50 mg adalah ....',o:['jambu biji','jeruk','pepaya','pisang','apel'],k:[0,1,2],p:'Vitamin C: jambu biji 228 mg, jeruk 53 mg, pepaya 61 mg (semuanya lebih dari 50 mg). Pisang hanya 9 mg dan apel 5 mg.'},
{x:'d3',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai tabel!',s:[['Pisang menghasilkan energi paling besar.',1],['Kandungan serat jeruk sama dengan apel.',1],['Kandungan vitamin C pepaya lebih rendah daripada jeruk.',0],['Kandungan vitamin C jambu biji lebih dari empat kali jeruk.',1]],p:'Energi pisang 89 kkal, paling besar (Benar). Serat jeruk dan apel sama-sama 2,4 g (Benar). Vitamin C pepaya 61 mg, lebih tinggi daripada jeruk 53 mg (Salah). 4 × 53 = 212, dan 228 &gt; 212 (Benar).'},
{x:'d3',d:'I',l:3,q:'Dina mencari buah yang vitamin C-nya lebih dari 50 mg tetapi energinya paling rendah. Buah yang paling tepat dipilih Dina adalah ....',o:['pepaya','jeruk','jambu biji','apel'],p:'Buah dengan vitamin C lebih dari 50 mg: jambu biji (68 kkal), jeruk (47 kkal), dan pepaya (43 kkal). Energi paling rendah adalah <b>pepaya</b>. Apel vitamin C-nya hanya 5 mg.'},
{x:'d4',d:'S',l:2,q:'Pesan yang ingin disampaikan penyair melalui puisi "Laut" adalah ....',o:['Kita harus menjaga kebersihan laut.','Nelayan harus mencari ikan setiap hari.','Kita sebaiknya berlibur ke pantai.','Burung camar suka terbang pada pagi hari.'],p:'Bait kedua ditutup dengan "Akan kujaga engkau selalu / Agar tetap bersih dan biru". Pesannya: <b>kita harus menjaga kebersihan laut</b>.'},
{x:'d4',d:'S',l:2,t:'mc',q:'Larik yang menggambarkan benda atau hewan seolah-olah dapat berbuat seperti manusia adalah ....',o:['Ombak berlari ke tepi pantai','Camar menari di langit biru','Tempat nelayan mencari ikan','Wahai laut yang luas membentang'],k:[0,1],p:'Ombak yang <b>berlari</b> dan camar yang <b>menari</b> digambarkan seperti manusia (majas personifikasi). Nelayan mencari ikan adalah perbuatan manusia yang sebenarnya, dan "laut yang luas membentang" hanya menggambarkan keadaan laut.'},
{x:'d4',d:'S',l:1,q:'Kata yang maknanya sama dengan kata <i>membentang</i> adalah ....',o:['terhampar','tergulung','menyempit','tertutup'],p:'Membentang berarti <b>terhampar luas</b>. Tergulung dan menyempit justru berlawanan maknanya.'},
{x:'d4',d:'S',l:1,q:'Keinginan penyair untuk melindungi laut terdapat pada larik ....',o:['Akan kujaga engkau selalu','Membawa buih putih berderai','Menyambut pagi yang baru','Tempat nelayan mencari ikan'],p:'Larik <b>"Akan kujaga engkau selalu"</b> menunjukkan keinginan penyair untuk menjaga laut.'},
{x:'d5',d:'I',l:1,q:'Langkah yang dilakukan setelah menuangkan sabun ke telapak tangan adalah ....',o:['menggosok kedua telapak tangan dan punggung tangan','membasahi kedua tangan dengan air mengalir','membilas kedua tangan','mengeringkan tangan dengan handuk'],p:'Langkah kedua adalah menuangkan sabun. Langkah ketiga adalah <b>menggosok kedua telapak tangan dan punggung tangan</b>.'},
{x:'d5',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai teks!',s:[['Tangan dibasahi dengan air mengalir sebelum diberi sabun.',1],['Ibu jari digosok secara berputar.',1],['Tangan dikeringkan sebelum dibilas.',0],['Mencuci tangan cukup dilakukan selama 10 detik.',0]],p:'Langkah 1 membasahi tangan, langkah 2 memberi sabun (Benar). Langkah 5 menggosok ibu jari secara berputar (Benar). Tangan dibilas dahulu (langkah 6), baru dikeringkan (langkah 7) (Salah). Teks menyarankan 40–60 detik (Salah).'},
{x:'d5',d:'I',l:3,q:'Tangan dibilas dengan air mengalir, bukan dengan air di dalam baskom. Alasan yang paling tepat adalah ....',o:['agar kotoran dan kuman ikut terbuang bersama aliran air','agar sabun menjadi lebih wangi','agar tangan cepat kering','agar air di dalam baskom tidak habis'],p:'Air mengalir langsung membawa <b>kotoran dan kuman pergi</b>. Air di dalam baskom yang sama akan tercampur kotoran dari tangan.'},
{x:'d6',d:'S',l:2,q:'Watak Lebah dalam cerita tersebut adalah ....',o:['rajin dan pemaaf','sombong dan malas','pelit dan pemarah','penakut dan pemalu'],p:'Lebah terus bekerja mengumpulkan sari bunga (<b>rajin</b>) dan tetap menolong Kupu-kupu yang dulu mengejeknya (<b>pemaaf</b>).'},
{x:'d6',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Kupu-kupu mengejek Lebah yang bekerja keras.',1],['Bunga-bunga rusak karena musim kemarau.',0],['Lebah menolak membantu Kupu-kupu.',0],['Kupu-kupu meminta maaf kepada Lebah.',1]],p:'Kupu-kupu berkata, "Untuk apa bekerja keras setiap hari?" (Benar). Bunga rusak karena <b>musim hujan</b> (Salah). Lebah justru memberi madu (Salah). Kupu-kupu berkata, "Maafkan aku yang dulu mengejekmu" (Benar).'},
{x:'d6',d:'S',l:3,q:'Amanat yang dapat diambil dari cerita tersebut adalah ....',o:['Rajinlah bekerja dan jangan meremehkan orang lain.','Kita harus memiliki sayap yang indah.','Jangan keluar rumah saat musim hujan.','Kita tidak perlu menolong orang yang pernah mengejek.'],p:'Kupu-kupu yang malas dan suka mengejek akhirnya kesulitan, sedangkan Lebah yang rajin dapat menolong. Pesannya: <b>rajinlah bekerja dan jangan meremehkan orang lain</b>.'},
{x:'d6',d:'S',l:2,t:'mc',q:'Akibat datangnya musim hujan yang berhari-hari menurut cerita adalah ....',o:['bunga-bunga rusak','Kupu-kupu kelaparan','Kupu-kupu kedinginan','sarang lebah hanyut'],k:[0,1,2],p:'Paragraf ketiga menyebutkan hujan berhari-hari membuat <b>bunga-bunga rusak</b>, sehingga Kupu-kupu <b>kelaparan dan kedinginan</b>. Sarang lebah tidak hanyut; Kupu-kupu justru berlindung di sana.'},
{x:'d7',d:'I',l:1,q:'Tujuan surat tersebut adalah ....',o:['mengundang orang tua murid kelas 6 menghadiri pertemuan','mengumumkan hasil TKA','meminta murid kelas 6 belajar di aula','memberi tahu jadwal libur sekolah'],p:'Isi surat menyebutkan, "kami <b>mengundang</b> Bapak/Ibu untuk menghadiri pertemuan orang tua/wali murid".'},
{x:'d7',d:'I',l:2,t:'mc',q:'Informasi yang sesuai dengan isi surat adalah ....',o:['Pertemuan diadakan di aula sekolah.','Pertemuan berlangsung selama dua jam.','Surat ditulis oleh kepala sekolah.','Pertemuan wajib dihadiri murid kelas 6.'],k:[0,1,2],p:'Tempat pertemuan <b>Aula SD Pelita Bangsa</b>, pukul 08.00–10.00 (<b>dua jam</b>), dan surat ditandatangani <b>Kepala SD Pelita Bangsa</b>. Yang diundang adalah orang tua/wali murid, bukan murid.'},
{x:'d7',d:'I',l:2,q:'Kalimat yang berfungsi sebagai penutup isi surat tersebut adalah ....',o:['Atas perhatian Bapak/Ibu, kami mengucapkan terima kasih.','Dengan hormat,','Sehubungan dengan akan dilaksanakannya Tes Kemampuan Akademik (TKA), kami mengundang Bapak/Ibu ....','Jakarta, 2 Mei 2026'],p:'Penutup isi surat biasanya berisi ucapan terima kasih: <b>"Atas perhatian Bapak/Ibu, kami mengucapkan terima kasih."</b> "Dengan hormat" adalah salam pembuka, dan "Jakarta, 2 Mei 2026" adalah tempat dan tanggal surat.'},

{x:'d8',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai teks!',s:[['Kalimat (1) berupa kalimat tanya.',1],['Kalimat (4) merupakan opini.',1],['Menurut teks, kita hanya boleh membaca buku pelajaran.',0],['Teks tersebut bertujuan mengajak pembaca gemar membaca.',1]],p:'Kalimat (1) diawali "Tahukah kamu" dan diakhiri tanda tanya (Benar). Kalimat (4) diawali "Menurut saya", yaitu pendapat pribadi (Benar). Kalimat (3) menyebut buku cerita, majalah, dan ensiklopedia (Salah). Judul dan kalimat (5) berisi ajakan membaca (Benar).'},
{x:'d8',d:'I',l:3,q:'Judul lain yang paling sesuai untuk teks tersebut adalah ....',o:['Manfaat Membaca Setiap Hari','Cara Membuat Buku Cerita','Jadwal Tidur Anak Sekolah','Perpustakaan di Kotaku'],p:'Teks membahas manfaat membaca (menambah kosakata, melatih daya ingat) dan mengajak membaca setiap hari. Judul yang sesuai adalah <b>"Manfaat Membaca Setiap Hari"</b>.'},

{x:'e1',d:'S',l:2,q:'Alasan Bayu menolak tawaran saudagar adalah ....',o:['Bayu ingin semua orang dapat memakai pakaian yang indah.','Bayu tidak suka kepada orang kaya.','Bayaran dari saudagar terlalu sedikit.','Bayu ingin pindah ke kota.'],p:'Bayu berkata, "Kain ini kubuat agar <b>semua orang bisa memakai pakaian yang indah</b>, bukan hanya orang kaya."'},
{x:'e1',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Saudagar ingin Bayu hanya menenun untuknya.',1],['Bayu menerima tawaran saudagar.',0],['Bayu mengajari warga cara menenun.',1],['Kampung itu dinamai Kampung Pelangi karena sering muncul pelangi setelah hujan.',0]],p:'Saudagar meminta Bayu tidak menenun untuk warga lagi (Benar). Bayu menolak (Salah). Bayu mengajari warga menenun (Benar). Nama Kampung Pelangi berasal dari <b>kain berwarna-warni</b> yang dijemur warga (Salah).'},
{x:'e1',d:'S',l:3,q:'Amanat cerita "Asal Mula Kampung Pelangi" adalah ....',o:['Kita hendaknya berbagi kepandaian untuk kebaikan bersama.','Kita harus menjadi saudagar yang kaya.','Kain tenun hanya boleh dipakai orang kaya.','Kita sebaiknya tinggal di lereng gunung.'],p:'Bayu menolak bayaran besar dan justru mengajari warga menenun sehingga seluruh kampung menjadi indah. Pesannya: <b>berbagi kepandaian untuk kebaikan bersama</b>.'},

{x:'e2',d:'I',l:1,q:'Pentas seni akhir tahun SD Mekar Sari diadakan di ....',o:['lapangan sekolah','aula sekolah','perpustakaan sekolah','gedung kesenian kota'],p:'Paragraf pertama: "Acara yang berlangsung di <b>lapangan sekolah</b> itu ...."'},
{x:'e2',d:'I',l:2,t:'mc',q:'Pernyataan yang sesuai dengan isi berita adalah ....',o:['Pentas seni diikuti siswa kelas 1 sampai kelas 6.','Ada 12 penampilan dalam pentas seni.','Hasil bazar digunakan untuk menambah koleksi buku perpustakaan.','Penampilan paling meriah adalah paduan suara.'],k:[0,1,2],p:'Berita menyebut <b>12 penampilan</b> oleh <b>siswa kelas 1 sampai 6</b>, dan hasil bazar untuk <b>menambah buku perpustakaan</b>. Penampilan paling meriah adalah drama "Si Kabayan", bukan paduan suara.'},
{x:'e2',d:'I',l:2,q:'Pertanyaan yang jawabannya terdapat pada paragraf ketiga adalah ....',o:['Untuk apa hasil penjualan bazar digunakan?','Siapa yang membawakan drama "Si Kabayan"?','Kapan pentas seni dilaksanakan?','Berapa orang yang menghadiri acara?'],p:'Paragraf ketiga membahas bazar dan <b>kegunaan hasil penjualannya</b>. Pertanyaan lain dijawab di paragraf pertama dan kedua.'},
{x:'e2',d:'I',l:3,q:'Simpulan yang tepat berdasarkan berita tersebut adalah ....',o:['Pentas seni SD Mekar Sari berlangsung meriah dan hasilnya bermanfaat bagi sekolah.','Pentas seni hanya diikuti siswa kelas 6.','Bazar makanan tradisional tidak laku terjual.','Orang tua tidak tertarik menonton pentas seni.'],p:'Acara dihadiri sekitar 400 orang, menampilkan 12 penampilan, dan hasil bazar Rp8.500.000 dipakai untuk perpustakaan. Simpulannya: <b>acara meriah dan bermanfaat bagi sekolah</b>.'},
{x:'e3',d:'S',l:1,q:'Tema puisi "Sahabat" adalah ....',o:['persahabatan','keindahan alam','perpisahan','kerja keras'],p:'Puisi menceritakan sahabat yang menghapus sedih, berbagi tawa, dan diharapkan abadi. Temanya <b>persahabatan</b>.'},
{x:'e3',d:'S',l:2,q:'Larik yang mengandung majas perbandingan (menggunakan kata "bagai") adalah ....',o:['Bagai pelangi sehabis hujan','Kau datang saat aku sendiri','Tawa kita riang berbagi','Abadi sampai kapan saja'],p:'Majas perbandingan menyamakan dua hal dengan kata <i>bagai</i>, <i>seperti</i>, atau <i>laksana</i>. Larik <b>"Bagai pelangi sehabis hujan"</b> membandingkan sahabat dengan pelangi.'},
{x:'e3',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut tentang puisi "Sahabat"!',s:[['Puisi tersebut terdiri atas dua bait.',1],['Setiap bait terdiri atas empat larik.',1],['Bait pertama berima a-a-a-a.',1],['Puisi tersebut menceritakan kesedihan karena berpisah dengan sahabat.',0]],p:'Puisi terdiri atas 2 bait, masing-masing 4 larik (Benar, Benar). Bunyi akhir bait pertama: sendiri, hati, berbagi, lalui, semuanya berakhir bunyi <i>i</i> (Benar). Puisi berisi kebahagiaan bersahabat, bukan perpisahan (Salah).'},
{x:'e3',d:'S',l:3,q:'Makna larik "Kau warnai hari-hariku, kawan" adalah ....',o:['Sahabat membuat hari-hari penulis lebih ceria.','Sahabat pandai melukis dengan banyak warna.','Penulis dan sahabat suka mewarnai gambar.','Hari-hari penulis selalu turun hujan.'],p:'"Mewarnai hari-hari" adalah ungkapan kiasan yang berarti <b>membuat hari-hari lebih ceria dan menyenangkan</b>, bukan mewarnai dalam arti sebenarnya.'},
{x:'e4',d:'I',l:1,q:'Pengunjung Taman Kota Sejuk paling banyak terjadi pada bulan ....',o:['April','Maret','Mei','Januari'],p:'Batang tertinggi ada pada bulan <b>April</b>, yaitu 18 ratus atau 1.800 orang.'},
{x:'e4',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai diagram!',s:[['Pengunjung bulan Maret sebanyak 1.500 orang.',1],['Pengunjung bulan Februari paling sedikit.',1],['Pengunjung selalu meningkat setiap bulan dari Januari sampai Mei.',0],['Selisih pengunjung bulan April dan Januari adalah 600 orang.',1]],p:'Maret = 15 ratus = 1.500 (Benar). Februari 900 orang, paling sedikit (Benar). Pengunjung turun dari Januari ke Februari dan dari April ke Mei (Salah). April 1.800 − Januari 1.200 = 600 (Benar).'},
{x:'e4',d:'I',l:3,q:'Simpulan yang sesuai dengan diagram tersebut adalah ....',o:['Pengunjung meningkat dari Februari sampai April, lalu menurun pada bulan Mei.','Pengunjung selalu sama setiap bulan.','Pengunjung terus menurun sejak bulan Januari.','Pengunjung bulan Mei paling banyak.'],p:'Data: 1.200, 900, 1.500, 1.800, 1.400. Pengunjung <b>naik dari Februari sampai April</b>, lalu <b>turun pada Mei</b>.'},
{x:'e5',d:'I',l:1,q:'Menurut teks, anak usia 6–12 tahun membutuhkan tidur sekitar ....',o:['9–12 jam setiap malam','6–8 jam setiap malam','12–15 jam setiap malam','5 jam setiap malam'],p:'Paragraf kedua menyebutkan anak usia 6–12 tahun membutuhkan tidur <b>sekitar 9–12 jam setiap malam</b>.'},
{x:'e5',d:'I',l:2,t:'mc',q:'Akibat kurang tidur pada anak menurut teks adalah ....',o:['sulit berkonsentrasi','mudah marah','lebih mudah sakit','tubuh menjadi lebih tinggi'],k:[0,1,2],p:'Teks menyebut anak yang kurang tidur <b>sulit berkonsentrasi, mudah marah, dan lebih mudah sakit</b>. Hormon pertumbuhan justru dihasilkan saat tidur.'},
{x:'e5',d:'I',l:3,q:'Doni (11 tahun) tidur pukul 22.00 dan bangun pukul 05.30. Berdasarkan teks, pernyataan yang tepat adalah ....',o:['Waktu tidur Doni kurang dari kebutuhan anak seusianya.','Waktu tidur Doni sudah cukup.','Doni tidur lebih dari 12 jam.','Doni tidur tepat 9 jam.'],p:'Pukul 22.00 sampai 05.30 = 7 jam 30 menit. Kebutuhan anak 6–12 tahun adalah 9–12 jam, jadi tidur Doni <b>kurang dari kebutuhannya</b>.'},
{x:'e5',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai teks!',s:[['Saat tidur, otak menyimpan hal-hal yang telah dipelajari.',1],['Anak usia 6–12 tahun cukup tidur 6 jam setiap malam.',0],['Menonton televisi sebelum tidur membantu tidur lebih nyenyak.',0],['Tidur dan bangun pada jam yang sama merupakan kebiasaan yang baik.',1]],p:'Paragraf pertama menyebut otak menyimpan hal yang dipelajari (Benar). Kebutuhan tidur 9–12 jam (Salah). Televisi dan gawai sebaiknya dimatikan satu jam sebelum tidur (Salah). Teks menganjurkan tidur dan bangun pada jam yang sama (Benar).'},
{x:'e6',d:'S',l:1,q:'Latar tempat dan waktu drama tersebut adalah ....',o:['kantin sekolah saat jam istirahat','lapangan sekolah saat upacara','ruang kelas saat pelajaran','rumah Tia pada sore hari'],p:'Petunjuk latar di awal drama: <b>kantin sekolah saat jam istirahat</b>.'},

{x:'e6',d:'S',l:2,t:'mc',q:'Pernyataan yang sesuai dengan isi drama adalah ....',o:['Uang saku Tia hilang separuh.','Rafi menambah uang untuk membeli nasi goreng.','Tia dan Rafi akan mencari uang di lapangan.','Rafi meminta Tia mengganti uangnya besok.'],k:[0,1,2],p:'Tia berkata uang sakunya <b>hilang separuh</b>, Rafi berkata <b>"Aku yang menambah uangnya"</b>, dan mereka akan <b>mencari uang di lapangan</b>. Rafi justru berkata, "Tidak usah," saat Tia ingin mengganti.'},
{x:'e6',d:'S',l:1,q:'Keterangan dalam tanda kurung, seperti (tersenyum) dan (menghitung uang), dalam naskah drama disebut ....',o:['petunjuk lakuan','dialog','judul drama','amanat'],p:'Keterangan dalam tanda kurung menunjukkan gerak atau sikap tokoh dan disebut <b>petunjuk lakuan</b>. Dialog adalah percakapan antartokoh.'},
{x:'e7',d:'I',l:1,t:'mc',q:'Bangunan dan tempat yang letaknya dekat dengan Perpustakaan Daerah adalah ....',o:['kantor pos','taman kota','pasar','masjid'],k:[0,1],p:'Perpustakaan Daerah berada <b>di samping kantor pos</b> dan <b>di seberang taman kota</b>. Pasar dan masjid tidak disebutkan dalam petunjuk.'},

{x:'e8',d:'I',l:2,q:'Kalimat utama paragraf tersebut adalah kalimat nomor ....',o:['(1)','(2)','(4)','(5)'],p:'Kalimat (1) berisi gagasan umum bahwa kebersihan sekolah adalah tanggung jawab seluruh warga sekolah. Kalimat (2) sampai (5) menjelaskan gagasan itu. Jadi kalimat utamanya kalimat <b>(1)</b>.'},
{x:'e8',d:'I',l:2,q:'Kata <i>yaitu</i> pada kalimat (3) berfungsi untuk ....',o:['memberi penjelasan atau rincian','menyatakan pertentangan','menyatakan sebab','menyatakan waktu'],p:'Kata <i>yaitu</i> dipakai untuk <b>merinci atau menjelaskan</b>. Pada kalimat (3), <i>yaitu</i> merinci jenis sampah: organik dan anorganik.'},
{x:'e8',d:'I',l:1,t:'mc',q:'Kalimat yang penulisannya sesuai dengan kaidah ejaan adalah ....',o:['Sekolah kami mengadakan kerja bakti setiap hari Jumat.','Setiap pagi, siswa yang piket menyapu kelas.','sekolah kami mengadakan kerja bakti setiap hari jumat.','Sekolah Kami mengadakan Kerja Bakti setiap Hari Jumat.'],k:[0,1],p:'Huruf kapital dipakai di awal kalimat dan pada nama hari (<b>Jumat</b>), dan kalimat diakhiri tanda titik. Kedua kalimat pertama sudah benar. Kalimat ketiga tidak diawali huruf kapital dan menulis "jumat" dengan huruf kecil, sedangkan kalimat keempat memakai huruf kapital pada kata yang bukan nama (<i>Kami</i>, <i>Kerja Bakti</i>, <i>Hari</i>).'},

let MS=null;
function startMateri(dom){
  const cm=store.mapel||'mat';let pool=[];
  PAKET.filter(p=>mp(p)===cm).forEach(p=>p.soal.forEach(q=>{if(q.d===dom)pool.push(q)}));
  if(!pool.length)return;
  const soal=shuffle(pool).slice(0,Math.min(15,pool.length));
  MS={dom,mapel:cm,i:0,soal,ord:soal.map(q=>typ(q)==='bs'?null:shuffle(q.o.map((_,j)=>j))),ans:Array(soal.length).fill(null),chk:Array(soal.length).fill(false),right:0,wrong:0};
  SND.click();renderMateriQ();
}
function msFilled(i){const a=MS.ans[i];if(a===null||a===undefined)return false;return Array.isArray(a)?a.some(v=>v!==null&&v!==undefined):true}
function msComplete(i){const q=MS.soal[i],a=MS.ans[i];if(typ(q)!=='bs')return msFilled(i);return !!a&&q.s.every((_,j)=>a[j]===0||a[j]===1)}
function msRight(i){
  const q=MS.soal[i],a=MS.ans[i],t=typ(q);if(!msFilled(i))return false;
  if(t==='pg')return MS.ord[i][a]===0;
  if(t==='mc')return a.map(k=>MS.ord[i][k]).sort().join()===q.k.slice().sort().join();
  return q.s.every((st,j)=>a[j]===st[1]);
}
function msBody(i,locked){
  const q=MS.soal[i],t=typ(q),a=MS.ans[i];
  const text=`<div class="qtext">${fmt(q.q)}</div>`;let h='';
  if(t==='mc')h+='<p class="hint">Jawaban benar <b>lebih dari satu</b>. Centang semua jawaban yang benar.</p>';
  if(t==='bs'){
    h+=`<p class="hint">Pilih <b>Benar</b> atau <b>Salah</b> untuk setiap pernyataan.</p><div class="bs"><div class="bs-h"><span>Pernyataan</span><span>Benar</span><span>Salah</span></div>`;
    q.s.forEach((st,j)=>{const v=a?a[j]:null;
      h+=`<div class="bs-r"><div class="bs-t">${fmt(st[0])}</div>`;
      [1,0].forEach(val=>{let c='bs-b';if(locked){c+=' locked';if(st[1]===val)c+=' right';else if(v===val)c+=' wrong'}else if(v===val)c+=' sel';
        h+=`<button class="${c}" data-j="${j}" data-v="${val}" aria-pressed="${v===val}"${locked?' tabindex="-1"':''}><span class="bs-dot"></span>${val?'Benar':'Salah'}</button>`});
      h+='</div>'});
    h+='</div>';
  }else{
    h+=`<div class="opts" role="${t==='mc'?'group':'radiogroup'}">`;
    MS.ord[i].forEach((oi,k)=>{
      const on=t==='mc'?(a||[]).includes(k):a===k, key=t==='mc'?q.k.includes(oi):oi===0;
      let c='opt'+(t==='mc'?' multi':''),mk='';
      if(locked){c+=' locked';if(key){c+=' right';mk=(t==='mc'&&!on)?'<span class="miss">belum dipilih</span>':I.ok}else if(on){c+=' wrong';mk=I.no}}

  }
  if(!q.f&&!q.x)return text+h;
  return `<div class="split${q.x?' read':''}"><section class="ctx">${q.x?TEKS[q.x]:''}${q.f||''}</section><div class="qa">${text}${h}</div></div>`;
}
function msKeyText(i){
  const q=MS.soal[i],t=typ(q);
  if(t==='pg')return `Jawaban yang benar: <b>${LET[MS.ord[i].indexOf(0)]}. ${fmt(q.o[0])}</b>`;
  if(t==='mc')return `Jawaban yang benar: <b>${MS.ord[i].map((oi,k)=>q.k.includes(oi)?LET[k]:null).filter(Boolean).join(', ')}</b>`;

  </div>`;
  if(!locked){
    $('#scr-materi').querySelectorAll('.opt').forEach(b=>b.onclick=()=>msChoose(+b.dataset.k));

  }
  $('#matBack').onclick=()=>modal('Keluar dari latihan?','<p>Progres latihan materi ini tidak disimpan.</p>',[{t:'Tetap di sini',cls:'ghost'},{t:'Keluar',cls:'warm',fn:()=>{MS=null;renderHome()}}]);
  if($('#mNext'))$('#mNext').onclick=()=>{if(i===total-1)renderMateriSummary();else{MS.i++;renderMateriQ()}};
  show('materi');
}
function msAward(i){
  if(msRight(i)){MS.right++;SND.ok()}else{MS.wrong++;SND.no()}

function msChoose(k){
  const i=MS.i,t=typ(MS.soal[i]);if(MS.chk[i])return;
  if(t==='mc'){const a=(MS.ans[i]||[]).slice(),x=a.indexOf(k);if(x>=0)a.splice(x,1);else a.push(k);MS.ans[i]=a.sort();SND.click();renderMateriQ();return}

function msChooseBS(j,v){
