b6:`<article class="teks"><h4>Asal Mula Bukit Kembar</h4>
<p>Dahulu kala, di sebuah desa di kaki gunung, hiduplah dua saudara kembar bernama Laras dan Luri. Mereka terkenal rajin membantu warga. Namun, keduanya sering bertengkar karena hal kecil.</p>
<p>Suatu hari, desa dilanda kemarau panjang. Sumur-sumur mengering. Seorang kakek bijak berkata, "Di balik gunung ada mata air. Namun, jalan ke sana hanya bisa dilalui oleh dua orang yang saling bergandengan tangan."</p>
<p>Laras dan Luri berangkat bersama. Awalnya mereka berdebat tentang jalan yang harus dipilih. Akhirnya mereka sadar, pertengkaran hanya membuang waktu. Mereka pun bergandengan tangan melewati jurang dan hutan lebat hingga menemukan mata air.</p>
<p>Air mengalir deras menuju desa. Warga bersorak gembira. Namun, Laras dan Luri tidak pernah kembali. Keesokan harinya, di tempat mata air itu muncul dua bukit yang berdampingan. Warga menamainya Bukit Kembar dan percaya bahwa kedua saudara itu menjaga mata air untuk selamanya.</p></article>`,
b7:`<article class="teks"><h4>Mengapa Pelangi Muncul?</h4>
<p>Pelangi sering terlihat setelah hujan reda, terutama ketika matahari mulai bersinar kembali. Pelangi berbentuk lengkungan dengan susunan warna merah, jingga, kuning, hijau, biru, nila, dan ungu.</p>
<p>Pelangi terjadi karena cahaya matahari mengenai butiran air hujan yang masih melayang di udara. Butiran air itu membelokkan dan menguraikan cahaya putih matahari menjadi berbagai warna. Peristiwa ini disebut pembiasan cahaya.</p>
<p>Kita hanya dapat melihat pelangi jika posisi matahari berada di belakang kita dan butiran air ada di depan kita. Oleh karena itu, pelangi pada sore hari biasanya terlihat di langit sebelah timur.</p></article>`,

c1:`<article class="teks"><h4>Pipit dan Pohon Beringin</h4>
<p>Di tepi sungai berdiri sebuah pohon beringin tua. Daunnya lebat dan akarnya kuat. Banyak burung bersarang di sana, termasuk Pipit yang kecil dan lincah.</p>
<p>Suatu hari, datanglah Merak dengan bulunya yang indah. "Pohon ini sudah tua dan jelek. Lebih baik kalian pindah ke pohon cemara di bukit. Pohon itu jauh lebih cantik," ajak Merak. Beberapa burung pun mengikutinya.</p>
<p>Pipit memilih tetap tinggal. "Beringin ini sudah melindungi kita sejak dulu. Akarnya kuat, tak mudah tumbang," katanya.</p>
<p>Beberapa hari kemudian, angin kencang bertiup disertai hujan lebat. Pohon cemara di bukit patah dan sarang-sarang burung berjatuhan. Burung-burung itu kembali ke pohon beringin dengan basah kuyup. Pipit menyambut mereka dengan ramah. "Mari berlindung bersama," ujarnya.</p></article>`,
c2:`<article class="teks"><h4>Candi Borobudur</h4>
<p>Candi Borobudur terletak di Kabupaten Magelang, Jawa Tengah. Candi ini dibangun pada abad ke-8 hingga ke-9 Masehi pada masa Dinasti Syailendra. Borobudur merupakan candi Buddha terbesar di dunia.</p>
<p>Bangunan candi terdiri atas sepuluh tingkat. Dindingnya dihiasi 2.672 panel relief yang menceritakan kehidupan dan ajaran Buddha. Di bagian atas candi terdapat 72 stupa berlubang yang masing-masing berisi arca Buddha.</p>
<p>Pada tahun 1991, UNESCO menetapkan Candi Borobudur sebagai Warisan Dunia. Setiap tahun, jutaan wisatawan dari dalam dan luar negeri datang berkunjung. Pengunjung diminta tidak memanjat stupa dan tidak menyentuh relief agar candi tetap terjaga.</p></article>`,

c5:`<article class="teks"><h4>Membuat Es Buah Segar</h4>
<p><b>Bahan:</b> 1 buah melon kecil, 2 buah apel, 1 buah naga, 500 ml air matang dingin, 200 ml sirup, dan es batu secukupnya.<br><b>Alat:</b> pisau, talenan, mangkuk besar, dan sendok.</p>
<p><b>Cara membuat:</b></p>
<ol><li>Cuci semua buah hingga bersih.</li>
<li>Kupas melon dan buah naga, lalu potong dadu kecil.</li>
<li>Potong apel dadu kecil tanpa perlu dikupas.</li>
<li>Masukkan potongan buah ke dalam mangkuk besar.</li>
<li>Tuangkan air matang dan sirup, lalu aduk rata.</li>
<li>Tambahkan es batu. Es buah siap disajikan.</li></ol></article>`,
c6:`<article class="teks"><h4>Hari Pertama Nara</h4>
<p>Nara baru pindah dari Medan ke Surabaya. Hari Senin itu adalah hari pertamanya di sekolah baru. Tangannya dingin dan jantungnya berdebar kencang saat memasuki kelas 6B.</p>
<p>Bu Wati mempersilakan Nara duduk di samping Tika. Tika tersenyum dan menggeser tempat pensilnya. "Hai, aku Tika. Nanti istirahat kita ke kantin bersama, ya," bisiknya. Nara mengangguk pelan.</p>
<p>Saat istirahat, Tika mengenalkan Nara kepada teman-teman lain. Mereka mengajak Nara bermain lompat tali. Awalnya Nara sering tersangkut, tetapi teman-temannya tidak menertawakannya. Mereka justru mengajarinya.</p>
<p>Sepulang sekolah, Nara bercerita kepada ibunya dengan wajah berseri-seri. "Ternyata sekolah baru tidak menakutkan, Bu. Besok aku mau berangkat lebih pagi!"</p></article>`,
c7:`<article class="teks"><h4>Bersepeda ke Sekolah</h4>
<p>(1) Bersepeda ke sekolah memiliki banyak manfaat. (2) Menurut dokter, bersepeda selama 30 menit setiap hari dapat menguatkan jantung dan otot kaki. (3) Selain itu, sepeda tidak menghasilkan asap sehingga udara tetap bersih. (4) Menurut saya, bersepeda adalah kegiatan yang paling menyenangkan di dunia. (5) Namun, pesepeda harus memakai helm dan mematuhi rambu lalu lintas agar tetap aman.</p></article>`,

{x:'b5',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai jadwal!',s:[['Lomba menulis cerita pendek berlangsung selama dua setengah jam.',1],['Kegiatan yang berlangsung paling lama adalah pameran pojok baca kelas.',1],['Pengumuman pemenang dilaksanakan di perpustakaan.',0],['Lomba membaca puisi hanya boleh diikuti siswa kelas 6.',0]],p:'Lomba menulis 08.00–10.30 = 2{1/2} jam (Benar). Pameran 07.30–12.00 = 4{1/2} jam, paling lama (Benar). Pengumuman pemenang di <b>aula</b> (Salah). Lomba membaca puisi untuk <b>kelas 4–6</b> (Salah).'},
{x:'b5',d:'I',l:3,q:'Rina ingin mengikuti lomba membaca puisi dan lomba menulis cerita pendek. Rina harus datang ke sekolah untuk mengikuti kedua lomba itu pada hari ....',o:['Senin dan Rabu','Senin dan Selasa','Rabu dan Jumat','Selasa dan Kamis'],p:'Lomba membaca puisi diadakan hari <b>Senin</b> dan lomba menulis cerita pendek hari <b>Rabu</b>.'},
{x:'b6',d:'S',l:2,t:'mc',q:'Kesulitan yang dihadapi Laras dan Luri dalam perjalanan mencari mata air adalah ....',o:['berdebat tentang jalan yang harus dipilih','melewati jurang','melewati hutan lebat','dikejar binatang buas'],k:[0,1,2],p:'Paragraf ketiga menyebutkan mereka awalnya <b>berdebat tentang jalan</b>, lalu melewati <b>jurang</b> dan <b>hutan lebat</b>. Tidak ada bagian cerita tentang binatang buas.'},
{x:'b6',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Laras dan Luri sering bertengkar karena hal kecil.',1],['Kakek bijak ikut menemani Laras dan Luri mencari mata air.',0],['Laras dan Luri berhasil menemukan mata air setelah bekerja sama.',1],['Setelah menemukan mata air, Laras dan Luri pulang ke desa.',0]],p:'Paragraf pertama menyebut mereka sering bertengkar (Benar). Kakek hanya memberi petunjuk, tidak ikut (Salah). Mereka menemukan mata air setelah bergandengan tangan (Benar). Laras dan Luri <b>tidak pernah kembali</b> (Salah).'},
{x:'b6',d:'S',l:3,q:'Amanat cerita "Asal Mula Bukit Kembar" adalah ....',o:['Kerja sama dan kerukunan dapat mengatasi kesulitan.','Kita sebaiknya tinggal di kaki gunung.','Saudara kembar selalu memiliki sifat yang sama.','Kita harus pergi jauh untuk mencari air.'],p:'Laras dan Luri baru berhasil menemukan mata air setelah berhenti bertengkar dan saling bergandengan tangan. Pesannya: <b>kerja sama dan kerukunan dapat mengatasi kesulitan</b>.'},
{x:'b6',d:'S',l:2,q:'Bagian cerita yang menjelaskan asal-usul nama Bukit Kembar terdapat pada paragraf ....',o:['keempat','pertama','kedua','ketiga'],p:'Paragraf <b>keempat</b> menceritakan munculnya dua bukit berdampingan yang kemudian dinamai Bukit Kembar oleh warga.'},
{x:'b7',d:'I',l:1,q:'Menurut teks, pelangi terjadi karena ....',o:['cahaya matahari mengenai butiran air hujan di udara','awan hitam menutupi matahari','matahari terbenam di sebelah barat','hujan turun sangat deras'],p:'Paragraf kedua menjelaskan pelangi terjadi karena <b>cahaya matahari mengenai butiran air hujan</b> yang masih melayang di udara.'},
{x:'b7',d:'I',l:2,t:'mc',q:'Pernyataan yang sesuai dengan isi teks adalah ....',o:['Pelangi terdiri atas tujuh warna.','Pelangi sering terlihat setelah hujan reda.','Pelangi dapat dilihat ketika kita menghadap ke arah matahari.','Pembiasan cahaya menguraikan cahaya putih menjadi berbagai warna.'],k:[0,1,3],p:'Teks menyebut tujuh warna (merah, jingga, kuning, hijau, biru, nila, ungu), pelangi sering terlihat setelah hujan reda, dan pembiasan menguraikan cahaya putih. Pelangi terlihat jika matahari berada <b>di belakang</b> kita, bukan di depan.'},
{x:'b7',d:'I',l:3,q:'Pelangi pada sore hari biasanya terlihat di langit sebelah timur. Hal itu terjadi karena ....',o:['Pada sore hari matahari berada di barat, di belakang orang yang melihat pelangi.','Hujan hanya turun di sebelah timur.','Warna ungu lebih terang pada sore hari.','Matahari terbit dari sebelah timur.'],p:'Pelangi terlihat jika matahari ada di belakang kita. Sore hari matahari berada di <b>barat</b>, sehingga orang yang membelakangi matahari akan menghadap ke timur dan melihat pelangi di sana.'},
{x:'b8',d:'I',l:1,q:'Tujuan poster tersebut adalah ....',o:['mengajak siswa SD mengikuti lomba mewarnai','menjelaskan cara mewarnai yang baik','menceritakan pengalaman mengikuti lomba mewarnai','melaporkan pemenang lomba mewarnai'],p:'Poster diawali dengan ajakan "AYO IKUT!" dan berisi informasi lomba beserta cara mendaftar. Tujuannya <b>mengajak siswa SD mengikuti lomba mewarnai</b>.'},
{x:'b8',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi poster!',s:[['Peserta tidak perlu membayar biaya pendaftaran.',1],['Panitia menyediakan pensil warna untuk peserta.',0],['Siswa kelas 6 boleh mengikuti lomba ini.',1],['Siswa masih dapat mendaftar pada tanggal 25 April 2026.',0]],p:'Biaya <b>gratis</b> (Benar). Peserta membawa alat mewarnai sendiri; panitia hanya menyediakan kertas (Salah). Peserta kelas 1–6 (Benar). Pendaftaran paling lambat <b>20 April</b> (Salah).'},
{x:'b8',d:'I',l:3,q:'Kalimat ajakan yang paling sesuai dengan tema lomba pada poster adalah ....',o:['Ayo, warnai Indonesia yang bersih dan hijau bersama kami!','Taman Kota Sejahtera sangat luas dan indah.','Lomba mewarnai diadakan setiap tahun.','Kertas gambar disediakan oleh panitia.'],p:'Kalimat ajakan biasanya memakai kata "ayo" atau "mari". Kalimat <b>"Ayo, warnai Indonesia yang bersih dan hijau bersama kami!"</b> berisi ajakan dan sesuai dengan tema "Indonesiaku Bersih dan Hijau".'},
]},
{id:6,no:2,mapel:'bi',nama:'Perpustakaan Awan',warna:'#7A4FC9',art:'cloud',soal:[
{x:'c1',d:'S',l:1,q:'Tokoh yang mengajak burung-burung pindah ke pohon cemara adalah ....',o:['Merak','Pipit','Beringin','Kakek bijak'],p:'Paragraf kedua menyebutkan <b>Merak</b> datang dan mengajak burung-burung pindah ke pohon cemara di bukit.'},
{x:'c1',d:'S',l:2,q:'Watak Pipit dalam cerita tersebut adalah ....',o:['setia dan ramah','sombong dan mudah terpengaruh','penakut dan pemalas','pemarah dan pendendam'],p:'Pipit tetap tinggal di pohon beringin yang telah melindunginya (<b>setia</b>) dan menyambut burung-burung yang kembali dengan baik (<b>ramah</b>), padahal mereka dulu meninggalkan pohon itu.'},
{x:'c1',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Semua burung ikut pindah ke pohon cemara.',0],['Pipit tetap tinggal di pohon beringin.',1],['Pohon cemara patah karena angin kencang.',1],['Pipit menolak burung-burung yang kembali.',0]],p:'Hanya <b>beberapa</b> burung yang pindah (Salah). Pipit memilih tetap tinggal (Benar). Pohon cemara patah saat angin kencang (Benar). Pipit justru menyambut mereka dengan ramah (Salah).'},
{x:'c1',d:'S',l:3,q:'Amanat yang terkandung dalam cerita tersebut adalah ....',o:['Jangan mudah tergiur oleh penampilan luar yang indah.','Kita harus pindah rumah jika rumah sudah tua.','Burung merak adalah burung yang paling indah.','Kita sebaiknya tinggal di tepi sungai.'],p:'Burung-burung yang tergiur pohon cemara yang cantik justru kehilangan sarang, sedangkan pohon beringin yang tampak tua ternyata kuat. Pesannya: <b>jangan mudah tergiur oleh penampilan luar</b>.'},
{x:'c1',d:'S',l:2,q:'Makna kata <i>tumbang</i> dalam kalimat "Akarnya kuat, tak mudah tumbang" adalah ....',o:['roboh','tumbuh','layu','berbuah'],p:'Tumbang berarti <b>roboh</b> atau jatuh. Pohon yang akarnya kuat tidak mudah roboh ketika diterpa angin.'},
{x:'c2',d:'I',l:1,q:'Banyak stupa berlubang di bagian atas Candi Borobudur adalah ....',o:['72 stupa','10 stupa','2.672 stupa','1.991 stupa'],p:'Paragraf kedua menyebutkan terdapat <b>72 stupa berlubang</b>. Angka 2.672 adalah banyak panel relief, dan 10 adalah banyak tingkat candi.'},
{x:'c2',d:'I',l:2,t:'mc',q:'Informasi yang sesuai dengan isi teks adalah ....',o:['Candi Borobudur terletak di Jawa Tengah.','Candi Borobudur dibangun pada masa Dinasti Syailendra.','Relief pada dinding candi berjumlah 72 panel.','UNESCO menetapkan Borobudur sebagai Warisan Dunia pada tahun 1991.'],k:[0,1,3],p:'Borobudur terletak di Magelang, <b>Jawa Tengah</b>, dibangun pada masa <b>Dinasti Syailendra</b>, dan ditetapkan sebagai Warisan Dunia pada <b>1991</b>. Relief berjumlah 2.672 panel; angka 72 adalah banyak stupa berlubang.'},
{x:'c2',d:'I',l:3,q:'Pengunjung diminta tidak memanjat stupa dan tidak menyentuh relief. Tujuan larangan tersebut adalah ....',o:['agar candi tetap terjaga dan tidak rusak','agar pengunjung cepat pulang','agar wisatawan asing tidak datang','agar relief mudah difoto'],p:'Kalimat terakhir teks menyebutkan larangan itu dibuat <b>agar candi tetap terjaga</b>.'},
{x:'c2',d:'I',l:2,q:'Ide pokok paragraf kedua adalah ....',o:['bentuk dan hiasan bangunan Candi Borobudur','letak Candi Borobudur','penetapan Borobudur sebagai Warisan Dunia','jumlah wisatawan yang berkunjung'],p:'Paragraf kedua membahas tingkat candi, panel relief, dan stupa. Semuanya tentang <b>bentuk dan hiasan bangunan</b> candi.'},
{x:'c3',d:'I',l:1,q:'Jenis buku yang paling banyak dipinjam pada bulan Januari 2026 adalah ....',o:['cerita anak','komik pendidikan','buku pelajaran','ensiklopedia'],p:'Pada tabel, <b>cerita anak</b> dipinjam 120 kali, paling banyak dibandingkan jenis buku lainnya.'},
{x:'c3',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai tabel!',s:[['Komik pendidikan lebih banyak dipinjam daripada buku pelajaran.',1],['Jumlah ensiklopedia dan majalah anak yang dipinjam adalah 75 buku.',1],['Buku pelajaran merupakan buku yang paling sedikit dipinjam.',0],['Jumlah seluruh buku yang dipinjam adalah 350 buku.',1]],p:'Komik 95 &gt; buku pelajaran 60 (Benar). Ensiklopedia 40 + majalah 35 = 75 (Benar). Paling sedikit adalah <b>majalah anak</b> (35), bukan buku pelajaran (Salah). Jumlah 120 + 95 + 60 + 40 + 35 = 350 (Benar).'},
{x:'c3',d:'I',l:3,q:'Simpulan yang tepat berdasarkan tabel tersebut adalah ....',o:['Siswa lebih gemar meminjam buku cerita daripada buku jenis lainnya.','Perpustakaan tidak memiliki ensiklopedia.','Majalah anak tidak disukai oleh semua siswa.','Buku pelajaran tidak boleh dipinjam.'],p:'Cerita anak paling banyak dipinjam (120), sehingga dapat disimpulkan <b>siswa lebih gemar meminjam buku cerita</b>. Pilihan lain tidak sesuai data: ensiklopedia dan majalah tetap dipinjam, dan buku pelajaran juga dipinjam 60 kali.'},
{x:'c4',d:'S',l:1,q:'Tema puisi "Guruku" adalah ....',o:['jasa seorang guru','keindahan pagi hari','persahabatan di sekolah','kegiatan belajar di rumah'],p:'Puisi menceritakan guru yang menyambut murid, mengajar dengan sabar, dan jasanya tidak akan dilupakan. Temanya <b>jasa seorang guru</b>.'},
{x:'c4',d:'S',l:2,q:'Makna larik "Bagai pelita di tengah gelap" adalah ....',o:['Guru memberi petunjuk dan ilmu kepada murid.','Guru membawa lampu ke sekolah.','Guru mengajar pada malam hari.','Sekolah kekurangan lampu.'],p:'Pelita adalah lampu. Guru diibaratkan <b>pemberi cahaya</b>, yaitu ilmu dan petunjuk bagi murid yang belum tahu (gelap).'},
{x:'c4',d:'S',l:2,t:'mc',q:'Hal-hal yang dilakukan guru menurut puisi tersebut adalah ....',o:['menyambut murid dengan senyum','mengajari membaca, menulis, dan berhitung','membagikan hadiah kepada murid','mengajar dengan sabar'],k:[0,1,3],p:'Puisi menyebut guru <b>menyambut dengan senyum riang</b>, <b>sabar mengajari</b>, serta mengajarkan <b>membaca, menulis, dan berhitung</b>. Tidak ada larik tentang membagikan hadiah.'},
{x:'c5',d:'I',l:1,q:'Langkah yang dilakukan setelah memasukkan potongan buah ke dalam mangkuk besar adalah ....',o:['menuangkan air matang dan sirup, lalu mengaduk rata','mencuci semua buah hingga bersih','mengupas melon dan buah naga','memotong apel dadu kecil'],p:'Langkah keempat adalah memasukkan buah ke mangkuk. Langkah berikutnya (kelima) adalah <b>menuangkan air matang dan sirup, lalu mengaduk rata</b>.'},
{x:'c5',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai teks!',s:[['Semua buah harus dikupas sebelum dipotong.',0],['Buah dicuci sebelum dipotong.',1],['Es batu dimasukkan paling akhir.',1],['Air yang digunakan adalah air matang.',1]],p:'Apel dipotong <b>tanpa dikupas</b> (Salah). Buah dicuci pada langkah pertama sebelum dipotong (Benar). Es batu ditambahkan pada langkah terakhir (Benar). Teks menyebut 500 ml air matang dingin (Benar).'},
{x:'c5',d:'I',l:3,q:'Bu Sari ingin membuat es buah dua kali lipat dari resep tersebut. Sirup yang diperlukan adalah ....',o:['400 ml','200 ml','500 ml','1.000 ml'],p:'Satu resep memerlukan 200 ml sirup. Dua kali lipat = 2 × 200 ml = <b>400 ml</b>.'},
{x:'c6',d:'S',l:2,q:'Perasaan Nara pada awal cerita adalah ....',o:['cemas dan gugup','senang dan bangga','marah dan kesal','sedih dan kecewa'],p:'"Tangannya dingin dan jantungnya berdebar kencang" menunjukkan Nara <b>cemas dan gugup</b> di hari pertama sekolah.'},
{x:'c6',d:'S',l:1,q:'Latar tempat dan waktu pada paragraf pertama adalah ....',o:['kelas 6B pada hari Senin','kantin sekolah pada hari Minggu','rumah Nara di Medan pada pagi hari','lapangan sekolah pada hari Sabtu'],p:'Paragraf pertama menyebutkan hari <b>Senin</b>, hari pertama Nara saat memasuki <b>kelas 6B</b>.'},
{x:'c6',d:'S',l:3,q:'Perasaan Nara berubah menjadi gembira di akhir cerita. Penyebabnya adalah ....',o:['Teman-teman barunya bersikap ramah dan mau membantunya.','Nara pandai bermain lompat tali.','Ibunya menjemput Nara di sekolah.','Bu Wati memberi Nara hadiah.'],p:'Tika mengajaknya ke kantin, mengenalkannya kepada teman lain, dan teman-teman mengajarinya bermain lompat tali tanpa menertawakannya. Jadi perasaan Nara berubah karena <b>teman-temannya ramah dan mau membantu</b>.'},
{x:'c6',d:'S',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi cerita!',s:[['Nara pindah dari Surabaya ke Medan.',0],['Tika mengajak Nara ke kantin bersama.',1],['Teman-teman menertawakan Nara ketika tersangkut tali.',0],['Nara ingin berangkat ke sekolah lebih pagi keesokan harinya.',1]],p:'Nara pindah dari <b>Medan ke Surabaya</b> (Salah). Tika mengajak ke kantin saat istirahat (Benar). Teman-teman <b>tidak</b> menertawakan, justru mengajari (Salah). Nara berkata, "Besok aku mau berangkat lebih pagi!" (Benar).'},
{x:'c6',d:'S',l:3,t:'mc',q:'Sikap teman-teman Nara yang patut dicontoh adalah ....',o:['menyapa dan mengajak teman baru ke kantin','mengajari teman yang belum bisa bermain','menertawakan teman yang tersangkut tali','mengenalkan teman baru kepada teman lain'],k:[0,1,3],p:'Tika <b>menyapa dan mengajak</b> Nara ke kantin serta <b>mengenalkannya</b> kepada teman lain, dan teman-teman <b>mengajari</b> Nara bermain. Menertawakan teman tidak terjadi dalam cerita dan bukan sikap yang baik.'},
{x:'c7',d:'I',l:2,q:'Kalimat yang berisi opini (pendapat) dalam teks tersebut adalah kalimat nomor ....',o:['(4)','(2)','(3)','(5)'],p:'Kalimat (4) "Menurut saya, bersepeda adalah kegiatan yang paling menyenangkan di dunia" adalah <b>pendapat pribadi</b> penulis yang tidak dapat dibuktikan. Kalimat (2) memang diawali "Menurut dokter", tetapi isinya fakta yang dapat dibuktikan.'},
{x:'c7',d:'I',l:2,t:'mc',q:'Manfaat bersepeda ke sekolah menurut teks adalah ....',o:['menguatkan jantung','menguatkan otot kaki','menjaga udara tetap bersih','membuat pesepeda tidak perlu memakai helm'],k:[0,1,2],p:'Kalimat (2) menyebut bersepeda <b>menguatkan jantung dan otot kaki</b>, dan kalimat (3) menyebut sepeda tidak berasap sehingga <b>udara tetap bersih</b>. Kalimat (5) justru meminta pesepeda memakai helm.'},
{x:'c7',d:'I',l:1,q:'Kata <i>Namun</i> pada kalimat (5) menyatakan hubungan ....',o:['pertentangan','penambahan','sebab','waktu'],p:'Kalimat sebelumnya membahas hal-hal menyenangkan dari bersepeda, lalu kalimat (5) menyampaikan hal yang perlu diwaspadai. Kata <i>namun</i> menyatakan hubungan <b>pertentangan</b>.'},
{x:'c8',d:'I',l:1,t:'mc',q:'Perlengkapan yang wajib dibawa siswa sesuai pengumuman adalah ....',o:['senter','pakaian ganti','obat-obatan pribadi','tenda'],k:[0,1,2],p:'Pengumuman menyebut perlengkapan wajib: seragam Pramuka lengkap, <b>pakaian ganti</b>, perlengkapan ibadah, <b>senter</b>, dan <b>obat-obatan pribadi</b>. Tenda tidak disebutkan.'},
{x:'c8',d:'I',l:2,t:'bs',q:'Tentukan benar atau salah setiap pernyataan berikut sesuai isi pengumuman!',s:[['Kemah dilaksanakan selama dua hari.',1],['Siswa kelas 3 boleh mengikuti kemah.',0],['Formulir izin dikumpulkan kepada kepala sekolah.',0],['Bus berangkat setengah jam setelah waktu berkumpul.',1]],p:'Kemah hari Jumat–Sabtu, dua hari (Benar). Pengumuman ditujukan untuk kelas <b>4–6</b> (Salah). Formulir dikumpulkan kepada <b>Kak Dani</b> (Salah). Berkumpul 06.30, bus berangkat 07.00, selisih 30 menit (Benar).'},
{x:'c8',d:'I',l:3,q:'Doni baru ingat mengumpulkan formulir izin pada hari Selasa, 12 Mei 2026. Hal yang paling mungkin terjadi adalah ....',o:['Doni terlambat mengumpulkan formulir sehingga mungkin tidak dapat ikut kemah.','Kemah diundur menjadi hari Selasa.','Doni boleh berangkat dengan bus pukul 06.30.','Doni tidak perlu membawa senter.'],p:'Batas pengumpulan formulir adalah Senin, 11 Mei 2026. Selasa, 12 Mei sudah <b>lewat batas</b>, sehingga Doni mungkin tidak dapat ikut kemah.'},
{x:'c8',d:'I',l:2,q:'Penulisan kalimat yang sesuai dengan kaidah ejaan adalah ....',o:['Kami akan berkemah di Bumi Perkemahan Lembah Hijau pada hari Jumat.','kami akan berkemah di bumi perkemahan Lembah Hijau pada hari jumat.','Kami akan berkemah di Bumi perkemahan lembah hijau pada Hari Jumat.','Kami akan berkemah di bumi Perkemahan Lembah hijau pada hari jumat.'],p:'Huruf kapital dipakai di awal kalimat, pada setiap kata nama tempat (<b>Bumi Perkemahan Lembah Hijau</b>), dan pada nama hari (<b>Jumat</b>). Kata "hari" sebelum nama hari ditulis dengan huruf kecil.'},

let ac=null;
function tone(fr,dur=.1,type='sine',vol=.12){
  if(!store.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime;
    fr.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=t0+i*dur;o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.03)})}catch(e){}
}
const SND={click:()=>tone([660],.06,'triangle',.07),ok:()=>tone([660,880,1175],.09,'triangle'),no:()=>tone([300,220],.14,'sine',.1),win:()=>tone([523,659,784,1047,1319],.11,'triangle'),flag:()=>tone([520,440],.07,'square',.04)};

const Q=(s,i)=>PAKET[s.pid-1].soal[i];
/* jawaban: pg = indeks tampil, mc = array indeks tampil, bs = array 1/0/null per pernyataan */
function filled(s,i){const a=s.ans[i];if(a===null||a===undefined)return false;return Array.isArray(a)?a.some(v=>v!==null&&v!==undefined):true}
function complete(s,i){const q=Q(s,i),a=s.ans[i];if(typ(q)!=='bs')return filled(s,i);return !!a&&q.s.every((_,j)=>a[j]===0||a[j]===1)}
function rightOf(s,i){
  const q=Q(s,i),a=s.ans[i],t=typ(q);if(!filled(s,i))return false;
  if(t==='pg')return s.ord[i][a]===0;
  if(t==='mc')return a.map(k=>s.ord[i][k]).sort().join()===q.k.slice().sort().join();
  return q.s.every((st,j)=>a[j]===st[1]);
}
const isRight=i=>rightOf(S,i);
const lockedLat=(s,i)=>s.mode==='latihan'&&(typ(Q(s,i))==='pg'?filled(s,i):!!s.chk[i]);

function modal(title,body,actions){

  m.hidden=false;const last=box.lastElementChild;last&&last.focus();
}

/* ---------- ALUR MASUK SEPERTI APLIKASI TKA: Login → Konfirmasi Data → Konfirmasi Tes ---------- */
const STEPS=['Login','Konfirmasi Data Peserta','Konfirmasi Tes'];
const stepper=n=>`<ol class="stepper" aria-label="Tahapan masuk ujian">${STEPS.map((t,i)=>`<li class="${i<n?'done':i===n?'now':''}"${i===n?' aria-current="step"':''}><span>${i<n?'✓':i+1}</span><b>${t}</b></li>`).join('')}</ol>`;
const randTok=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('')};
let entry=null;
function renderReady(pid){
  entry={pid,no:`26-${String(pid).padStart(2,'0')}${String(Math.floor(Math.random()*900000)+100000)}`,pw:String(Math.floor(Math.random()*900000)+100000),token:randTok()};
  stepLogin();
}
function readyShell(n,title,sub,body){
  const p=PAKET[entry.pid-1];
  $('#scr-ready').innerHTML=`<div class="ready">${stepper(n)}
    <div class="ticket" style="--wc:${p.warna}">
      <div class="ticket-top"><div style="width:60px;flex:none">${owl(n===2?'happy':'idle')}</div><div><h2>${title}</h2><p>${sub}</p></div></div>
      <div class="ticket-body">${body}</div>
    </div></div>`;
  show('ready');
}
function stepLogin(){
  const p=PAKET[entry.pid-1];
  readyShell(0,'Login Peserta',`TKA SD/MI · ${MPN(p)} · Paket ${pno(p)} ${p.nama}`,`
    <div class="login-grid">
      <form class="lform" id="fLogin" novalidate>
        <div class="field"><label for="lgName">Nama peserta</label><input id="lgName" maxlength="24" autocomplete="off" required value="${esc(store.name||'')}" placeholder="Tulis nama panggilanmu"></div>
        <div class="field"><label for="lgUser">Username</label><input id="lgUser" value="${entry.no}" readonly></div>
        <div class="field"><label for="lgPass">Password</label><input id="lgPass" type="password" value="${entry.pw}" readonly></div>
        <p class="ferr" id="lgErr" role="alert" hidden></p>
        <div class="ready-actions"><button type="button" class="btn ghost" id="lgBack">Batal</button><button type="submit" class="btn warm">Login ${I.right}</button></div>
      </form>
      <aside class="kartu" aria-label="Kartu login peserta">
        <p class="kartu-h">KARTU LOGIN PESERTA</p>
        <dl><dt>Username</dt><dd>${entry.no}</dd><dt>Password</dt><dd>${entry.pw}</dd><dt>Mata ujian</dt><dd>${MPN(p)}</dd></dl>
        <p class="kartu-n">Pada TKA asli, username dan password ada di kartu peserta dari sekolah. Di simulasi ini sudah diisi otomatis.</p>
      </aside>
    </div>`);
  $('#lgBack').onclick=()=>{SND.click();renderHome()};
  $('#fLogin').onsubmit=e=>{e.preventDefault();const nm=$('#lgName').value.trim();
    if(!nm){$('#lgErr').textContent='Tulis namamu dulu, ya.';$('#lgErr').hidden=false;$('#lgName').focus();return}
    store.name=nm;persist();SND.click();stepData()};
  $('#lgName').focus();
}
function stepData(){
  const p=PAKET[entry.pid-1];
  readyShell(1,'Konfirmasi Data Peserta','Periksa datamu, lalu masukkan token dari pengawas.',`
    <div class="login-grid">
      <form class="lform" id="fData" novalidate>
        <table class="ctab"><tbody>
          <tr><th>Nomor peserta</th><td>${entry.no}</td></tr>
          <tr><th>Nama peserta</th><td>${esc(store.name)}</td></tr>
          <tr><th>Jenjang</th><td>SD/MI</td></tr>
          <tr><th>Mata ujian</th><td>${MPN(p)} (Paket ${pno(p)})</td></tr>
        </tbody></table>
        <div class="field"><label for="tkIn">Token</label><input id="tkIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="6 huruf" style="text-transform:uppercase;letter-spacing:.3em;font-family:var(--fd);font-size:1.2rem"></div>
        <p class="ferr" id="tkErr" role="alert" hidden></p>
        <div class="ready-actions"><button type="button" class="btn ghost" id="dBack">Kembali</button><button type="submit" class="btn warm">Submit ${I.right}</button></div>
      </form>
      <aside class="board" aria-label="Papan token pengawas">
        <p class="board-h">Papan pengawas</p>
        <p class="board-t">TOKEN</p>
        <p class="board-v" id="tkShow">${entry.token}</p>
        <p class="board-n">Token dibacakan atau ditulis oleh pengawas di ruang ujian. Ketik token ini di kolom Token.</p>
      </aside>
    </div>`);
  $('#dBack').onclick=()=>{SND.click();stepLogin()};
  $('#tkIn').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');$('#tkErr').hidden=true});
  $('#fData').onsubmit=e=>{e.preventDefault();const v=$('#tkIn').value.trim().toUpperCase();
    if(v!==entry.token){SND.no();$('#tkErr').textContent=v?'Token belum sesuai. Lihat lagi papan pengawas, huruf per huruf.':'Token belum diisi. Lihat papan pengawas di samping.';$('#tkErr').hidden=false;$('#tkIn').focus();return}
    SND.ok();stepTes()};
  $('#tkIn').focus();
}
function stepTes(){
  const p=PAKET[entry.pid-1],tc={pg:0,mc:0,bs:0};p.soal.forEach(q=>tc[typ(q)]++);
  const now=new Date(),tgl=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),jam=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  readyShell(2,'Konfirmasi Tes','Data benar. Periksa informasi tes, lalu tekan Mulai.',`
    <table class="ctab"><tbody>
      <tr><th>Nama tes</th><td>TKA SD/MI · ${MPN(p)} (Simulasi Paket ${pno(p)})</td></tr>
      <tr><th>Status tes</th><td><span class="tag">Tes baru</span></td></tr>
      <tr><th>Tanggal tes</th><td>${tgl}</td></tr>
      <tr><th>Waktu tes</th><td>${jam}</td></tr>
      <tr><th>Alokasi waktu tes</th><td>${mode==='ujian'?'75 menit':'Tanpa batas (Mode Latihan)'}</td></tr>
      <tr><th>Jumlah soal</th><td>${N} soal: ${tc.pg} pilihan ganda, ${tc.mc} pilihan ganda kompleks, ${tc.bs} pilihan ganda kompleks kategori (Benar/Salah)</td></tr>
    </tbody></table>
    <div><h3 style="font-size:1.15rem;margin-bottom:8px">Petunjuk pengerjaan</h3>
    <ol class="rules">
      <li><b>Pilihan ganda:</b> pilih <b>satu</b> jawaban yang paling tepat.</li>
      <li><b>Pilihan ganda kompleks:</b> jawaban benar <b>lebih dari satu</b>. Centang semua jawaban yang benar.</li>
      <li><b>Pilihan ganda kompleks kategori:</b> tentukan Benar atau Salah untuk <b>setiap</b> pernyataan.</li>
      ${mode==='ujian'?`<li>Gunakan <b>Daftar Soal</b> untuk berpindah nomor. Centang <b>Ragu-ragu</b> jika belum yakin (tetap dinilai).</li>
      <li>Sisa waktu dihitung mundur. Saat waktu habis, jawaban dikumpulkan otomatis.</li>`:`<li>Pada soal kompleks, tekan <b>Periksa jawaban</b> setelah selesai memilih untuk melihat pembahasan.</li>`}
      <li>Tidak ada pengurangan nilai untuk jawaban salah, jadi isi semua soal. Tekan <b>Selesai Tes</b> jika sudah yakin.</li>
    </ol></div>
    <label class="tourchk"><input type="checkbox" id="wantTour"${store.toured?'':' checked'}> Tampilkan panduan layar ujian sebelum mulai (waktu belum berjalan)</label>
    <div class="ready-actions"><button class="btn ghost" id="tBack">Kembali</button><button class="btn warm" id="rGo">Mulai ${I.right}</button></div>`);
  $('#tBack').onclick=()=>{SND.click();stepData()};
  $('#rGo').onclick=()=>{
    S={v:2,pid:p.id,mode,name:store.name||'Sahabat',no:entry.no,ord:p.soal.map(q=>typ(q)==='bs'?null:shuffle(q.o.map((_,j)=>j))),ans:Array(N).fill(null),ragu:Array(N).fill(false),chk:Array(N).fill(false),
       cur:0,startAt:Date.now(),endAt:null,begun:false,xp:0,streak:0,bestStreak:0,warned:false,done:false,fs:1,cp:[]};
    saveS();SND.win();startExam(false,$('#wantTour').checked);
  };
}
function begin(){
  if(!S.begun){S.begun=true;S.startAt=Date.now()}
  if(S.mode==='ujian'&&!S.endAt)S.endAt=Date.now()+DUR*1000;
  saveS();startTimer();
}

/* ---------- panduan layar ujian (tur interaktif) ---------- */
function runTour(){
  const lat=S.mode==='latihan';
  const steps=[
    ['#qnoLbl','Nomor Soal','Menunjukkan nomor soal yang sedang kamu kerjakan dan bentuk soalnya.'],
    ['#fontGrp','Ukuran Font','Pilih ukuran huruf yang paling nyaman dibaca: kecil, sedang, atau besar.'],
    ['#timer',lat?'Waktu Berjalan':'Sisa Waktu',lat?'Menunjukkan berapa lama kamu sudah berlatih.':'Waktu dihitung mundur dari 75 menit. Jika habis, jawaban dikumpulkan otomatis.'],
    ['#openNav, #nav','Daftar Soal','Lihat semua nomor soal dan pindah ke nomor mana pun. Warnanya menunjukkan soal yang sudah dijawab atau ragu-ragu.'],
    ['#qcard .ctx, #qcard .qtext','Konteks Soal','Baca konteksnya dulu: cerita, gambar, tabel, atau diagram. Informasi penting ada di sini.'],
    ['#qcard .opts, #qcard .bs','Pilihan Jawaban','Pilih jawabanmu. Perhatikan petunjuknya: satu jawaban, lebih dari satu, atau Benar/Salah.'],
    ['#bPrev','Soal Sebelumnya','Kembali ke soal sebelumnya.'],
    [lat?'#streak':'#bRagu',lat?'Jawaban Beruntun':'Ragu-ragu',lat?'Jawab benar berturut-turut untuk poin bonus.':'Centang jika kamu belum yakin. Nomor soal akan berwarna kuning, dan jawabannya tetap dinilai.'],
    ['#bNext','Soal Berikutnya','Lanjut ke soal berikutnya. Di soal terakhir, tombol ini berubah menjadi Selesai.'],
  ];
  const vis=sel=>[...document.querySelectorAll(sel)].find(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.top<innerHeight&&r.bottom>-2000});
  const list=steps.map(s=>[vis(s[0]),s[1],s[2]]).filter(s=>s[0]);
  const block=document.createElement('div');block.className='tour-block';
  const hl=document.createElement('div');hl.className='tour-hl';
  const tip=document.createElement('div');tip.className='tour-tip';tip.setAttribute('role','dialog');tip.setAttribute('aria-live','polite');
  document.body.append(block,hl,tip);
  let i=0;
  const end=()=>{block.remove();hl.remove();tip.remove();store.toured=true;persist();window.removeEventListener('resize',place);begin();
    toast(S.mode==='ujian'?'Waktu mulai berjalan. Selamat mengerjakan!':'Selamat berlatih!')};
  function place(){
    const [el,t,d]=list[i],r=el.getBoundingClientRect(),pad=6;
    Object.assign(hl.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    tip.innerHTML=`<p class="tour-n">Panduan ${i+1} dari ${list.length}</p><h3>${t}</h3><p>${d}</p><div class="mact"><button class="btn ghost small" id="tSkip">Lewati</button><button class="btn small warm" id="tNext">${i===list.length-1?'Mulai mengerjakan':'Lanjut'}</button></div>`;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    let top=r.bottom+14;if(top+th>innerHeight-8)top=r.top-th-14;if(top<8)top=Math.max(8,Math.min(innerHeight-th-8,r.top+14));
    tip.style.top=top+'px';tip.style.left=Math.max(12,Math.min(innerWidth-tw-12,r.left+r.width/2-tw/2))+'px';
    $('#tSkip').onclick=end;$('#tNext').onclick=()=>{SND.click();i++;if(i>=list.length)end();else show1()};
    $('#tNext').focus();
  }
  function show1(){const el=list[i][0];const r=el.getBoundingClientRect();
    if(getComputedStyle(el).position!=='fixed'&&!el.closest('.xbar,.xfoot')&&(r.top<80||r.bottom>innerHeight-90))el.scrollIntoView({block:'center'});
    setTimeout(place,180)}
  window.addEventListener('resize',place);
  if(!list.length)end();else show1();
}
function cheer(){
  const n=S.ans.filter((_,j)=>filled(S,j)).length;S.cp=S.cp||[];
  const m={10:'Sudah 10 soal terjawab. Terus semangat!',20:'20 soal beres! Tinggal sedikit lagi.',30:'Semua soal sudah terjawab! Cek soal ragu-ragu, lalu tekan Selesai.'};
  if(m[n]&&!S.cp.includes(n)){S.cp.push(n);saveS();toast(m[n],2600);if(n===30)SND.win()}
}

const FS=[[.92,'Kecil'],[1,'Sedang'],[1.18,'Besar']];
const fontGrp=(id,cls)=>`<div class="fontgrp ${cls||''}"${id?` id="${id}"`:''} role="group" aria-label="Ukuran font">${FS.map(([v,l],k)=>`<button data-fs="${v}" aria-label="Ukuran font ${l}" aria-pressed="false" style="font-size:${13+k*3}px">A</button>`).join('')}</div>`;

/* ---------- tampilan soal (dipakai ujian & pembahasan) ---------- */
function qBody(s,i,locked){
  const q=Q(s,i),t=typ(q),a=s.ans[i];
  const text=`<div class="qtext">${fmt(q.q)}</div>`;
  let h='';
  if(t==='mc')h+='<p class="hint">Jawaban benar <b>lebih dari satu</b>. Centang semua jawaban yang benar.</p>';
  if(t==='bs'){
    h+=`<p class="hint">Pilih <b>Benar</b> atau <b>Salah</b> untuk setiap pernyataan.</p><div class="bs"><div class="bs-h"><span>Pernyataan</span><span>Benar</span><span>Salah</span></div>`;
    q.s.forEach((st,j)=>{const v=a?a[j]:null;
      h+=`<div class="bs-r"><div class="bs-t">${fmt(st[0])}</div>`;
      [1,0].forEach(val=>{let c='bs-b';if(locked){c+=' locked';if(st[1]===val)c+=' right';else if(v===val)c+=' wrong'}else if(v===val)c+=' sel';
        h+=`<button class="${c}" data-j="${j}" data-v="${val}" aria-pressed="${v===val}" aria-label="Pernyataan ${j+1}: ${val?'Benar':'Salah'}"${locked?' tabindex="-1"':''}><span class="bs-dot"></span>${val?'Benar':'Salah'}</button>`});
      h+='</div>'});
    h+='</div>';
  }else{
    h+=`<div class="opts" role="${t==='mc'?'group':'radiogroup'}" aria-label="Pilihan jawaban">`;
    s.ord[i].forEach((oi,k)=>{
      const on=t==='mc'?(a||[]).includes(k):a===k, key=t==='mc'?q.k.includes(oi):oi===0;
      let c='opt'+(t==='mc'?' multi':''),mk='';
      if(locked){c+=' locked';if(key){c+=' right';mk=(t==='mc'&&!on)?'<span class="miss">belum dipilih</span>':I.ok}else if(on){c+=' wrong';mk=I.no}}
      else if(on)c+=' sel';
      h+=`<button class="${c}" data-k="${k}" role="${t==='mc'?'checkbox':'radio'}" aria-checked="${on}"${locked?' tabindex="-1"':''}><span class="let">${t==='mc'&&on&&!locked?'✓':LET[k]}</span><span class="otx">${fmt(q.o[oi])}</span>${mk}</button>`;
    });
    h+='</div>';
  }
  if(!q.f&&!q.x)return text+h;
  let lab='Konteks soal';
  if(q.x){const idx=PAKET[s.pid-1].soal.map((z,j)=>z.x===q.x?j+1:0).filter(Boolean);lab=idx.length>1?`Bacaan untuk soal nomor ${idx[0]}–${idx[idx.length-1]}`:`Bacaan untuk soal nomor ${idx[0]}`}
  return `<div class="split${q.x?' read':''}"><section class="ctx" aria-label="${lab}"><p class="pem-l">${lab}</p>${q.x?TEKS[q.x]:''}${q.f||''}</section><div class="qa">${text}${h}</div></div>`;
}
function keyText(s,i){
  const q=Q(s,i),t=typ(q);
  if(t==='pg')return `Jawaban yang benar: <b>${LET[s.ord[i].indexOf(0)]}. ${fmt(q.o[0])}</b>`;
  if(t==='mc')return `Jawaban yang benar: <b>${s.ord[i].map((oi,k)=>q.k.includes(oi)?LET[k]:null).filter(Boolean).join(', ')}</b>`;
  const a=s.ans[i]||[];return `Pernyataan yang tepat: <b>${q.s.filter((st,j)=>a[j]===st[1]).length} dari ${q.s.length}</b>. Kunci ditandai hijau.`;
}

/* ---------- UJIAN ---------- */
function startExam(resumed,tour){
  const p=P();
  $('#scr-exam').innerHTML=`
  <header class="xbar" style="--wc:${p.warna}"><div class="wrap xbar-in">
    <div class="xtitle"><span class="badge">${pno(p)}</span><div><b>${p.nama}</b><small>${S.mode==='ujian'?'Mode Ujian':'Mode Latihan'} · ${MPN(p)}</small></div></div>
    <span class="timer" id="timer" title="${S.mode==='ujian'?'Sisa waktu':'Waktu berjalan'}"><small class="tl">${S.mode==='ujian'?'Sisa Waktu':'Waktu'}</small>${I.clock}<span id="tval">--:--</span></span>
    <div class="xtools">
      ${fontGrp('fontGrp','hide-s')}
      <button class="iconbtn hide-s" id="xSnd" aria-label="Suara">${store.sound?I.vol:I.mute}</button>
      <button class="navbtn only-m" id="openNav" aria-label="Daftar Soal">${I.grid}<span>Daftar Soal</span></button>
    </div>
  </div><div class="prog"><i id="prog"></i></div></header>
  <div class="wrap xgrid" style="--wc:${p.warna}">
    <main class="qcard" id="qcard" aria-live="polite"></main>
    <aside class="side" id="side" aria-label="Nomor soal">
      <div class="sheet-h"><h3>Daftar Soal</h3><button class="iconbtn" id="closeNav" aria-label="Tutup">✕</button></div>
      <div class="who"><small>Peserta</small><b>${esc(S.name)}</b><small>${S.no}</small></div>
      <div class="only-m"><h3 style="margin-bottom:8px">Ukuran font</h3>${fontGrp('','')}</div>
      <h3 class="only-d">Daftar Soal</h3>
      <div class="nav" id="nav"></div>
      <div class="legend">${S.mode==='ujian'?'<span><i style="background:var(--pri);border-color:var(--pri)"></i>Dijawab</span><span><i style="background:var(--sun);border-color:var(--sun)"></i>Ragu-ragu</span><span><i></i>Belum</span>':'<span><i style="background:var(--ok);border-color:var(--ok)"></i>Benar</span><span><i style="background:var(--bad);border-color:var(--bad)"></i>Salah</span><span><i></i>Belum</span>'}</div>
      <div class="side-actions">
        <button class="btn okb" id="btnFinish">Selesai Tes</button>
        <button class="btn ghost small" id="btnExit">Simpan &amp; keluar</button>
      </div>
    </aside>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <footer class="xfoot"><div class="wrap xfoot-in">
    <button class="btn ghost" id="bPrev">${I.left}<span class="lbl">Soal Sebelumnya</span></button>
    ${S.mode==='ujian'?'<button class="ragu" id="bRagu" aria-pressed="false"><span class="box"></span>Ragu-ragu</button>':`<span class="streak" id="streak" title="Jawaban benar berturut-turut">${I.fire}<span id="stv">0</span></span>`}
    <button class="btn" id="bNext"><span class="lbl">Soal Berikutnya</span>${I.right}</button>
  </div></footer>`;
  document.querySelectorAll('.only-d').forEach(e=>{if(matchMedia('(max-width:900px)').matches)e.hidden=true});
  $('#bPrev').onclick=()=>go(S.cur-1);
  $('#bNext').onclick=()=>{if(S.cur===N-1)askFinish();else go(S.cur+1)};
  if($('#bRagu'))$('#bRagu').onclick=()=>{S.ragu[S.cur]=!S.ragu[S.cur];SND.flag();saveS();renderQ();renderNav()};
  $('#btnFinish').onclick=askFinish;
  $('#btnExit').onclick=()=>modal('Simpan dan keluar?',`<p>Jawabanmu tersimpan dan bisa dilanjutkan dari halaman awal.${S.mode==='ujian'?' <b>Waktu ujian tetap berjalan</b>, seperti ujian sungguhan.':''}</p>`,[{t:'Tetap di sini',cls:'ghost'},{t:'Keluar',cls:'warm',fn:()=>{clearInterval(tick);saveS();renderHome()}}]);
  $('#openNav').onclick=()=>{$('#side').classList.add('open');$('#scrim').hidden=false};
  const closeNav=()=>{$('#side').classList.remove('open');$('#scrim').hidden=true};
  $('#closeNav').onclick=closeNav;$('#scrim').onclick=closeNav;
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{S.fs=+b.dataset.fs;SND.click();applyFs()});
  $('#xSnd').onclick=()=>{store.sound=!store.sound;persist();$('#xSnd').innerHTML=store.sound?I.vol:I.mute};
  applyFs();show('exam');renderQ();renderNav();updTimer();if(tour&&!resumed)setTimeout(runTour,250);else begin();
  if(resumed)toast('Misi dilanjutkan dari soal nomor '+(S.cur+1));
}
function applyFs(){$('#scr-exam').style.setProperty('--qs',S.fs||1);document.querySelectorAll('[data-fs]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.fs===(S.fs||1)));saveS()}
function go(i){if(i<0||i>=N)return;S.cur=i;saveS();SND.click();renderQ();renderNav();
  $('#side').classList.remove('open');$('#scrim').hidden=true;
  const top=$('#qcard').getBoundingClientRect().top;if(top<70||top>window.innerHeight)window.scrollTo({top:0,behavior:'smooth'})}
function renderQ(){
  const i=S.cur,q=P().soal[i],t=typ(q),lat=S.mode==='latihan',locked=lockedLat(S,i);
  let h=`<div class="qhead"><span class="qno" id="qnoLbl">Soal Nomor <b>${i+1}</b> <span>dari ${N}</span></span><span class="typechip">${TYP[t]}</span>`;
  if(lat)h+=`<span class="chip" style="background:${DCOL[q.d]};color:#fff">${DOM[q.d]}</span><span class="chip lv">${LVL[q.l]}</span>`;
  if(!lat&&S.ragu[i])h+='<span class="ragu-tag">Ragu-ragu</span>';
  h+='</div>'+qBody(S,i,locked);
  if(lat&&t!=='pg'&&!locked){const ready=t==='bs'?complete(S,i):filled(S,i);
    h+=`<div class="chkrow"><button class="btn okb" id="btnCheck"${ready?'':' disabled'}>Periksa jawaban</button><small>${ready?'Sudah yakin? Tekan untuk melihat hasilnya.':t==='bs'?'Isi semua pernyataan dulu, ya.':'Centang minimal satu jawaban.'}</small></div>`}
  if(lat&&locked){const ok=isRight(i);
    h+=`<div class="fb ${ok?'ok':'no'}"><div class="fb-h"><span style="width:46px;flex:none">${owl(ok?'happy':'sad')}</span><span>${ok?pick(['Tepat sekali!','Hebat, benar!','Mantap, kamu jago!','Keren, jawabanmu benar!']):pick(['Belum tepat, tidak apa-apa!','Hampir! Yuk lihat caranya.','Tetap semangat, pelajari pembahasannya.'])}</span>${ok&&S.lastXp?`<span class="xp">+${S.lastXp} poin</span>`:''}</div>
    ${ok?'':`<p style="font-weight:700">${keyText(S,i)}</p>`}
    <p class="pem-l">Pembahasan</p><div class="pem">${fmt(q.p)}</div></div>`}
  $('#qcard').innerHTML=h;
  if(!locked){
    $('#qcard').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k,b));
    $('#qcard').querySelectorAll('.bs-b').forEach(b=>b.onclick=()=>chooseBS(+b.dataset.j,+b.dataset.v));
    if($('#btnCheck'))$('#btnCheck').onclick=()=>{S.chk[i]=true;award(i,$('#btnCheck'))};
  }
  $('#bPrev').disabled=i===0;
  $('#bNext').innerHTML=i===N-1?'<span class="lbl">Selesai</span>'+I.right:'<span class="lbl">Soal Berikutnya</span>'+I.right;
  $('#bNext').className=i===N-1?'btn okb':'btn';
  if($('#bRagu'))$('#bRagu').setAttribute('aria-pressed',S.ragu[i]);
  if($('#stv'))$('#stv').textContent=S.streak;
  $('#prog').style.width=(S.ans.filter((_,j)=>filled(S,j)).length/N*100)+'%';
}
function award(i,el){
  const ok=isRight(i);
  if(ok){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);S.lastXp=10+Math.min(S.streak-1,5)*2;S.xp+=S.lastXp;SND.ok();
    const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='floatxp';f.textContent='+'+S.lastXp;f.style.left=Math.max(8,r.right-80)+'px';f.style.top=r.top+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
    if(S.streak===5||S.streak===10)toast(`${S.streak} benar berturut-turut! Bonus poin bertambah.`);
  }else{S.streak=0;S.lastXp=0;SND.no()}
  saveS();renderQ();renderNav();
  const fb=document.querySelector('.fb');if(fb&&fb.getBoundingClientRect().bottom>window.innerHeight-80)fb.scrollIntoView({behavior:'smooth',block:'center'});
}
function choose(k,btn){
  const i=S.cur,t=typ(P().soal[i]);
  if(lockedLat(S,i))return;
  if(t==='mc'){const a=(S.ans[i]||[]).slice(),x=a.indexOf(k);if(x>=0)a.splice(x,1);else a.push(k);S.ans[i]=a.sort();SND.click();saveS();renderQ();renderNav();return}
  S.ans[i]=k;
  if(S.mode==='latihan')award(i,btn);
  else{SND.click();saveS();renderQ();renderNav()}
}
function chooseBS(j,v){
  const i=S.cur,q=P().soal[i];if(lockedLat(S,i))return;
  const a=(S.ans[i]||q.s.map(()=>null)).slice();a[j]=a[j]===v?null:v;S.ans[i]=a;SND.click();saveS();renderQ();renderNav();
}
function renderNav(){
  $('#nav').innerHTML=S.ans.map((a,i)=>{let c='';const f=filled(S,i);
    if(S.mode==='latihan'){if(lockedLat(S,i))c=isRight(i)?'ok':'no';else if(f)c='ans'}else{if(S.ragu[i])c='rg';else if(f)c='ans'}
    if(i===S.cur)c+=' cur';
    return `<button class="${c}" data-i="${i}" aria-label="Soal ${i+1}${f?', sudah dijawab':''}${S.ragu[i]?', ragu-ragu':''}">${i+1}</button>`}).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  cheer();
}
function startTimer(){clearInterval(tick);updTimer();tick=setInterval(updTimer,1000)}
function updTimer(){
  const el=$('#timer');if(!el||$('#scr-exam').hidden)return;
  if(S.mode==='ujian'){
    if(!S.endAt){$('#tval').textContent=mmss(DUR);return}
    const rem=Math.round((S.endAt-Date.now())/1000);$('#tval').textContent=mmss(rem);
    el.classList.toggle('warn',rem<=600&&rem>300);el.classList.toggle('danger',rem<=300);
    if(rem<=300&&!S.warned){S.warned=true;saveS();toast('Sisa waktu 5 menit. Periksa soal yang masih kosong atau ragu-ragu.',3500)}
    if(rem<=0){clearInterval(tick);finish('timeout')}
  }else{$('#tval').textContent=mmss(Math.round((Date.now()-S.startAt)/1000))}
}
function askFinish(){
  const done=S.ans.filter((_,i)=>filled(S,i)).length,empty=N-done,rg=S.ragu.filter(Boolean).length;
  const part=P().soal.map((q,i)=>typ(q)==='bs'&&filled(S,i)&&!complete(S,i)?i+1:0).filter(Boolean);
  let msg=empty?`Masih ada <b>${empty} soal</b> yang belum dijawab. Soal kosong tidak mendapat nilai.`:(rg&&S.mode==='ujian'?'Semua soal sudah dijawab. Masih ada soal yang ditandai ragu-ragu, mau dicek dulu?':'Semua soal sudah dijawab. Kamu yakin ingin mengumpulkan?');
  if(part.length)msg+=`<br><br>Soal benar/salah nomor <b>${part.join(', ')}</b> belum diisi lengkap.`;
  const body=`<div class="mstats"><div><b>${done}</b><span>Dijawab</span></div><div><b>${empty}</b><span>Kosong</span></div><div><b>${S.mode==='ujian'?rg:S.streak}</b><span>${S.mode==='ujian'?'Ragu-ragu':'Beruntun'}</span></div></div><p style="margin-top:12px">${msg}</p>`;
  modal('Konfirmasi Selesai Tes',body,[{t:'Kembali',cls:'ghost',fn:()=>{const f=S.ans.findIndex((a,i)=>!complete(S,i)||S.ragu[i]);if(f>=0)go(f)}},{t:'Selesai Tes',cls:'okb',fn:()=>finish('user')}]);
}

/* ---------- HASIL ---------- */
function calc(){
  const qs=P().soal,dom={},lvl={},tp={};let right=0,empty=0;
  qs.forEach((q,i)=>{const t=typ(q);[[dom,q.d],[lvl,q.l],[tp,t]].forEach(([o,k])=>{o[k]=o[k]||[0,0];o[k][1]++});
    if(!filled(S,i))empty++;else if(isRight(i)){right++;dom[q.d][0]++;lvl[q.l][0]++;tp[t][0]++}});
  const score=Math.round(right/N*100),stars=score>=85?3:score>=70?2:score>=55?1:0;
  const kat=score>=85?['Istimewa','#128A58']:score>=70?['Baik','#2F6FEB']:score>=55?['Memadai','#B7791F']:['Kurang','#D33541'];
  const used=Math.round(((S.finishedAt||Date.now())-S.startAt)/1000);
  const xp=S.mode==='latihan'?S.xp+stars*10:right*10+stars*20;
  return {right,wrong:N-right-empty,empty,score,stars,kat,dom,lvl,tp,used:S.mode==='ujian'?Math.min(used,DUR):used,xp};
}
function finish(reason){
  clearInterval(tick);closeModal();
  if(S.mode==='latihan')P().soal.forEach((q,i)=>{if(typ(q)!=='pg'&&filled(S,i))S.chk[i]=true});
  S.done=true;S.finishedAt=Date.now();
  const r=calc();lastResult={S:JSON.parse(JSON.stringify(S)),r,reason};
  const b=store.best[S.pid];
  if(!b||r.score>b.score)store.best[S.pid]={score:r.score,stars:Math.max(r.stars,b?b.stars:0)};
  else if(r.stars>b.stars)b.stars=r.stars;
  store.xp+=r.xp;store.session=null;persist();
  renderResult();
}
function badgeSvg(color,path){return `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="${color}"/><circle cx="24" cy="24" r="17" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3" opacity=".7"/>${path}</svg>`}
function renderResult(){
  const {S:s,r,reason}=lastResult,p=PAKET[s.pid-1];
  const pct=a=>a&&a[1]?Math.round(a[0]/a[1]*100):0;
  const meter=(label,a,col)=>a?`<div class="meter"><div class="meter-top"><span>${label}</span><span>${a[0]}/${a[1]} benar</span></div><div class="bar"><i style="width:${pct(a)}%${col?';background:'+col:''}"></i></div></div>`:'';
  const msgs={Istimewa:'Luar biasa! Kamu sudah sangat siap menghadapi TKA. Pertahankan, ya!',Baik:'Bagus sekali! Sedikit lagi menuju Istimewa. Pelajari pembahasan soal yang salah.',Memadai:'Kamu sudah di jalur yang benar. Ulangi bagian yang masih salah supaya makin mantap.',Kurang:'Tidak apa-apa, justru dari sini kita belajar. Baca pembahasannya, lalu coba lagi!'};
  let B=[
    {on:r.right===N,t:'Sempurna',d:'Semua soal benar',c:'#F5B400',g:'<path d="M24 12l3.5 7.2 7.9 1.1-5.7 5.6 1.4 7.8L24 30l-7.1 3.7 1.4-7.8-5.7-5.6 7.9-1.1z" fill="#fff"/>'},
    {on:pct(r.dom.B)>=80,t:'Jago Bilangan',d:'Bilangan ≥ 80%',c:DCOL.B,g:'<text x="24" y="31" text-anchor="middle" style="font:800 20px var(--fb);fill:#fff">123</text>'},
    {on:pct(r.dom.A)>=80,t:'Ahli Pola',d:'Aljabar ≥ 80%',c:DCOL.A,g:'<text x="24" y="31" text-anchor="middle" style="font:800 20px var(--fb);fill:#fff">x+1</text>'},
    {on:pct(r.dom.G)>=80,t:'Arsitek Cilik',d:'Geometri ≥ 80%',c:DCOL.G,g:'<path d="M14 32h20L24 14z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>'},
    {on:!!r.dom.D&&r.dom.D[0]===r.dom.D[1],t:'Detektif Data',d:'Data & Peluang benar semua',c:DCOL.D,g:'<path d="M15 33V23M22 33V16M29 33V20M36 33V13" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'},
    {on:!!r.tp.mc&&r.tp.mc[0]===r.tp.mc[1]&&!!r.tp.bs&&r.tp.bs[0]===r.tp.bs[1],t:'Teliti Sekali',d:'Semua soal kompleks & benar/salah tepat',c:'#E8622A',g:'<circle cx="21" cy="21" r="8" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M27 27l7 7" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'},
    s.mode==='ujian'?{on:r.score>=70&&r.used<40*60,t:'Kilat',d:'Skor ≥ 70 di bawah 40 menit',c:'#2F6FEB',g:'<path d="M27 11L15 27h8l-3 11 13-17h-8z" fill="#fff"/>'}:{on:s.bestStreak>=5,t:'Beruntun',d:'5 benar berturut-turut',c:'#2F6FEB',g:'<text x="24" y="31" text-anchor="middle" style="font:800 19px var(--fb);fill:#fff">×5</text>'},
    {on:r.empty===0,t:'Pantang Menyerah',d:'Tidak ada soal kosong',c:'#128A58',g:'<path d="M24 12c1 4 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.6 2.8-6 .4 2 1.2 3.2 2.4 3.6-.7-4.6.5-8 .8-9.6z" fill="#fff"/>'},
  ];
  if(mp(p)==='bi')B=[B[0],
    {on:pct(r.dom.S)>=80,t:'Pembaca Cermat',d:'Teks Sastra ≥ 80%',c:DCOL.S,g:'<path d="M13 16q5-3 11 0q6-3 11 0v16q-6-3-11 0q-6-3-11 0z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>'},
    {on:pct(r.dom.I)>=80,t:'Pemburu Informasi',d:'Teks Informasi ≥ 80%',c:DCOL.I,g:'<circle cx="21" cy="21" r="8" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M27 27l7 7" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'},
    ...B.slice(5)];
  $('#scr-result').innerHTML=`<div class="res">
    <div class="res-hero">
      <div class="ring" style="--p:${r.score};--rc:${r.kat[1]}"><div><div><b>${r.score}</b><br><small>NILAI</small></div></div></div>
      <div>
        <p class="eyebrow">${reason==='timeout'?'Waktu habis · jawaban dikumpulkan otomatis':'Misi selesai'} · ${MPN(p)} Paket ${pno(p)} ${p.nama}</p>
        <h2>${r.stars>=2?'Hebat':'Terima kasih sudah berjuang'}, ${esc(s.name)}!</h2>
        ${starRow(r.stars)}
        <span class="kat"><i class="dot" style="background:${r.kat[1]};margin:0"></i>Kategori: ${r.kat[0]}</span>
        <p class="msg">${msgs[r.kat[0]]}</p>
      </div>
    </div>
    <div class="statrow">
      <div class="stat g"><b>${r.right}</b><span>Benar</span></div>
      <div class="stat r"><b>${r.wrong}</b><span>Salah</span></div>
      <div class="stat"><b>${r.empty}</b><span>Kosong</span></div>
      <div class="stat"><b>${mmss(r.used)}</b><span>Waktu</span></div>
      <div class="stat"><b style="color:var(--acc)">+${r.xp}</b><span>Poin</span></div>
    </div>
    <div class="two">
      <div class="panel"><h3>Nilai per materi</h3>${MAPEL[mp(p)].dom.map(k=>meter(DOM[k],r.dom[k],DCOL[k])).join('')}</div>
      <div class="panel"><h3>Nilai per bentuk soal</h3>${['pg','mc','bs'].map(k=>meter(TYP[k],r.tp[k],'var(--acc)')).join('')}</div>
    </div>
    <div class="panel"><h3>Nilai per level berpikir</h3>${[1,2,3].map(l=>meter(LVL[l],r.lvl[l])).join('')}
      <p style="color:var(--muted);font-size:.85rem;font-weight:600;margin-top:10px">Pemahaman = mengingat konsep, Aplikasi = memakai rumus pada soal cerita, Penalaran = memecahkan masalah yang butuh berpikir beberapa langkah.</p></div>
    <div class="panel"><h3>Lencana misi</h3><div class="badges">${B.map(b=>`<div class="bdg ${b.on?'':'off'}">${badgeSvg(b.c,b.g)}<b>${b.t}</b><small>${b.d}</small></div>`).join('')}</div></div>
    <div class="res-actions">
      <button class="btn" id="rvGo">Lihat pembahasan</button>
      <button class="btn warm" id="rAgain">Ulangi paket ini</button>
      <button class="btn ghost" id="rHome">Pilih paket lain</button>
    </div>
    <p class="note">Nilai dan kategori ini hanya perkiraan untuk latihan, bukan nilai resmi TKA. Soal pilihan ganda kompleks dan benar/salah dihitung benar jika seluruh isiannya tepat.</p>
  </div>`;
  $('#rvGo').onclick=()=>{rvFilter=r.wrong+r.empty?'wrong':'all';renderReview()};
  $('#rAgain').onclick=()=>{mode=s.mode;renderReady(s.pid)};
  $('#rHome').onclick=()=>renderHome();
  show('result');
  if(r.stars>=2){SND.win();confetti()}
}

/* ---------- PEMBAHASAN ---------- */
function renderReview(){
  const {S:s}=lastResult,p=PAKET[s.pid-1];
  const items=p.soal.map((q,i)=>({q,i,st:!filled(s,i)?'em':rightOf(s,i)?'ok':'no'})).filter(x=>rvFilter==='all'||(rvFilter==='wrong'&&x.st!=='ok')||(rvFilter==='ok'&&x.st==='ok'));
  $('#scr-review').innerHTML=`
  <div class="rv-head"><button class="btn ghost small" id="rvBack">${I.left} Kembali ke hasil</button>
    <div class="filters" role="group" aria-label="Saring soal">
      <button data-f="all" aria-pressed="${rvFilter==='all'}">Semua</button>
      <button data-f="wrong" aria-pressed="${rvFilter==='wrong'}">Salah &amp; kosong</button>
      <button data-f="ok" aria-pressed="${rvFilter==='ok'}">Benar</button>
    </div></div>
  <div class="rv-list">${items.length?items.map(({q,i,st})=>`
    <article class="rv">
      <div class="qhead"><span class="qno">Soal <b>${i+1}</b></span><span class="st ${st}">${st==='ok'?'Benar':st==='no'?'Salah':'Tidak dijawab'}</span><span class="typechip">${TYP[typ(q)]}</span><span class="chip" style="background:${DCOL[q.d]};color:#fff">${DOM[q.d]}</span><span class="chip lv">${LVL[q.l]}</span></div>
      ${qBody(s,i,true)}
      ${st==='ok'?'':`<p style="margin-top:10px;font-weight:700">${keyText(s,i)}</p>`}
      <div class="pembox"><p class="pem-l">Pembahasan</p><div class="pem">${fmt(q.p)}</div></div>
    </article>`).join(''):'<div class="panel" style="text-align:center"><p style="font-weight:700">Tidak ada soal pada pilihan ini.</p></div>'}</div>
  <div class="res-actions" style="margin-top:20px"><button class="btn warm" id="rvAgain">Ulangi paket ini</button><button class="btn ghost" id="rvHome">Ke halaman awal</button></div>`;
  $('#rvBack').onclick=renderResult;
  $('#rvAgain').onclick=()=>{mode=s.mode;renderReady(s.pid)};
  $('#rvHome').onclick=renderHome;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{rvFilter=b.dataset.f;renderReview()});
  show('review');
}

/* ---------- konfeti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.hidden=false;const W=c.width=innerWidth,H=c.height=innerHeight;
  const col=['#FFC23D','#E8622A','#2F6FEB','#128A58','#C2366A','#5B43D6'];
  const ps=Array.from({length:160},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:pick(col)}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(t-t0<3800)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(document.querySelector('.tour-tip'))return;
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  if($('#scr-exam').hidden||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4};
  if(k in map){const b=document.querySelector(`#qcard .opt[data-k="${map[k]}"]`);if(b){e.preventDefault();b.click()}}
  else if(e.key==='ArrowRight'){e.preventDefault();go(S.cur+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(S.cur-1)}
});
window.addEventListener('beforeunload',()=>{if(S&&!S.done)saveS()});

renderHome();
</script>
